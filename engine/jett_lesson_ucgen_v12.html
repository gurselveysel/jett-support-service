<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jett Öğretmen Çözümü</title>
<style>
  :root{
    --ink:#1f2937;
    --pen:#2F6BFF;            /* overwritten at boot from contract character profile */
    --pen-soft: rgba(47,107,255,.10);
    --paper:#fffdf8;
    --line:#e3ddca;
    --warn:#c0392b;
    --ok:#1f9d55;
    --warn-soft:#f0b429;
    --ok-soft:#35d187;
    --stage-max:clamp(320px, 62vw, 1040px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#11151c;font-family:Arial,Helvetica,sans-serif;color:var(--ink);}
  #app{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 10px 22px;min-height:100%;}
  h1{color:#e7ecf7;font-size:15px;font-weight:600;margin:2px 0 0;text-align:center;}
  .subtitle{color:#93a3c2;font-size:12px;margin:-6px 0 4px;text-align:center;}

  .stage-wrap{width:100%;max-width:var(--stage-max);background:#0c0f14;border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .stage-frame{position:relative;width:100%;background:radial-gradient(120% 140% at 50% 50%, #171d29 0%, #0c0f14 60%, #07090d 100%);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .stage-frame.mode-169{aspect-ratio:16/9;}
  .stage-frame.mode-916{aspect-ratio:9/16;max-width:clamp(280px, 46vw, 480px);margin:0 auto;}
  #masterSvg{width:100%;height:100%;display:block;}

  .caption-bar{position:absolute;left:0;right:0;bottom:0;background:rgba(15,18,26,.72);color:#fff;font-size:13px;line-height:1.4;padding:8px 12px;min-height:18px;display:flex;align-items:center;backdrop-filter:blur(2px);}
  #captionText{display:inline;}
  .caption-bar.force-hidden{display:none;}
  .caption-bar span.speaking{color:#ffd76a;}
  .caption-bar span.spoken{color:#bdd0f2;}
  #speakIndicator{position:absolute;right:10px;bottom:42px;font-size:15px;display:none;z-index:5;
    animation:speakPulse 1.1s ease-in-out infinite;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}
  #speakIndicator.show{display:block;}
  @keyframes speakPulse{0%,100%{opacity:.35;}50%{opacity:1;}}

  #errorOverlay{position:absolute;inset:0;background:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20;}
  #errorOverlay.show{display:flex;}
  #errorOverlay .box{max-width:380px;}
  #errorOverlay h2{color:var(--warn);font-size:16px;margin:0 0 8px;}
  #errorOverlay p{font-size:13px;color:#555;margin:0;white-space:pre-line;}

  .controls{width:100%;max-width:var(--stage-max);background:#171b24;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#e7ecf7;}
  .btn{border:none;border-radius:8px;background:#2a3040;color:#e7ecf7;font-size:13px;font-weight:600;padding:12px 14px;min-height:44px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .btn:hover{background:#343c50;}
  .btn.primary{background:var(--pen);color:#fff;}
  .btn.primary:hover{filter:brightness(.92);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.active{outline:2px solid var(--pen);}
  .btn:focus-visible, #seek:focus-visible, input[type="checkbox"]:focus-visible{outline:2px solid #7fa8ff;outline-offset:2px;}
  .btn .icon{width:16px;height:16px;fill:currentColor;flex-shrink:0;}
  .seek-wrap{flex:1 1 220px;display:flex;align-items:center;gap:8px;min-width:160px;}
  .seek-track-wrap{position:relative;flex:1;height:32px;display:flex;align-items:center;}
  .seek-base,.seek-fill{position:absolute;left:0;top:50%;height:6px;transform:translateY(-50%);border-radius:3px;pointer-events:none;}
  .seek-base{width:100%;background:rgba(255,255,255,.18);z-index:0;}
  .seek-fill{width:0%;background:var(--pen);z-index:1;}
  .seek-ticks{position:absolute;left:0;right:0;top:50%;height:10px;transform:translateY(-50%);z-index:2;pointer-events:none;}
  .seek-ticks .tick{position:absolute;top:0;width:2px;height:10px;margin-left:-1px;background:rgba(255,255,255,.55);border-radius:1px;}
  #seek{position:relative;z-index:3;flex:1;height:32px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;}
  #seek::-webkit-slider-runnable-track{background:transparent;height:6px;}
  #seek::-moz-range-track{background:transparent;height:6px;border:none;}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid var(--pen);box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;}
  #seek::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--pen);box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;}
  .time-label{font-size:12px;color:#9aa7c2;min-width:76px;text-align:right;font-variant-numeric:tabular-nums;}
  .mode-toggle{display:flex;flex-wrap:wrap;gap:6px;}

  .mini-controls{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:12px;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(17,21,28,.92);backdrop-filter:blur(6px);
    transform:translateY(100%);transition:transform .2s ease;box-shadow:0 -4px 16px rgba(0,0,0,.35);}
  .mini-controls.show{transform:translateY(0);}
  .mini-controls .btn{padding:10px;min-height:40px;min-width:40px;justify-content:center;}
  .mini-progress{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;}
  .mini-progress-fill{height:100%;background:var(--pen);width:0%;}

  .teacher-gate{width:100%;max-width:var(--stage-max);background:#171b24;border:1px solid #262c3a;border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;}
  .teacher-gate .left{display:flex;align-items:center;gap:10px;font-size:13px;color:#c7d0e6;flex-wrap:wrap;row-gap:8px;}
  .check-hit{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-14px -14px -14px 0;cursor:pointer;}
  .teacher-gate input[type="checkbox"]{width:22px;height:22px;accent-color:var(--pen);}
  .teacher-gate .status{font-size:12px;font-weight:700;}
  .teacher-gate .status.pending{color:var(--warn-soft);}
  .teacher-gate .status.ready{color:var(--ok-soft);}
  .send-result{font-size:12px;color:var(--ok-soft);font-weight:700;display:none;align-items:center;gap:4px;}

  footer{color:#5b6580;font-size:11px;margin-top:2px;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <h1>Öğretmen Kontrollü Çözüm Animasyonu</h1>
  <div class="subtitle" id="subtitle"></div>

  <div class="stage-wrap">
    <div class="stage-frame mode-169" id="stageFrame">
      <svg id="masterSvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="clipDiagramGuard"><rect id="clipRect" x="0" y="0" width="1000" height="1000"/></clipPath>
          <linearGradient id="penBodyGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#4a5568"></stop>
            <stop offset="45%" stop-color="#1f2530"></stop>
            <stop offset="100%" stop-color="#0c0f14"></stop>
          </linearGradient>
        </defs>
        <rect id="paperRect" x="0" y="0" width="1000" height="1000" fill="var(--paper)"></rect>
        <!-- LOCKED SOURCE IMAGE — inserted at boot, never redrawn/altered -->
        <g id="imageHost"></g>
        <g id="onImageLayer" clip-path="url(#clipDiagramGuard)"></g>
        <g id="panelLayer"></g>
      </svg>

      <div class="caption-bar" id="captionBar"><span id="captionText"></span></div>
      <div id="speakIndicator" aria-hidden="true">🔊</div>
      <div id="errorOverlay">
        <div class="box">
          <h2>İç Kontrol: Ders Yayınlanamadı</h2>
          <p id="errorMsg"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn primary" id="playBtn" aria-label="Oynat">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"></path></svg><span>Oynat</span>
    </button>
    <button class="btn" id="pauseBtn" aria-label="Duraklat">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg><span>Duraklat</span>
    </button>
    <button class="btn" id="restartBtn" aria-label="Baştan">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"></path></svg><span>Baştan</span>
    </button>
    <div class="seek-wrap">
      <div class="seek-track-wrap" id="seekTrackWrap">
        <div class="seek-base"></div>
        <div class="seek-fill" id="seekFill"></div>
        <div class="seek-ticks" id="seekTicks"></div>
        <input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Zaman çubuğu">
      </div>
      <span class="time-label" id="timeLabel">—</span>
    </div>
    <div class="mode-toggle" role="group" aria-label="Görüntü modu">
      <button class="btn active" id="mode169Btn" aria-pressed="true">16:9</button>
      <button class="btn" id="mode916Btn" aria-pressed="false">9:16</button>
      <button class="btn" id="captionToggleBtn">Alt yazı: Açık</button>
      <button class="btn active" id="narrationToggleBtn">Anlatım: Açık</button>
      <button class="btn active" id="cameraToggleBtn">Kamera: Açık</button>
    </div>
  </div>

  <div class="mini-controls" id="miniControls" aria-hidden="true">
    <button class="btn primary" id="miniPlayPauseBtn" aria-label="Oynat/Duraklat">
      <svg class="icon" id="miniIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"></path></svg>
    </button>
    <div class="mini-progress"><div class="mini-progress-fill" id="miniProgressFill"></div></div>
    <span class="time-label" id="miniTimeLabel">—</span>
  </div>

  <div class="teacher-gate">
    <div class="left">
      <span class="check-hit"><input type="checkbox" id="teacherApprove"></span>
      <label for="teacherApprove">Öğretmen olarak çözümü inceledim, onaylıyorum.</label>
    </div>
    <div class="left">
      <span class="status pending" id="gateStatus">Onay bekleniyor — animasyon en az bir kez sonuna kadar izlenmeli.</span>
      <button class="btn primary" id="sendBtn" disabled>Öğrenciye Gönder</button>
      <span class="send-result" id="sendResult">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg> Gönderildi
      </span>
    </div>
  </div>

  <footer id="footerLine">Jett Öğretmen Çözümü · tek dosya, çevrimdışı çalışır</footer>
</div>

  ================================================================ */
  const CFG = {
    SVG_W: 1000,              // fixed logical canvas width; height derives from image + panel
    WRITE_SPEED: 250,         // handwriting speed, glyph-advance units/sec (calibrated on v8's approved rhythm)
    SHAPE_SPEED: 160,         // shape tracing speed, path-length units/sec
    SHAPE_MIN_DUR: 0.55,      // even a tiny tick takes this long to draw
    TEXT_MIN_DUR: 0.8,
    READ_PAUSE_PER_CHAR: 0.055, // post-block comprehension pause (the 'teacher talks' beat), clamped below
    READ_PAUSE_MAX: 3.6,
    ITEM_GAP: 0.3,            // hand-lift + travel time between consecutive strokes in a scene
    SPACE_SWITCH_GAP: 0.45,   // barrier gap when the pen travels photo<->panel
    SCENE_GAP: 0.6,
    START_DELAY: 2.2,        // viewer reads the question before the first ink lands
    DUR_MIN: 20, DUR_MAX: 75, // total-duration clamp; schedule is scaled uniformly into range

  /* ================================================================
     UTILS
  ================================================================ */
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function easeInOutCubic(p){ return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2; }
  function seedFromString(str){
    let h = 2166136261;
    for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(seed){
    let a = seed;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function b64ToBuf(b64){
    const bin = atob(b64);
    const buf = new ArrayBuffer(bin.length);
    const view = new Uint8Array(buf);
    for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
    return buf;
  }
  const SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs){
    const el = document.createElementNS(SVGNS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  /* ================================================================
     ERROR SURFACE — every failed gate lands here, animation never
     starts in a silently-degraded state.
  ================================================================ */
  function showError(lines){
    document.getElementById("errorMsg").textContent =
      (Array.isArray(lines) ? lines : [lines]).join("\n") + "\n\nDers güvenli şekilde durduruldu — insan incelemesi gerekiyor.";
    document.getElementById("errorOverlay").classList.add("show");
    document.getElementById("playBtn").disabled = true;
    document.getElementById("seek").disabled = true;
  }

  /* ================================================================
     MODULE a — ContractGate: refuse to animate an incomplete contract.
  ================================================================ */
  function validateContract(c){
    const errs = [];
    if (!c || typeof c !== "object") return ["Sözleşme (contract) hiç yüklenmemiş."];
    const need = (cond, msg) => { if (!cond) errs.push(msg); };
    need(c.meta && c.meta.title, "meta.title eksik");
    need(c.meta && c.meta.subject, "meta.subject eksik");
    need(c.meta && c.meta.topic, "meta.topic eksik");
    need(c.academic_contract && c.academic_contract.given, "academic_contract.given eksik");
    need(c.academic_contract && c.academic_contract.asked, "academic_contract.asked eksik");
    need(c.canonical_solution && Array.isArray(c.canonical_solution.steps) && c.canonical_solution.steps.length > 0, "canonical_solution.steps eksik/boş");
    need(c.canonical_solution && c.canonical_solution.final_answer && c.canonical_solution.final_answer.value, "canonical_solution.final_answer eksik");
    need(Array.isArray(c.scenes) && c.scenes.length >= 3, "scenes eksik (en az 3 sahne gerekli)");
    (c.scenes || []).forEach((s, i) => {
      need(s.caption, `scenes[${i}].caption eksik`);
      need(Array.isArray(s.items) && s.items.length > 0, `scenes[${i}].items eksik/boş`);
      (s.items || []).forEach((it, j) => {
        const tag = `scenes[${i}].items[${j}]`;
        need(it.space === "photo" || it.space === "panel", `${tag}.space 'photo'|'panel' olmalı`);
        need(it.type, `${tag}.type eksik`);
        if (it.type === "text" || it.type === "final-box") need(typeof it.text === "string" && it.text.length > 0, `${tag}.text eksik`);
        if (it.space === "photo" && it.type !== "text"){
          if (it.type === "arrow") need(it.from && it.to, `${tag} arrow için from/to eksik`);
          else need(it.anchor, `${tag}.anchor eksik`);
        }
        if (it.space === "photo" && it.type === "text") need(it.near, `${tag}.near eksik (foto metni için yaklaşık konum)`);
      });
    });
    return errs;
  }

  /* ================================================================

  ================================================================ */
  let latinFont = null, extFont = null, UPM = 1000;

  function fontForChar(ch){
    if (latinFont.charToGlyph(ch).index !== 0) return latinFont;
    if (extFont.charToGlyph(ch).index !== 0) return extFont;
    return null;
  }

  function deltaPath(ox, oy, fs){
    const p = (x, y) => `${(ox + x * fs).toFixed(2)},${(oy + y * fs).toFixed(2)}`;
    return `M ${p(0.34, -0.06)} C ${p(0.10, -0.10)} ${p(0.02, -0.24)} ${p(0.10, -0.34)} ` +
           `C ${p(0.18, -0.44)} ${p(0.36, -0.42)} ${p(0.34, -0.30)} ` +
           `C ${p(0.32, -0.20)} ${p(0.14, -0.18)} ${p(0.12, -0.28)} ` +
           `C ${p(0.10, -0.40)} ${p(0.26, -0.52)} ${p(0.40, -0.50)}`;
  }
  const DELTA_ADVANCE = 480;
  // hand-authored math symbols missing from the script subsets — drawn as real pen strokes
  function lePath(ox, oy, fs, flip){
    const p = (x, y) => `${(ox + x * fs).toFixed(2)},${(oy + y * fs).toFixed(2)}`;
    return flip
      ? `M ${p(0.08,-0.46)} L ${p(0.42,-0.28)} L ${p(0.08,-0.10)} M ${p(0.08,0.02)} L ${p(0.44,0.02)}`
      : `M ${p(0.42,-0.46)} L ${p(0.08,-0.28)} L ${p(0.42,-0.10)} M ${p(0.06,0.02)} L ${p(0.42,0.02)}`;
  }
  function arrowGlyphPath(ox, oy, fs){
    const p = (x, y) => `${(ox + x * fs).toFixed(2)},${(oy + y * fs).toFixed(2)}`;
    return `M ${p(0.06,-0.24)} L ${p(0.62,-0.24)} M ${p(0.47,-0.38)} L ${p(0.64,-0.24)} L ${p(0.47,-0.10)}`;
  }
  function sqrtGlyphPath(ox, oy, fs){
    const p = (x, y) => `${(ox + x * fs).toFixed(2)},${(oy + y * fs).toFixed(2)}`;
    return `M ${p(0.02,-0.28)} L ${p(0.14,-0.30)} L ${p(0.26,-0.02)} L ${p(0.42,-0.62)} L ${p(0.52,-0.62)}`;
  }
  function triGlyphPath(ox, oy, fs){
    const p = (x, y) => `${(ox + x * fs).toFixed(2)},${(oy + y * fs).toFixed(2)}`;
    return `M ${p(0.26,-0.52)} L ${p(0.02,-0.02)} L ${p(0.50,-0.02)} L ${p(0.27,-0.50)}`;

  const SYM_ADVANCE = { le: 560, ge: 560, arrow: 740, sqrt: 560, tri: 580 };
  const SYM_PATHS = {
    le: (ox, oy, fs) => lePath(ox, oy, fs, false),
    ge: (ox, oy, fs) => lePath(ox, oy, fs, true),
    arrow: arrowGlyphPath, sqrt: sqrtGlyphPath, tri: triGlyphPath

  function roundPathData(d){
    return d.replace(/-?\d+\.\d+/g, (m) => {

    });

  function tokenize(text){
    const tokens = [];
    for (const ch of text){
      if (ch === " "){ tokens.push({ kind: "space" }); continue; }
      if (ch === "δ"){ tokens.push({ kind: "delta" }); continue; }
      if (ch === "⁺"){ tokens.push({ kind: "super", ch: "+" }); continue; }
      if (ch === "⁻"){ tokens.push({ kind: "super", ch: "-" }); continue; }
      if (ch >= "₀" && ch <= "₉"){ tokens.push({ kind: "sub", ch: String(ch.charCodeAt(0) - 0x2080) }); continue; }
      if (ch === "≤"){ tokens.push({ kind: "sym", sym: "le" }); continue; }
      if (ch === "≥"){ tokens.push({ kind: "sym", sym: "ge" }); continue; }
      if (ch === "→" || ch === "⇒"){ tokens.push({ kind: "sym", sym: "arrow" }); continue; }
      if (ch === "√"){ tokens.push({ kind: "sym", sym: "sqrt" }); continue; }
      if (ch === "Δ"){ tokens.push({ kind: "sym", sym: "tri" }); continue; }
      const font = fontForChar(ch);
      if (!font){ uncoveredChars.add(ch); continue; }
      tokens.push({ kind: "char", ch, font });

  function layoutLine(tokens, x, y, fontSize){
    let cursor = x;

    let prevGlyph = null, prevFont = null;
    for (const tok of tokens){
      cursor = Math.round(cursor * 1000) / 1000; // guards opentype.js's float-noise NaN edge case
      if (tok.kind === "space"){
        const adv = 260 * (fontSize / UPM);
        cursor += adv;
        glyphs.push({ d: null, isSpace: true, isPunct: false, advancePx: adv });
        prevGlyph = null; prevFont = null;
        continue;
      }
      if (tok.kind === "delta"){
        const d = deltaPath(cursor, y, fontSize);
        const adv = DELTA_ADVANCE * (fontSize / UPM);
        glyphs.push({ d, isSpace: false, isPunct: false, advancePx: adv });
        cursor += adv;
        prevGlyph = null; prevFont = null;
        continue;
      }
      if (tok.kind === "sym"){
        const d = SYM_PATHS[tok.sym](cursor, y, fontSize);
        const adv = SYM_ADVANCE[tok.sym] * (fontSize / UPM);
        glyphs.push({ d, isSpace: false, isPunct: false, advancePx: adv });
        cursor += adv;
        prevGlyph = null; prevFont = null;
        continue;
      }
      if (tok.kind === "super" || tok.kind === "sub"){
        const g = latinFont.charToGlyph(tok.ch);
        const subFs = fontSize * 0.62;
        const yOff = tok.kind === "super" ? -fontSize * 0.34 : fontSize * 0.10;
        const path = g.getPath(cursor, y + yOff, subFs);
        const adv = g.advanceWidth * (subFs / UPM) * 1.05;
        glyphs.push({ d: roundPathData(path.toPathData(2)), isSpace: false, isPunct: false, advancePx: adv });
        cursor += adv;
        prevGlyph = null; prevFont = null;
        continue;
      }
      const g = tok.font.charToGlyph(tok.ch);
      if (prevGlyph && prevFont === tok.font){
        let kern = 0;
        try { kern = tok.font.getKerningValue(prevGlyph, g) || 0; } catch(e){ kern = 0; }
        cursor += kern * (fontSize / UPM);
        cursor = Math.round(cursor * 1000) / 1000;
      }
      const path = g.getPath(cursor, y, fontSize);
      const adv = g.advanceWidth * (fontSize / UPM);
      glyphs.push({ d: roundPathData(path.toPathData(2)), isSpace: false, isPunct: /[.,;:()]/.test(tok.ch),
                    isPause: /[.,;:]/.test(tok.ch), advancePx: adv });
      prevGlyph = g; prevFont = tok.font;
      cursor += adv;
    }
    return glyphs;
  }
  function measureAdvance(text, fontSize){
    // width without generating paths (fast, used by the wrapper) — kerning applied
    let cursor = 0;
    let prevGlyph = null, prevFont = null;
    for (const tok of tokenize(text)){
      if (tok.kind === "space"){ cursor += 260 * (fontSize / UPM); prevGlyph = null; continue; }
      if (tok.kind === "delta"){ cursor += DELTA_ADVANCE * (fontSize / UPM); prevGlyph = null; continue; }
      if (tok.kind === "sym"){ cursor += SYM_ADVANCE[tok.sym] * (fontSize / UPM); prevGlyph = null; continue; }
      if (tok.kind === "super" || tok.kind === "sub"){
        cursor += latinFont.charToGlyph(tok.ch).advanceWidth * (fontSize * 0.62 / UPM) * 1.05;
        prevGlyph = null; continue;
      }
      const g = tok.font.charToGlyph(tok.ch);
      if (prevGlyph && prevFont === tok.font){
        try { cursor += (tok.font.getKerningValue(prevGlyph, g) || 0) * (fontSize / UPM); } catch(e){}
      }
      cursor += g.advanceWidth * (fontSize / UPM);
      prevGlyph = g; prevFont = tok.font;
    }
    return cursor;
  }
  // spread a [start,end] window across glyphs by advance weight (+pauses at spaces/punct.)
  // Word-level rhythm on top: the hand pauses to position at each word's first
  // letter, breathes after sentence punctuation, and speeds through the middle
  // of long words. Pure reweighting INSIDE the line window — the window's
  // endpoints are exact, so the one-hand invariant is untouched by construction.
  function timeGlyphs(glyphs, lineStart, lineEnd){
    const words = [];
    let curWord = [];
    glyphs.forEach((g, i) => {
      if (g.isSpace){ if (curWord.length) words.push(curWord); curWord = []; }
      else curWord.push(i);
    });
    if (curWord.length) words.push(curWord);
    const wordInitial = new Set(words.map(w => w[0]));
    const midLong = new Set();
    for (const w of words)
      if (w.length >= 6)
        for (let k = 2; k <= w.length - 3; k++) midLong.add(w[k]);
    const weights = glyphs.map((g, i) => {
      let w = g.advancePx + (g.isSpace ? 55 : 0) + (g.isPunct ? (g.isPause ? 90 : 30) : 0);
      if (wordInitial.has(i)) w *= 1.35;
      else if (midLong.has(i)) w *= 0.92;
      return w;
    });
    if (!window.__glyphTimingSample && wordInitial.size && midLong.size){
      // test hook: slot-time-per-advance for a word-initial vs mid-word glyph
      const total0 = weights.reduce((a, b) => a + b, 0) || 1;
      const wi = [...wordInitial].find(i => !glyphs[i].isPunct && glyphs[i].advancePx > 0);
      const mw = [...midLong].find(i => !glyphs[i].isPunct && glyphs[i].advancePx > 0);
      if (wi !== undefined && mw !== undefined){
        window.__glyphTimingSample = {
          wordInitialSlotPerAdv: (weights[wi] / total0) / glyphs[wi].advancePx,
          midWordSlotPerAdv: (weights[mw] / total0) / glyphs[mw].advancePx
        };
      }
    }
    const total = weights.reduce((a, b) => a + b, 0) || 1;
    const duration = lineEnd - lineStart;
    let acc = 0;
    return glyphs.map((g, i) => {
      const t0 = lineStart + (acc / total) * duration;
      acc += weights[i];
      const t1 = lineStart + (acc / total) * duration;
      // stroke may never spill past this glyph's own slot — the one-hand invariant
      // holds down to the single-glyph level (next stroke starts only after this one).
      const strokeEnd = Math.max(t0 + (t1 - t0) * 0.72, Math.min(t0 + 0.02, t1 - 0.002));
      return { ...g, start: t0, end: strokeEnd, fillStart: strokeEnd, fillEnd: t1 };
    });
