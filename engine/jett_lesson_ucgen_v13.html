  :root{
    /* ---- ink & paper (theme-independent stage) ---- */
    --ink:#1f2937;
    --pen:#2F6BFF;            /* overwritten at boot from contract character profile */
    --pen-soft:color-mix(in srgb, var(--pen) 10%, transparent); /* derived — safe for ANY color format */
    --paper:#fffdf8;
    --line:#e3ddca;
    --warn:#c0392b; --ok:#1f9d55; --warn-soft:#f0b429; --ok-soft:#35d187;

    /* ---- type / space / radius / shadow / motion tokens ---- */
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --fs-xs:11px; --fs-sm:12.5px; --fs-md:13.5px; --fs-lg:15px; --fs-xl:17px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px;
    --r-sm:9px; --r-md:13px; --r-lg:18px; --r-full:999px;
    --ease:cubic-bezier(.2,.7,.3,1);
    --dur-1:120ms; --dur-2:220ms;
    --stage-max:clamp(320px, 94vw, 1080px);

    /* ---- theme: dark (default) ---- */
    --bg:#0e1218;
    --bg-card:#161b25;
    --bg-inset:#0a0d13;
    --bg-btn:#252c3b;
    --bg-btn-hover:#313a51;
    --text:#e8edf7;
    --text-dim:#97a3bd;
    --text-faint:#5f6b86;
    --border:#242b3a;
    --focus-ring:#7fa8ff;
    --shadow-1:0 1px 3px rgba(0,0,0,.35);
    --shadow-2:0 14px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eef1f6; --bg-card:#ffffff; --bg-inset:#e2e7f0;
      --bg-btn:#e9edf4; --bg-btn-hover:#dde3ee;
      --text:#1b2334; --text-dim:#58627a; --text-faint:#8b94a8;
      --border:#d9dfe9; --focus-ring:#2f6bff;
      --shadow-1:0 1px 3px rgba(23,32,51,.10);
      --shadow-2:0 14px 40px rgba(23,32,51,.14);
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef1f6; --bg-card:#ffffff; --bg-inset:#e2e7f0;
    --bg-btn:#e9edf4; --bg-btn-hover:#dde3ee;
    --text:#1b2334; --text-dim:#58627a; --text-faint:#8b94a8;
    --border:#d9dfe9; --focus-ring:#2f6bff;
    --shadow-1:0 1px 3px rgba(23,32,51,.10);
    --shadow-2:0 14px 40px rgba(23,32,51,.14);
    color-scheme:light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:var(--font-ui);color:var(--text);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  #app{display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);min-height:100%;
    padding:var(--sp-3) max(var(--sp-3), env(safe-area-inset-right)) var(--sp-5) max(var(--sp-3), env(safe-area-inset-left));}

  /* ---- page head ---- */
  .page-head{width:100%;max-width:var(--stage-max);display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-1) var(--sp-1) 0;}
  .brand{font-size:var(--fs-lg);font-weight:600;letter-spacing:.02em;color:var(--pen);
    background:var(--pen-soft);border-radius:var(--r-sm);padding:4px 10px;}
  .titles{flex:1;min-width:0;}
  h1{color:var(--text);font-size:var(--fs-lg);font-weight:600;margin:0;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .subtitle{color:var(--text-dim);font-size:var(--fs-sm);margin:1px 0 0;}

  /* ---- stage ---- */
  .stage-wrap{width:100%;max-width:var(--stage-max);background:var(--bg-card);border:1px solid var(--border);
    border-radius:var(--r-lg);padding:var(--sp-3);box-shadow:var(--shadow-2);}
  .stage-wrap:fullscreen{border-radius:0;border:none;display:flex;align-items:center;justify-content:center;background:var(--bg);}
  .stage-wrap:fullscreen .stage-frame{max-height:100vh;width:auto;max-width:100vw;height:100%;}
  .stage-frame{position:relative;width:100%;background:var(--bg-inset);border-radius:var(--r-md);overflow:hidden;
    display:flex;align-items:center;justify-content:center;margin:0 auto;}
  /* auto mode: the frame takes the CONTENT's aspect (set at boot) — no pillarboxing */
  .stage-frame.mode-auto{aspect-ratio:var(--content-ar, 16/9);max-height:min(76vh, 900px);width:auto;max-width:100%;}
  .stage-frame.mode-169{aspect-ratio:16/9;}
  .stage-frame.mode-916{aspect-ratio:9/16;max-width:clamp(280px, 46vw, 480px);}
  #masterSvg{width:100%;height:100%;display:block;}

  /* boot shade: engine derives everything at load; never show a dead white frame */
  #bootShade{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;gap:var(--sp-3);
    align-items:center;justify-content:center;background:var(--bg-inset);color:var(--text-dim);
    font-size:var(--fs-sm);transition:opacity var(--dur-2) var(--ease);}
  #bootShade.hide{opacity:0;pointer-events:none;}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--pen);
    animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .caption-bar{position:absolute;left:0;right:0;bottom:0;background:rgba(13,16,24,.78);color:#fff;
    font-size:var(--fs-md);line-height:1.45;padding:9px 14px;min-height:18px;display:flex;align-items:center;backdrop-filter:blur(3px);}
  #captionText{display:inline;}
  .caption-bar.force-hidden{display:none;}
  .caption-bar span.speaking{color:#ffd76a;}
  .caption-bar span.spoken{color:#bdd0f2;}
  #speakIndicator{position:absolute;right:10px;bottom:44px;font-size:15px;display:none;z-index:5;
    animation:speakPulse 1.1s ease-in-out infinite;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}
  #speakIndicator.show{display:block;}
  @keyframes speakPulse{0%,100%{opacity:.35;}50%{opacity:1;}}

  #errorOverlay{position:absolute;inset:0;background:var(--bg-card);display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20;}
  #errorOverlay.show{display:flex;}
  #errorOverlay .box{max-width:400px;}
  #errorOverlay h2{color:var(--warn);font-size:var(--fs-xl);margin:0 0 8px;}
  #errorOverlay p{font-size:var(--fs-md);color:var(--text-dim);margin:0;white-space:pre-line;}

  /* ---- controls toolbar ---- */
  .controls{width:100%;max-width:var(--stage-max);background:var(--bg-card);border:1px solid var(--border);
    border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;color:var(--text);}
  .btn{border:none;border-radius:var(--r-sm);background:var(--bg-btn);color:var(--text);font-family:var(--font-ui);
    font-size:var(--fs-md);font-weight:600;padding:11px 13px;min-height:44px;white-space:nowrap;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    transition:background var(--dur-1) var(--ease), transform var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);}
  .btn:hover{background:var(--bg-btn-hover);}
  .btn:active{transform:scale(.965);}
  .btn.primary{background:var(--pen);color:var(--pen-contrast, #fff);}
  .btn.primary:hover{filter:brightness(.94);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn.active{outline:2px solid var(--pen);outline-offset:-1px;}
  .btn:focus-visible, #seek:focus-visible, input[type="checkbox"]:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;}
  .btn .icon{width:16px;height:16px;fill:currentColor;flex-shrink:0;}
  /* state toggles: fixed two-part structure so label width NEVER shifts */
  .btn.toggle .t-label{color:inherit;}
  .btn.toggle .t-state{font-weight:400;font-size:var(--fs-sm);color:var(--text-dim);
    background:var(--bg-inset);border-radius:var(--r-full);padding:2px 9px;min-width:62px;text-align:center;}
  .btn.toggle.active .t-state{color:var(--pen-contrast,#fff);background:var(--pen);}

  .seek-wrap{flex:1 1 220px;display:flex;align-items:center;gap:8px;min-width:160px;}
  .seek-track-wrap{position:relative;flex:1;height:32px;display:flex;align-items:center;}
  .seek-base,.seek-fill{position:absolute;left:0;top:50%;height:6px;transform:translateY(-50%);border-radius:3px;pointer-events:none;}
  .seek-base{width:100%;background:var(--bg-inset);z-index:0;}
  .seek-fill{width:0%;background:var(--pen);z-index:1;}
  .seek-ticks{position:absolute;left:0;right:0;top:50%;height:10px;transform:translateY(-50%);z-index:2;pointer-events:none;}
  .seek-ticks .tick{position:absolute;top:0;width:2px;height:10px;margin-left:-1px;background:var(--text-faint);border-radius:1px;}
  #seek{position:relative;z-index:3;flex:1;height:32px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;}
  #seek::-webkit-slider-runnable-track{background:transparent;height:6px;}
  #seek::-moz-range-track{background:transparent;height:6px;border:none;}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid var(--pen);box-shadow:var(--shadow-1);cursor:pointer;transition:transform var(--dur-1) var(--ease);}
  #seek:active::-webkit-slider-thumb{transform:scale(1.18);}
  #seek::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--pen);box-shadow:var(--shadow-1);cursor:pointer;}
  .time-label{font-size:var(--fs-sm);color:var(--text-dim);min-width:86px;text-align:right;font-variant-numeric:tabular-nums;}
  .mode-toggle{display:flex;flex-wrap:wrap;gap:6px;}

  .mini-controls{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:var(--sp-3);
    padding:10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background:color-mix(in srgb, var(--bg-card) 92%, transparent);backdrop-filter:blur(8px);border-top:1px solid var(--border);
    transform:translateY(100%);transition:transform var(--dur-2) var(--ease);box-shadow:var(--shadow-2);}
  .mini-controls.show{transform:translateY(0);}
  .mini-controls .btn{padding:10px;min-height:40px;min-width:40px;justify-content:center;}
  .mini-progress{flex:1;height:22px;border-radius:var(--r-full);background:transparent;overflow:visible;position:relative;cursor:pointer;touch-action:none;}
  .mini-progress::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;transform:translateY(-50%);border-radius:2px;background:var(--bg-inset);}
  .mini-progress-fill{position:absolute;left:0;top:50%;height:4px;transform:translateY(-50%);border-radius:2px;background:var(--pen);width:0%;}

  .teacher-gate{width:100%;max-width:var(--stage-max);background:var(--bg-card);border:1px solid var(--border);
    border-radius:var(--r-md);padding:var(--sp-3) var(--sp-3);display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;justify-content:space-between;}
  .teacher-gate .left{display:flex;align-items:center;gap:10px;font-size:var(--fs-md);color:var(--text-dim);flex-wrap:wrap;row-gap:8px;}
  .check-hit{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-14px -14px -14px 0;cursor:pointer;}
  .teacher-gate input[type="checkbox"]{width:22px;height:22px;accent-color:var(--pen);}
  .teacher-gate .status{font-size:var(--fs-sm);font-weight:600;}
  .teacher-gate .status.pending{color:var(--warn-soft);}
  .teacher-gate .status.ready{color:var(--ok);}
  :root:not([data-theme="light"]) .teacher-gate .status.ready{color:var(--ok-soft);}
  .send-result{font-size:var(--fs-sm);color:var(--ok);font-weight:600;display:none;align-items:center;gap:4px;}
  :root:not([data-theme="light"]) .send-result{color:var(--ok-soft);}

  footer{color:var(--text-faint);font-size:var(--fs-xs);margin-top:2px;text-align:center;}

  /* reduced motion: kill decorative movement; functionality is untouched */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="page-head">
    <div class="brand" aria-hidden="true">Jett</div>
    <div class="titles">
      <h1>Öğretmen Kontrollü Çözüm Animasyonu</h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <button class="btn" id="themeToggleBtn" aria-label="Temayı değiştir">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.5-.04-.9-.1-1.4A7 7 0 0 1 12.6 3.1c-.2-.06-.4-.1-.6-.1z"></path></svg>
    </button>
  </header>

  <div class="stage-wrap" id="stageWrap">
    <div class="stage-frame mode-auto" id="stageFrame">
      <svg id="masterSvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="clipDiagramGuard"><rect id="clipRect" x="0" y="0" width="1000" height="1000"/></clipPath>
          <linearGradient id="penBodyGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#4a5568"></stop>
            <stop offset="45%" stop-color="#1f2530"></stop>
            <stop offset="100%" stop-color="#0c0f14"></stop>
          </linearGradient>
        </defs>
        <rect id="paperRect" x="0" y="0" width="1000" height="1000" fill="var(--paper)"></rect>
        <!-- LOCKED SOURCE IMAGE — inserted at boot, never redrawn/altered -->
        <g id="imageHost"></g>
        <g id="onImageLayer" clip-path="url(#clipDiagramGuard)"></g>
        <g id="panelLayer"></g>
      </svg>

      <div class="caption-bar" id="captionBar"><span id="captionText"></span></div>
      <div id="speakIndicator" aria-hidden="true">🔊</div>
      <div id="bootShade"><div class="spinner" aria-hidden="true"></div><span>Ders hazırlanıyor…</span></div>
      <div id="errorOverlay">
        <div class="box">
          <h2>İç Kontrol: Ders Yayınlanamadı</h2>
          <p id="errorMsg"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn primary" id="playBtn" aria-label="Oynat">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"></path></svg><span>Oynat</span>
    </button>
    <button class="btn" id="pauseBtn" aria-label="Duraklat">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg><span>Duraklat</span>
    </button>
    <button class="btn" id="restartBtn" aria-label="Baştan">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"></path></svg><span>Baştan</span>
    </button>
    <div class="seek-wrap">
      <div class="seek-track-wrap" id="seekTrackWrap">
        <div class="seek-base"></div>
        <div class="seek-fill" id="seekFill"></div>
        <div class="seek-ticks" id="seekTicks"></div>
        <input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Zaman çubuğu">
      </div>
      <span class="time-label" id="timeLabel">—</span>
    </div>
    <div class="mode-toggle" role="group" aria-label="Görüntü modu">
      <button class="btn active" id="modeAutoBtn" aria-pressed="true">Otomatik</button>
      <button class="btn" id="mode169Btn" aria-pressed="false">16:9</button>
      <button class="btn" id="mode916Btn" aria-pressed="false">9:16</button>
    </div>
    <div class="mode-toggle" role="group" aria-label="Oynatma seçenekleri">
      <button class="btn toggle active" id="captionToggleBtn" aria-pressed="true" data-state="on">
        <span class="t-label">Alt yazı</span><span class="t-state">Açık</span>
      </button>
      <button class="btn toggle active" id="narrationToggleBtn" aria-pressed="true" data-state="on">
        <span class="t-label">Anlatım</span><span class="t-state">Açık</span>
      </button>
      <button class="btn toggle active" id="cameraToggleBtn" aria-pressed="true" data-state="on">
        <span class="t-label">Kamera</span><span class="t-state">Açık</span>
      </button>
      <button class="btn" id="fullscreenBtn" aria-label="Tam ekran">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 0h2v5h-5v-2h3v-3z"></path></svg>
      </button>
    </div>
  </div>

  <!-- v12 had aria-hidden="true" here while keeping a focusable button inside — an
       a11y contradiction. Visibility is conveyed by the .show class + transform. -->
  <div class="mini-controls" id="miniControls">
    <button class="btn primary" id="miniPlayPauseBtn" aria-label="Oynat/Duraklat">
      <svg class="icon" id="miniIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"></path></svg>
    </button>
    <div class="mini-progress"><div class="mini-progress-fill" id="miniProgressFill"></div></div>
    <span class="time-label" id="miniTimeLabel">—</span>
  </div>

  <div class="teacher-gate">
    <div class="left">
      <span class="check-hit"><input type="checkbox" id="teacherApprove"></span>
      <label for="teacherApprove">Öğretmen olarak çözümü inceledim, onaylıyorum.</label>
    </div>
    <div class="left">
      <span class="status pending" id="gateStatus" role="status" aria-live="polite">Onay bekleniyor — animasyon en az bir kez sonuna kadar izlenmeli.</span>
      <button class="btn primary" id="sendBtn" disabled>Öğrenciye Gönder</button>
      <span class="send-result" id="sendResult">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg> Gönderildi
      </span>
    </div>
  </div>

  <footer id="footerLine">Jett Öğretmen Çözümü · tek dosya, çevrimdışı çalışır</footer>
</div>

  /* ================================================================
     UTILS
  ================================================================ */
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function easeInOutCubic(p){ return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2; }
  function seedFromString(str){
    let h = 2166136261;
    for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(seed){
    let a = seed;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function b64ToBuf(b64){
    const bin = atob(b64);
    const buf = new ArrayBuffer(bin.length);
    const view = new Uint8Array(buf);
    for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
    return buf;
  }
  const SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs){
    const el = document.createElementNS(SVGNS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

     ERROR SURFACE — every failed gate lands here, animation never
     starts in a silently-degraded state.

  function showError(lines){
    document.getElementById("errorMsg").textContent =

    document.getElementById("errorOverlay").classList.add("show");
    document.getElementById("bootShade").classList.add("hide"); // the error IS the state — no spinner on top
    document.getElementById("playBtn").disabled = true;
    document.getElementById("seek").disabled = true;
  }

  /* ================================================================
     MODULE a — ContractGate: refuse to animate an incomplete contract.
  ================================================================ */
  function validateContract(c){
    const errs = [];
    if (!c || typeof c !== "object") return ["Sözleşme (contract) hiç yüklenmemiş."];
    const need = (cond, msg) => { if (!cond) errs.push(msg); };
    need(c.meta && c.meta.title, "meta.title eksik");
    need(c.meta && c.meta.subject, "meta.subject eksik");

    need(c.academic_contract && c.academic_contract.given, "academic_contract.given eksik");
    need(c.academic_contract && c.academic_contract.asked, "academic_contract.asked eksik");
    need(c.canonical_solution && Array.isArray(c.canonical_solution.steps) && c.canonical_solution.steps.length > 0, "canonical_solution.steps eksik/boş");
    need(c.canonical_solution && c.canonical_solution.final_answer && c.canonical_solution.final_answer.value, "canonical_solution.final_answer eksik");
    need(Array.isArray(c.scenes) && c.scenes.length >= 3, "scenes eksik (en az 3 sahne gerekli)");
    (c.scenes || []).forEach((s, i) => {
      need(s.caption, `scenes[${i}].caption eksik`);
      need(Array.isArray(s.items) && s.items.length > 0, `scenes[${i}].items eksik/boş`);
      (s.items || []).forEach((it, j) => {
        const tag = `scenes[${i}].items[${j}]`;
        need(it.space === "photo" || it.space === "panel", `${tag}.space 'photo'|'panel' olmalı`);
        need(it.type, `${tag}.type eksik`);
        if (it.type === "text" || it.type === "final-box") need(typeof it.text === "string" && it.text.length > 0, `${tag}.text eksik`);
        if (it.space === "photo" && it.type !== "text"){
          if (it.type === "arrow") need(it.from && it.to, `${tag} arrow için from/to eksik`);

        }

      });
    });

           `C ${p(0.32, -0.20)} ${p(0.14, -0.18)} ${p(0.12, -0.28)} ` +

      if (ch === "⁺"){ tokens.push({ kind: "super", ch: "+" }); continue; }
      if (ch === "⁻"){ tokens.push({ kind: "super", ch: "-" }); continue; }

      if (ch === "→" || ch === "⇒"){ tokens.push({ kind: "sym", sym: "arrow" }); continue; }

      if (tok.kind === "delta"){ cursor += DELTA_ADVANCE * (fontSize / UPM); prevGlyph = null; continue; }
      if (tok.kind === "sym"){ cursor += SYM_ADVANCE[tok.sym] * (fontSize / UPM); prevGlyph = null; continue; }

      else curWord.push(i);

      if (wordInitial.has(i)) w *= 1.35;

      const wi = [...wordInitial].find(i => !glyphs[i].isPunct && glyphs[i].advancePx > 0);
      const mw = [...midLong].find(i => !glyphs[i].isPunct && glyphs[i].advancePx > 0);

  /* ================================================================
     MODULE b — SafeZoneMap: runtime ink-density analysis of the photo.
     No hand-measured pixel coordinates anywhere.
  ================================================================ */
  function buildSafeZoneMap(imgEl, imgW, imgH, svgImgH){
    const scale = Math.min(1, 800 / imgW);
    const cw = Math.round(imgW * scale), ch = Math.round(imgH * scale);
    const cv = document.createElement("canvas");
    cv.width = cw; cv.height = ch;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(imgEl, 0, 0, cw, ch);
    const data = ctx.getImageData(0, 0, cw, ch).data;

    // adaptive paper threshold: the photo's own median luminance defines "paper"
    const lums = new Uint8Array(cw * ch);
    for (let i = 0; i < cw * ch; i++){
      const o = i * 4;
      lums[i] = (data[o] * 0.299 + data[o+1] * 0.587 + data[o+2] * 0.114) | 0;
    }
    const hist = new Uint32Array(256);
    for (let i = 0; i < lums.length; i++) hist[lums[i]]++;
    let cum = 0, median = 128;
    for (let v = 0; v < 256; v++){ cum += hist[v]; if (cum >= lums.length / 2){ median = v; break; } }
    const darkThr = median * 0.82;

    // grid in SVG units (image occupies 1000 x svgImgH)
    const cellSvg = CFG.CELL;
    const gw = Math.ceil(CFG.SVG_W / cellSvg), gh = Math.ceil(svgImgH / cellSvg);
    const ink = new Float32Array(gw * gh);
    const pxPerSvgX = cw / CFG.SVG_W, pxPerSvgY = ch / svgImgH;
    for (let gy = 0; gy < gh; gy++){
      for (let gx = 0; gx < gw; gx++){
        const x0 = Math.floor(gx * cellSvg * pxPerSvgX), x1 = Math.min(cw, Math.floor((gx+1) * cellSvg * pxPerSvgX));
        const y0 = Math.floor(gy * cellSvg * pxPerSvgY), y1 = Math.min(ch, Math.floor((gy+1) * cellSvg * pxPerSvgY));
        let dark = 0, tot = 0;
        for (let y = y0; y < y1; y += 2){
          for (let x = x0; x < x1; x += 2){
            tot++;
            if (lums[y * cw + x] < darkThr) dark++;
          }
        }
        ink[gy * gw + gx] = tot ? dark / tot : 1;
      }
    }
    function cellBlank(gx, gy){
      if (gx < 0 || gy < 0 || gx >= gw || gy >= gh) return false;
      return ink[gy * gw + gx] <= CFG.BLANK_MAX_INK;
    }
    // nearest all-blank rect of (w x h) SVG units around (cx, cy); spiral ring search
    function findBlankRect(cx, cy, w, h){
      const needX = Math.ceil(w / cellSvg), needY = Math.ceil(h / cellSvg);
      const cgx = Math.round(cx / cellSvg - needX / 2), cgy = Math.round(cy / cellSvg - needY / 2);
      const maxR = Math.max(gw, gh);
      for (let r = 0; r <= maxR; r++){
        for (let dy = -r; dy <= r; dy++){
          for (let dx = -r; dx <= r; dx++){
            if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue; // ring only
            const gx = cgx + dx, gy = cgy + dy;
            let ok = true;
            for (let yy = 0; ok && yy < needY; yy++)
              for (let xx = 0; ok && xx < needX; xx++)
                if (!cellBlank(gx + xx, gy + yy)) ok = false;
            if (ok) return { x: gx * cellSvg, y: gy * cellSvg, w: needX * cellSvg, h: needY * cellSvg,
                             dist: Math.hypot(gx * cellSvg + w/2 - cx, gy * cellSvg + h/2 - cy) };
          }
        }
        if (r > (Math.max(w, h) / cellSvg) + 14) break; // don't wander across the whole page
      }

    // our own already-planned handwriting both count as occupied space.
    function occupy(rect){
      const gx0 = Math.max(0, Math.floor(rect.x / cellSvg)), gy0 = Math.max(0, Math.floor(rect.y / cellSvg));
      const gx1 = Math.min(gw - 1, Math.ceil((rect.x + rect.w) / cellSvg)), gy1 = Math.min(gh - 1, Math.ceil((rect.y + rect.h) / cellSvg));
      for (let gy = gy0; gy <= gy1; gy++)
        for (let gx = gx0; gx <= gx1; gx++)

    }
    return { findBlankRect, occupy };
  }

  /* ================================================================

  function compileScenes(contract, zone, svgImgH){
    const items = [];   // {space, kind:'shape'|'phototext'|'paneltext'|'finalbox', el-spec..., cost}
    const sceneMeta = [];
    const placedRects = []; // every runtime-placed handwriting block, for the overlap self-check
    let panelUsed = false;

    let panelY = CFG.PANEL_PAD_TOP;
    const A = (a) => ({ x: a.x * CFG.SVG_W, y: a.y * svgImgH, w: (a.w || 0) * CFG.SVG_W, h: (a.h || 0) * svgImgH });

    contract.scenes.forEach((scene, si) => {
      const sceneItems = [];
      scene.items.forEach((it, ii) => {
        const idBase = `s${si}i${ii}`;
        if (it.space === "photo" && it.type !== "text"){
          const spec = { space: "photo", kind: "shape", id: idBase, type: it.type, color: it.color || null };
          if (it.type === "arrow"){
            const f = { x: it.from.x * CFG.SVG_W, y: it.from.y * svgImgH };
            const t = { x: it.to.x * CFG.SVG_W, y: it.to.y * svgImgH };
            const mx = (f.x + t.x) / 2 + (t.y - f.y) * 0.18, my = (f.y + t.y) / 2 - (t.x - f.x) * 0.18;
            spec.d = `M ${f.x.toFixed(1)},${f.y.toFixed(1)} Q ${mx.toFixed(1)},${my.toFixed(1)} ${t.x.toFixed(1)},${t.y.toFixed(1)}`;
            spec.len = Math.hypot(t.x - f.x, t.y - f.y) * 1.1;
          } else {
            const a = A(it.anchor);
            if (it.type === "box"){
              spec.rect = a; spec.len = 2 * (a.w + a.h);
            } else if (it.type === "ellipse" || it.type === "answer-circle"){
              const grow = it.type === "answer-circle" ? 1.12 : 1.0;
              spec.ellipse = { cx: a.x + a.w/2, cy: a.y + a.h/2, rx: Math.max(12, a.w/2 * grow), ry: Math.max(10, a.h/2 * grow) };
              spec.len = Math.PI * (3*(spec.ellipse.rx + spec.ellipse.ry) - Math.sqrt((3*spec.ellipse.rx + spec.ellipse.ry) * (spec.ellipse.rx + 3*spec.ellipse.ry)));
            } else if (it.type === "check"){
              const w = Math.max(30, a.w), h = Math.max(24, a.h);
              spec.d = `M ${a.x.toFixed(1)},${(a.y + h*0.5).toFixed(1)} L ${(a.x + w*0.36).toFixed(1)},${(a.y + h).toFixed(1)} L ${(a.x + w).toFixed(1)},${a.y.toFixed(1)}`;

              const uy = a.y + a.h + 5;
              spec.d = `M ${a.x.toFixed(1)},${uy.toFixed(1)} Q ${(a.x + a.w*0.5).toFixed(1)},${(uy + 5).toFixed(1)} ${(a.x + a.w).toFixed(1)},${(uy - 1).toFixed(1)}`;
              spec.len = a.w * 1.05; spec.sw = 4;
