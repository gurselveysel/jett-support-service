name: Atolye TYT Batch02
run-name: Atolye TYT - 65 unique solutions - batch02
on:
  push:
    branches: [atolye-tyt-20260922]
    paths: [.github/workflows/atolye-tyt-batch02.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: atolye-tyt-audio
  cancel-in-progress: false
jobs:
  speech:
    if: github.ref == 'refs/heads/atolye-tyt-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ensure audio verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Generate approved Turkish narrations within included credits
        shell: python
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          import json, pathlib
          class ProductionStop(Exception): pass
          def produce(item):
              import os, sys, json, pathlib, urllib.request, urllib.error, base64, hashlib, re, math
              out = pathlib.Path('atolye-tyt-batch02')/item['id']
              out.mkdir(parents=True,exist_ok=True)
              voice = 'tZYpRZkmCNQcfmtDbhUg'
              model_id = 'eleven_v3'
              report = {'pair':item['pair'],
                        'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                        'commit':os.environ.get('GITHUB_SHA'), 'run_id':os.environ.get('GITHUB_RUN_ID'),
                        'credential_present':False,'api_called':False,'tts_called':False,
                        'audio_generated':False,'fallback_used':False,'video_completed':False,
                        'auditory_review':False}
              def save_report(status, **extra):
                  report.update(status=status, **extra)
                  (out/'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('ATOLYE_RESULT '+json.dumps(report,ensure_ascii=False))
              def stop(status, **extra):
                  save_report(status, **extra)
                  raise ProductionStop(status)
              key = os.environ.get('ELEVENLABS_API_KEY','').strip()
              if not key:
                  stop('blocked_missing_credential', required_secret='ELEVENLABS_API_KEY')
              report['credential_present'] = True
              # A rerun must never unknowingly spend credits twice. Use a fresh dispatch only after inspecting artifacts.
              if int(os.environ.get('GITHUB_RUN_ATTEMPT','1')) > 1:
                  stop('blocked_automatic_audio_regeneration', action='Inspect and reuse existing audio artifacts; fresh dispatch only if no audio was generated.')
              text=item['narration']
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              def call(path, payload=None):
                  report['api_called'] = True
                  req = urllib.request.Request('https://api.elevenlabs.io'+path,
                      headers={'xi-api-key':key,'Content-Type':'application/json'},
                      data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                      method='GET' if payload is None else 'POST')
                  try:
                      with opener.open(req, timeout=180) as response:
                          return json.loads(response.read(24000000)), response.headers.get('request-id')
                  except urllib.error.HTTPError as error:
                      try:
                          detail=json.loads(error.read(4000)).get('detail',{})
                          provider_code=detail.get('status') if isinstance(detail,dict) else None
                          if not isinstance(provider_code,str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,100}',provider_code) or key in provider_code:
                              provider_code=None
                      except Exception:
                          provider_code=None
                      stop('provider_error', http_status=error.code, provider_code=provider_code,
                           operation='tts' if payload is not None else path)
                  except Exception as error:
                      stop('transport_or_response_error', error_type=type(error).__name__,
                           tts_outcome_uncertain=payload is not None)
              voice_info,_=call('/v1/voices/'+voice)
              if voice_info.get('voice_id') != voice:
                  stop('blocked_voice_mismatch')
              report['voice_accessible'] = True
              models,_=call('/v1/models')
              selected=next((m for m in models if m.get('model_id')==model_id),None)
              if not selected or not selected.get('can_do_text_to_speech'):
                  stop('blocked_model_unavailable')
              report['model_accessible'] = True
              subscription,_=call('/v1/user/subscription')
              used=subscription.get('character_count')
              limit=subscription.get('character_limit')
              if type(used) is not int or type(limit) is not int or used<0 or limit<0:
                  stop('blocked_quota_not_verifiable')
              # No billing settings are changed. Stop unless paid overage is known to be disabled.
              extension=subscription.get('max_credit_limit_extension')
              overage_disabled=(type(extension) is int and extension==0) or subscription.get('can_extend_character_limit') is False
              if not overage_disabled:
                  stop('blocked_paid_overage_not_disabled', action='No audio request made; billing settings were not changed.')
              rates=selected.get('model_rates') or {}
              cost_factor=rates.get('character_cost_multiplier',selected.get('token_cost_factor'))
              if not isinstance(cost_factor,(int,float)) or isinstance(cost_factor,bool) or not math.isfinite(cost_factor) or cost_factor<=0:
                  stop('blocked_model_cost_not_verifiable')
              required=math.ceil(len(text)*max(1.0,float(cost_factor)))
              remaining=limit-used
              report.update(narration_characters=len(text), required_credits_conservative=required,
                            quota_checked=True, paid_overage_disabled=True, remaining_included_credits=remaining)
              if remaining < required:
                  stop('blocked_insufficient_included_credits', required_credits=required, remaining_included_credits=max(0,remaining))
              maximum=selected.get('maximum_text_length_per_request')
              tier_limit=selected.get('max_characters_request_free_user' if subscription.get('tier')=='free' else 'max_characters_request_subscribed_user')
              limits=[x for x in [maximum,tier_limit] if isinstance(x,int) and x>0]
              if limits and len(text)>min(limits):
                  stop('blocked_text_exceeds_model_limit', model_character_limit=min(limits))
              payload={'text':text,'model_id':model_id,'language_code':'tr',
                       'voice_settings':{'stability':0.5,'speed':0.94}}
              (out/'narration.txt').write_text(text,encoding='utf-8')
              report['narration_sha256']=hashlib.sha256(text.encode('utf-8')).hexdigest()
              report['tts_called']=True
              save_report('tts_request_started')
              result,request_id=call('/v1/text-to-speech/'+voice+'/with-timestamps?output_format=mp3_44100_128',payload)
              try:
                  audio=base64.b64decode(result['audio_base64'],validate=True)
                  if len(audio)<10000:
                      stop('invalid_audio_size')
                  (out/'speech.mp3').write_bytes(audio)
                  report.update(audio_generated=True, bytes=len(audio), sha256=hashlib.sha256(audio).hexdigest())
                  (out/'alignment.json').write_text(json.dumps({'alignment':result.get('alignment'),'normalized_alignment':result.get('normalized_alignment')},ensure_ascii=False,indent=2),encoding='utf-8')
                  alignment=result.get('normalized_alignment') or result.get('alignment')
                  if not alignment:
                      stop('audio_saved_but_alignment_missing', action='Reuse saved audio; do not regenerate for drawing.')
                  chars=alignment['characters']
                  starts=alignment['character_start_times_seconds']
                  ends=alignment['character_end_times_seconds']
                  assert len(chars)==len(starts)==len(ends)>0
                  assert all(isinstance(c,str) and len(c)==1 for c in chars)
                  assert all(math.isfinite(float(s)) and math.isfinite(float(e)) and 0<=float(s)<=float(e) for s,e in zip(starts,ends))
                  assert all(float(starts[i])<=float(starts[i+1]) for i in range(len(starts)-1))
                  joined=''.join(chars)
                  def segments(pattern):
                      return [{'text':m.group().strip(),'start':starts[m.start()],'end':ends[m.end()-1]} for m in re.finditer(pattern,joined) if m.group().strip()]
                  words=segments(r'\S+')
                  phrases=segments(r'[^.!?\n]+[.!?]?')
                  speech={'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                          'duration_alignment':max(ends),'word_timestamps':words,'phrase_timestamps':phrases,
                          'text':text,'request_id':request_id,'timing_source':'provider_character_alignment'}
                  (out/'speech.json').write_text(json.dumps(speech,ensure_ascii=False,indent=2),encoding='utf-8')
                  save_report('audio_saved_pending_decode', word_count=len(words),phrase_count=len(phrases),
                              last_alignment_second=max(ends), character_alignment_validated=True)
              except Exception as error:
                  stop('audio_processing_error',error_type=type(error).__name__,action='Inspect saved files before any new TTS request.')
              import subprocess
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(out/'speech.mp3')]))
              duration=float(probe['format']['duration'])
              assert math.isfinite(duration) and duration>1
              assert any(s['codec_type']=='audio' for s in probe['streams'])
              assert report['last_alignment_second']<=duration+0.5
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(out/'speech.mp3'),'-f','null','-'],check=True,capture_output=True)
              save_report('audio_generated_and_decoded',duration_seconds=duration,audio_decode_pass=True,auditory_review=False)

          items=[{'id': 'TYT-A-Turkce-21', 'pair': ['TYT-A-Turkce-21', 'TYT-B-Turkce-25'], 'narration': 'Parçanın devamında yazarı tetikleyen bir duygunun mutlaka bulunduğu vurgulanıyor. Yazmak, yalnız önceden verilmiş mekanik bir karar değildir. Bu akşam oturayım da yeni bir öykü yazayım demiyorum cümlesi, duyguyla başlayan üretimi açıklamaya uygun bir başlangıçtır. Öfke, umut ve şaşkınlıkla yazılan romanlar da bu düşünceyi örnekler. Diğer seçenekler boş zaman, okur veya yazma güçlüğü gibi farklı konular açar. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Turkce-22', 'pair': ['TYT-A-Turkce-22', 'TYT-B-Turkce-24'], 'narration': 'Parçanın son cümlesi ülkemizde maydanozun gıda dışındaki kullanımının yaygın olmadığını açıkça söylüyor. Buradan ülkemizde daha çok besin maddesi olarak tüketildiği sonucuna kesin biçimde ulaşırız. Tarihte ilk görülme ile tarımının başlaması aynı bilgi değildir. Her yerde tarımı yapıldığı, temel tıp ürünü olduğu veya özel iklim gerektirdiği de söylenmemiştir. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Turkce-23', 'pair': ['TYT-A-Turkce-23', 'TYT-B-Turkce-10'], 'narration': 'İlk dört cümlede yazarın sabahları nasıl yazdığı, ne zaman verimli olduğu ve metnini gözden geçirmesi anlatılıyor. Beşinci cümle günlük rutinden ayrılarak roman yazma niyeti ile kısa öykü yazma tercihine geçiyor. Konunun alt başlığı değişiyor. Altıncı cümle roman için yeterli zaman bulunamamasını açıklıyor ve beşinciyi tamamlıyor. İkinci paragraf beşinci cümleyle başlamalıdır. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Turkce-24', 'pair': ['TYT-A-Turkce-24', 'TYT-B-Turkce-09'], 'narration': 'Bu soruda tıbbi bir tanı koymuyor, yalnız parçadan çıkarılabilecek yargıyı buluyoruz. Metin, tanı sürecinin uzun ve dikkat gerektiren bir süreç olduğunu söylüyor. Öğretmenin endişelenmesiyle uzman tanısı arasında geçen süre ve doğru tanı için gereken hassasiyet, bu güçlüğün kanıtlarıdır. Her yaşta görülme, en yaygın problem olma veya nedenlerinin bilinmemesi metinde yoktur. Ulaşılabilen yargı, anlaşılması ve tanı konmasının zor olduğudur. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Turkce-25', 'pair': ['TYT-A-Turkce-25', 'TYT-B-Turkce-08'], 'narration': 'Parçaya göre eleştirel deneme çözümleyici ve kişisel bir yaklaşım taşır; katı ve kesin yargılara dayanmaz. İkinci cümlede romanın başarıya ulaşması imkânsız deniyor. Üçüncüde yazarın yeri artık tartışılmaz kabul ediliyor. İkisi de kesin yargıdır. Birinci cümle eserin dilini ve yaklaşımını değerlendiriyor, kesin bir hüküm dayatmıyor. Bu yüzden eleştirel denemeden alınmış olamayacaklar iki ve üçtür. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Turkce-26', 'pair': ['TYT-A-Turkce-26', 'TYT-B-Turkce-07'], 'narration': 'Parça yoğun cihaz kullanımının bazı olumsuz sonuçlarını anlatıyor. Buradan cihazların kullanıcılara hiçbir fayda sağlamadığı sonucunu çıkaramayız. Sağlık sorunları, ihtiyaçtan fazla kullanım, gençlerin daha çok etkilenmesi ve bazı gençlerin duyarsızlığı metinde açıklanmıştır. Ulaşılamaz sorularında hiçbir gibi mutlak sözlere dikkat edelim. Zararlarından söz edilmesi, bütün yararların yok sayılması anlamına gelmez. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Turkce-27', 'pair': ['TYT-A-Turkce-27', 'TYT-B-Turkce-40'], 'narration': 'Döngüsel ekonomi, kaynakların yeniden kullanılmasını ve değerlerinin uzun süre korunmasını hedefler. Parçada ham madde ve enerji tüketiminin azaltılması, emisyonların ve malzeme kaybının düşürülmesi birlikte vurgulanıyor. Bu düşüncelerin ortak sonucu, doğa ve çevre üzerindeki zararı azaltmaktır. Şirket kârı, ürün kalitesi veya dış kaynağa bağımlılık ana düşünce olarak verilmemiştir. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Turkce-28', 'pair': ['TYT-A-Turkce-28', 'TYT-B-Turkce-39'], 'narration': 'Yazarın kaynak vermesi, bilgilerin sınanmasını sağlaması ve efsaneleştirmekten uzak durması, eleştirel bakışa ve nesnelliğe ilişkin seçenekleri destekler. Metinde merak uyandıran unsur olarak ara başlıklar gösterilir. Anekdot ve dedikodu gibi eklemeler de okunurluğu artırmaktadır. Bu içerik ve düzen özelliklerinden, kullanılan dil ve üslubun merak duygusunu harekete geçirdiği yargısı doğrudan çıkarılamaz. Seçenekler arasındaki ince ayrım budur. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Turkce-29', 'pair': ['TYT-A-Turkce-29', 'TYT-B-Turkce-38'], 'narration': 'Önce biyoyakıtlar tanıtılır. Sonra ülkelerin katkıları söylenir. Bunlar arasında sözüyle Amerika ve Avrupa örnekleri bu katkılara bağlanır. Bu ve benzeri çalışmalar sayesinde ifadesi örneklerin sonucunu verir. Biyoetanoldeki artışın ardından ise bağlacıyla biyodizeldeki artış gelir. Tam sıralama üç, beş, iki, dört, birdir. Baştan dördüncü cümle dört numaralı cümledir. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Turkce-30', 'pair': ['TYT-A-Turkce-30', 'TYT-B-Turkce-13'], 'narration': 'İsim verme, hediye alma ve sırdaş gibi görme örnekleri, hayvanların aile üyesi olarak algılandığını gösterir. Eklenecek cümle bu örneklerin ardından gelmeli; sonraki aile ferdi olma kimliği kazanan sözüne de temel oluşturmalıdır. Bu nedenle ikinci boşluğu seçeriz. Önce aile üyesi sayılma belirtilir, ardından aile içindeki görev ve yararlar anlatılır. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Turkce-31', 'pair': ['TYT-A-Turkce-31', 'TYT-B-Turkce-12'], 'narration': 'Yatırım fonları, ülkeler ve firmalar tarafından desteklendiği; birçok disiplini kapsadığı açıkça anlatılmıştır. Hücrelerin yenilenmesiyle yaş, hastalık veya yaralanma nedeniyle kaybedilen işlevlerin geri kazanılması amaçlanıyor. Metin, klasik tedavilere duyulan ihtiyacın tamamen ortadan kalkacağını söylemez. Bir teknolojinin gelişmesi, diğer bütün yöntemlerin gereksizleşeceğini kanıtlamaz. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Turkce-32', 'pair': ['TYT-A-Turkce-32', 'TYT-B-Turkce-11'], 'narration': 'Dolu bavul sözü, yazarın okuma, yaşantı, eleştirel düşünme ve yazma tecrübelerini bir arada anlatır. Bu birikimlerin süzgeçten geçmesi, seçilip işlenmesi ve arıtılmasıdır. Yazar bunları olduğu gibi aktarmamaktadır. Sonuç, birikimin yeni ve nitelikli bir edebî esere dönüşmesidir. Yalnız kendi hayatını anlatmak ya da içeriği önemsiz görmek sözün anlamını karşılamaz. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Turkce-33', 'pair': ['TYT-A-Turkce-33', 'TYT-B-Turkce-21'], 'narration': 'Yazar sorular sorarak doğallık sağlıyor ve edebiyat yerine şöhret arayan kişileri eleştiriyor. Tartışmacı bir anlatım kullanılmıştır. Allayıp pullamak, can atmak gibi kalıplaşmış sözler ve şişirme, yüceltme gibi mecazlı kullanımlar vardır. Fakat belirli bir şair, eser veya somut olay örnek olarak sunulmuyor. Genel bir tipten söz edilmesi örnekleme sayılmaz; başvurulmayan yöntem budur. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Turkce-34', 'pair': ['TYT-A-Turkce-34', 'TYT-B-Turkce-20'], 'narration': 'Parça hem müzik bilgisinin hem güçlü bir kalemin gerekli olduğunu söyler. Bilgisizce etkileyici dil kullanmanın yeterli olduğunu söylemez. Kötüleri ayıklama, öneride bulunma ve daha iyiye yönlendirme eleştirmenin görevleri olarak verilmiştir. Uzun ve yorucu çalışma ile beğenilmeyen müzik hakkında yazmanın gerekliliği de vardır. Bilgi olmadan eleştiri yapılabileceği yargısı metinde bulunmadığı gibi metne aykırıdır. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Turkce-35', 'pair': ['TYT-A-Turkce-35', 'TYT-B-Turkce-18'], 'narration': 'Parça Richards’ın sözünü tırnak içinde aktararak başlar. Bu, alıntılamanın açık örneğidir. Şairle okurun yaşantısının neden özdeş olamayacağı, sözcüklerin farklı çağrışımlar yaratmasıyla açıklanır. Gerekçeli yargı da vardır. Kişi, yer, zaman ve olay örgüsüyle kurulmuş bir hikâye anlatılmamaktadır. Başvurulmayan yalnız birinci unsurdur. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Turkce-36', 'pair': ['TYT-A-Turkce-36', 'TYT-B-Turkce-19'], 'narration': 'Parçada sözcüklerin her okurda farklı çağrışımlar uyandırdığı söylenir. Okurun deneyimleri anlamlandırmayı etkiler. Bu nedenle şairin yaşantısı ile okurun şiirden edindiği yaşantı birebir aynı olamaz. Şiirin şairin iç dünyasını yansıtması bir başlangıç bilgisi olsa da asıl vurgu anlamın kişiden kişiye değişebilmesidir. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Turkce-37', 'pair': ['TYT-A-Turkce-37', 'TYT-B-Turkce-36'], 'narration': 'Parça kentleri hem ilham verici hem ürkütücü yönleriyle anlatır. Gürültü, kalabalık ve sağlıksız koşullar çekinceler doğurur. İş enerjisi, yenilikler ve farklı grupların kentleri farklı değerlendirmesi açıkça verilmiştir. Buna karşılık kentlerin insanı huzurlu ve güvende hissettirdiği söylenmiyor. Bu yargıyı parçaya kendi bilgimizle ekleyemeyiz. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Turkce-38', 'pair': ['TYT-A-Turkce-38', 'TYT-B-Turkce-37'], 'narration': 'Kentlerin sorunlarının karmaşık olduğu ve çözümün zor olduğu belirtiliyor. Ancak parça burada bitmiyor. Başarılı çözümler ve yerinde müdahaleler sayesinde kentlerin yeni ve uygun olanaklar sunduğu söyleniyor. Buradan doğru yönetilen kentlerin insanlara sürekli yeni fırsatlar sunduğu sonucuna ulaşılır. Ortaklık, uzmanlaşma veya geleneksel ilişkilerin çözülmesi metinde yoktur. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Turkce-39', 'pair': ['TYT-A-Turkce-39', 'TYT-B-Turkce-34'], 'narration': 'Parça iş ve çevre koşullarının değiştirilmesini örgütsel strateji olarak tanımlar. Bu değişiklikler yönetsel düzenlemelerle yapılır. Dinlenme, eğlenceli uğraşlar ve rahatlatıcı etkinlikler ise kişinin kendi yapabileceği davranışlardır. Bu ayrım nedeniyle çalışma şartlarını düzeltme, metindeki sınıflamaya göre bireysel strateji olamaz. Soruyu parçanın kendi ölçütüne göre yanıtlıyoruz. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Turkce-40', 'pair': ['TYT-A-Turkce-40', 'TYT-B-Turkce-35'], 'narration': 'Parça bütün stresten kaçınmanın zaten olanaksız olduğunu belirtir. Tamamen yok etmek gibi mutlak seçenekleri bu yüzden eleyebiliriz. Stresi verimlilik, enerji ve atikliğe doğru olumlu bir güce çevirmek mümkündür. Yönetimin amaçlarından biri budur. Öfkeyi tamamen bastırmak, her durumda olayın üstüne gitmek veya bütün sorumluluğu yönetime bırakmak önerilmemektedir. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-01', 'pair': ['TYT-A-Sosyal_Bilimler-01', 'TYT-B-Sosyal_Bilimler-04'], 'narration': 'Metinde Germenlerin yerleştiği bölgeler ve Roma İmparatorluğu’nun yıkılışındaki rolleri anlatılıyor. Bir imparatorluğun yıkılması, siyasi yapının değişmesi demektir. Bu yüzden verilen bilgiden doğrudan Avrupa’nın siyasi yapısının şekillenmesine ulaşıyoruz. Ulusçuluk, Hristiyanlığın yayılması ya da feodalitenin en yaygın yönetim olması için ayrıca bilgi gerekir. Tarih sorusunda metnin söylemediği sonucu eklemeyelim. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-02', 'pair': ['TYT-A-Sosyal_Bilimler-02', 'TYT-B-Sosyal_Bilimler-03'], 'narration': 'Mısırlıların mumyalama yapmasının ve firavunlara anıt mezar inşa etmesinin gerekçesi, ölümden sonraki yaşama inanmalarıdır. Bedeni koruma çabası, anatomi ve koruma teknikleriyle; piramitler ise mimari ve sanatla ilişkilidir. Verilen örnekler, inançların bilim ve sanat anlayışını etkilediğini gösterir. En eski veya en gelişmiş toplum oldukları gibi karşılaştırmalar metinden çıkarılamaz. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-03', 'pair': ['TYT-A-Sosyal_Bilimler-03', 'TYT-B-Sosyal_Bilimler-02'], 'narration': 'İstemi Yabgu’nun batı kanadını yönetmesi, Göktürklerde doğu ve batı biçimindeki ikili teşkilatın göstergesidir. Birinci yargıya ulaşılır. Sâsânîlerin sınır komşularıyla mücadele ettiği doğrudan söyleniyor. İkinci yargı da metinde var. Ak Hunların ipek ticaret yollarını kontrol etmesi, bir süre ekonomik güç taşıdıklarını gösterir. Böylece üç yargının tamamı desteklenir. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-04', 'pair': ['TYT-A-Sosyal_Bilimler-04', 'TYT-B-Sosyal_Bilimler-05'], 'narration': 'Tabloda Babailer İsyanı’nı çıkaran kişi Baba İshak olarak gösteriliyor. Gerekçe, Türkmenlerin yaşadığı sosyal ve ekonomik sıkıntılardır. İsyanın Moğollar tarafından başlatılıp yönetildiğine dair bir bilgi yok. Bu nedenle birinci seçenekteki çıkarım yapılamaz. Göçler, tampon devletin ortadan kalkması, Kösedağ yenilgisi ve iç huzursuzluklar diğer seçenekleri destekliyor. Tarihleri ve nedenleri birbirine karıştırmayalım. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-05', 'pair': ['TYT-A-Sosyal_Bilimler-05', 'TYT-B-Sosyal_Bilimler-01'], 'narration': 'Toprak üzerindeki egemenlik önce bütün hanedana, sonra padişah ve oğullarına, en sonunda padişaha bağlanıyor. Yetki giderek merkezileşiyor. Bu düzenlemeler taht üzerindeki hak iddialarını sınırlayarak siyasi istikrarı korumayı ve padişahın mutlak egemenliğini güçlendirmeyi hedefler. Osmanlı’daki hanedan egemenliğiyle ilgili bu değişimi ulus devlet kurma amacı olarak okuyamayız. İki numaralı yargı bu yüzden elenir. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-06', 'pair': ['TYT-A-Sosyal_Bilimler-06', 'TYT-B-Sosyal_Bilimler-09'], 'narration': 'Şekilde yeryüzünde ısınan havanın yükselmesi gösteriliyor. Yükselen hava soğur; yoğuşma ve yağış oluşabilir. Buna konveksiyonel yağış denir. Yüzeye yakın havanın yükselmesi, alçak basınç koşullarıyla ilişkilidir. Yüksek basınçta ise genel olarak alçalıcı hava hareketi vardır. Ekvator’da yaygın olması ve şiddetli olduğunda sele yol açabilmesi uygundur. Yanlış olan, oluşumunu yüksek basınca bağlayan seçenektir. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-07', 'pair': ['TYT-A-Sosyal_Bilimler-07', 'TYT-B-Sosyal_Bilimler-10'], 'narration': 'Çocuk bağımlı nüfus oranında yalnız en uzun alt çubuğu seçemeyiz. Çocukların, toplam nüfus veya çalışma çağındaki nüfus içindeki payını karşılaştırmalıyız. B ve E genç nüfusu fazla iki grafiktir. Kadın ve erkek çubuklarını birlikte, kendi toplamlarına göre okuduğumuzda B’nin genç yaş payı yaklaşık olarak biraz daha yüksek görünür. Ancak sayısal ölçek yoktur ve on ile on dokuz yaş aralığı, çocuk bağımlılığının on dört yaş sınırında ayrılmamıştır. Bu çizimden kesin bir oran hesaplanamaz; sonuç yaklaşık grafik okumasına bağlıdır. Bu yaklaşık okumayla B öne çıkar; grafik için belirttiğimiz sınırı unutmayalım.'}, {'id': 'TYT-A-Sosyal_Bilimler-08', 'pair': ['TYT-A-Sosyal_Bilimler-08', 'TYT-B-Sosyal_Bilimler-07'], 'narration': 'Sığınak, erken uyarı, drenaj ve risk haritaları, afet gerçekleşmeden önce hazırlık yapmaya yöneliktir. Bu uygulamalar doğa olayını bütünüyle kontrol etmeyi değil, insanların maruz kalacağı zararı ve riski azaltmayı amaçlar. Afet sonrası yardım veya kayıpları telafi etme seçenekleri zaman bakımından farklıdır. Verilen çalışmaların ortak amacı, afet öncesi hazırlıktır. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-09', 'pair': ['TYT-A-Sosyal_Bilimler-09', 'TYT-B-Sosyal_Bilimler-08'], 'narration': 'Magma yeryüzüne ulaşmadan yer kabuğu içinde yerleşip katılaşırsa iç püskürük şekiller oluşur. Lakolit, tabakalar arasında kubbemsi bir kütledir. Dayk ise çatlakları doldurup çevre tabakaları kesen magma kütlesidir. İkisi de yer altında oluşur. Krater ve kaldera volkanların yüzeydeki çukur biçimleridir. Bu yüzden doğru ikili, iki numaralı lakolit ile üç numaralı dayktır. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-10', 'pair': ['TYT-A-Sosyal_Bilimler-10', 'TYT-B-Sosyal_Bilimler-06'], 'narration': 'Ham madde ve ara malları işleyip yeni ürün elde etmek, sanayi faaliyetinin temel özelliğidir. Teknolojinin üretimde yoğun kullanılması, atölye ve fabrikaların yerleşmeyi geliştirmesi de sanayi işlevini gösterir. Madencilik ham maddeyi çıkarmaya odaklanır; soruda ise ham maddenin dönüştürülmesi anlatılıyor. Yerleşmenin baskın fonksiyonu sanayidir. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-11', 'pair': ['TYT-A-Sosyal_Bilimler-11', 'TYT-B-Sosyal_Bilimler-15'], 'narration': 'Descartes, bildiklerini sorgularken şüpheyi kalıcı bir amaç olarak kullanmıyor. Güvenilir bilginin temelini aramak için yöntem olarak kullanıyor. Her şeyden kuşku duyarken, kuşku duyan ve düşünen bir öznenin bulunduğundan kuşku duyamaz. Böylece kesin bir başlangıç bulur. Bu yaklaşım metodik şüphedir. Metnin sonucu, akıl yoluyla açık seçik bilgiye ulaşılabileceğidir; doğru bilginin imkânsız olduğu değildir. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-12', 'pair': ['TYT-A-Sosyal_Bilimler-12', 'TYT-B-Sosyal_Bilimler-13'], 'narration': 'Parça somut nesneleri değil, onların zihinsel tasarımlarını ve kavramlarını asıl gerçek kabul ediyor. Bu bakış, bilgide nesneden çok bilen özneye ve zihne öncelik verir. Seçenekler içinde bu düşünceyi öznenin asıl olduğu karşılar. Dış dünyanın olduğu gibi yansıtıldığını ya da nesnenin asıl olduğunu söylemek, parçadaki önceliği tersine çevirmek olur. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-13', 'pair': ['TYT-A-Sosyal_Bilimler-13', 'TYT-B-Sosyal_Bilimler-14'], 'narration': 'Felsefi düşünce, evreni ve insanı anlama arzusuyla soru sormaya dayanır. Hazır yanıtları sorgulamadan kabul etmekle yetinmez. Parçada mitolojik açıklamalardan uzaklaşıp akılcı temelde cevap aramak açıkça vurgulanmıştır. Var olan bilgilerle yetinme isteği bu süreci desteklemez; yeni soruların ve eleştirinin önünü kapatır. Etkisi olduğu söylenemeyen budur. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-14', 'pair': ['TYT-A-Sosyal_Bilimler-14', 'TYT-B-Sosyal_Bilimler-12'], 'narration': 'İnsan her şeyin ölçüsüdür düşüncesinde doğru, bireyin algısına göre değişir. Bu, bilginin göreli olduğunu savunmaktır. Rölativizm, genel ve değişmez bir ölçüt yerine kişiye veya koşullara göre değişen doğruları öne çıkarır. Sokrates, insanların farklı algılarının doğru bilginin ölçütü olamayacağını savunarak görecilik anlayışını eleştiriyor. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-15', 'pair': ['TYT-A-Sosyal_Bilimler-15', 'TYT-B-Sosyal_Bilimler-11'], 'narration': 'Herakleitos’a göre varlıkta sürekli değişim ve karşıtların mücadelesi vardır. Durağanlık temel ilke değildir. Ateş, hava, su ve toprak üzerinden verilen örnekler, şeylerin birbirine dönüşmesini anlatıyor. Bu görüşü karşılayan kavram oluştur. Burada yalnız bir madde adı aramıyoruz; varlığın sürekli değişme biçimini belirliyoruz. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-16', 'pair': ['TYT-A-Sosyal_Bilimler-16', 'TYT-B-Sosyal_Bilimler-19'], 'narration': 'Tabloda itidal, eksiklik ile aşırılığın arasında dengeli tutumdur. İfrat ve tefriti doğurmak değil, onlardan uzak durmaktır. Birinci yargı yanlıştır. Cömertlik cimrilik ile savurganlığın, cesaret de korkaklık ile aşırı atılganlığın arasında gösterilmiştir. İkinci yargı desteklenir. Tablonun ortak mesajı, erdemin ölçülü davranışla mümkün olduğudur. Üçüncü yargı da doğrudur; iki ve üçü birlikte seçeriz. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-17', 'pair': ['TYT-A-Sosyal_Bilimler-17', 'TYT-B-Sosyal_Bilimler-20'], 'narration': 'Parçada yalnız inanç esasları değil, ibadetler ve davranışlarla ilgili hükümler de sıralanıyor. Aile, ticaret ve miras gibi ilişkiler muamelat; suçlara ilişkin hükümler ukûbat başlığında açıklanıyor. Bu dört başlığın ortak sonucu, İslam’ın hem inancı hem de hayatın yaşanışını düzenleyen hükümler içerdiğidir. Diğer seçenekler parçanın bütününü karşılamaz. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-18', 'pair': ['TYT-A-Sosyal_Bilimler-18', 'TYT-B-Sosyal_Bilimler-17'], 'narration': 'Ayette yeme ve içme yasaklanmıyor; bunlarda ölçüyü aşmak, yani israf etmek yasaklanıyor. İsrafın önlenmesi, sahip olunan malın ve kaynakların gereksiz yere tüketilmemesiyle doğrudan ilişkilidir. Temel haklar arasından malın korunmasını seçmeliyiz. Dolaylı etkiler düşünerek sorunun doğrudan ilişki vurgusundan uzaklaşmayalım. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-19', 'pair': ['TYT-A-Sosyal_Bilimler-19', 'TYT-B-Sosyal_Bilimler-18'], 'narration': 'Parça, peygamberin vefatından sonra yönetimin kime geçeceğine ilişkin tartışmaları başlangıç noktası olarak veriyor. Cemel ve Sıffın olayları bu anlatımda yönetim ve iktidar mücadelesi çerçevesinde ele alınmıştır. Dini yorum ayrılıkları anlatılsa da burada vurgulanan neden, bir ayetin farklı açıklanması değil, siyasi gelişmelerdir. Sebep ile sonucu ayıralım. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-20', 'pair': ['TYT-A-Sosyal_Bilimler-20', 'TYT-B-Sosyal_Bilimler-16'], 'narration': 'Hadiste Allah’a inanmakla dosdoğru olmak birlikte isteniyor. İnanç, davranışta doğrulukla tamamlanıyor. Bu birliktelik, doğruluğun imanın dışa yansıması olduğunu ve inancın yalnız sözde kalmaması gerektiğini destekler. İmanla ahlakın birlikte vurgulanması, üçüncü yargıya da götürür. Üç yorum da verilen hadisin mesajıyla uyumludur. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-21', 'pair': ['TYT-A-Sosyal_Bilimler-21', 'TYT-B-Sosyal_Bilimler-25'], 'narration': 'Kişinin eyleminden sonra kendini ahlaken iyi ya da kötü hissetmesi, kendi davranışını içten değerlendirmesidir. Bu değerlendirme, doğru yaptığında iç huzuru, yanlış yaptığında pişmanlık veya rahatsızlık biçiminde belirebilir. Kavram vicdandır. Soruda bedensel zevk değil, eylemin ahlaki niteliğine yönelik iç değerlendirme öne çıkarılmıştır. Ödev, özgürlük ve amaç da bu iç yargının adı değildir. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-22', 'pair': ['TYT-A-Sosyal_Bilimler-22', 'TYT-B-Sosyal_Bilimler-23'], 'narration': 'Üç açıklama da zevki kendi başına istenen amaç, acıyı ise kaçınılan durum olarak gösteriyor. İyiyi hazla özdeşleştiren bu ahlak yaklaşımına hedonizm, yani hazcılık denir. Utilitarizmde toplam fayda ve mutluluk ölçütü öne çıkar. Buradaki doğrudan vurgu, yalnız zevkin kendinde iyi ve amaç olmasıdır; en uygun karşılık hazcılıktır. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-23', 'pair': ['TYT-A-Sosyal_Bilimler-23', 'TYT-B-Sosyal_Bilimler-24'], 'narration': 'Bu tablo güzeldir cümlesi, tablonun fiyatını, sanatçısının ününü veya teknik ölçülerini bildirmiyor. Tabloyu değerlendiren kişinin beğenisini ve güzellik değerini ifade ediyor. Bu nedenle estetik yargıdır. Bir eserin pahalı olmasıyla güzel bulunması farklı değerlendirmelerdir. Estetik nitelendirmenin dayanağı, beğeniyi yansıtmasıdır. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-24', 'pair': ['TYT-A-Sosyal_Bilimler-24', 'TYT-B-Sosyal_Bilimler-22'], 'narration': 'Parça insanların aynı değere sahip olduğunu, buna karşılık yetenek ve niteliklerinin farklı olabileceğini söylüyor. Eşitlik bütün insanların her bakımdan aynı olması demek değildir. Farklılıkları ortadan kaldırmak da değildir. İlkenin hedefi, haklardan ve olanaklardan yararlanmada ayrım gözetilmemesidir. Böylece farklı bireysel özelliklerle eşit haklar birlikte korunur. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Sosyal_Bilimler-25', 'pair': ['TYT-A-Sosyal_Bilimler-25', 'TYT-B-Sosyal_Bilimler-21'], 'narration': 'Parçada var olan bir devletin betimlenmesi değil, yazarın ideal yaşam ve yönetim düzenini taşıyan düş ülkeler anlatılıyor. Bu tasarımlar, mevcut toplumun sorunlarını eleştirirken arzulanan düzeni de gösterir. İdeal toplum ve devlet düzenini hayal ederek anlatan bu yaklaşım ütopyadır. Meşruiyet yönetimin haklılığı, etik ise ahlak felsefesidir; burada aranan onlar değildir. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-01', 'pair': ['TYT-A-Fen_Bilimleri-01', 'TYT-B-Fen_Bilimleri-05'], 'narration': 'Yüne sürtülen plastik tarak elektriklenir. Küçük kâğıtları çekmesi elektriksel kuvvetle ilgilidir; bu, temel kuvvetlerden elektromanyetik kuvvetin kapsamındadır. Daldaki elmanın yere düşmesi, Dünya ile elma arasındaki kütle çekim etkisidir. Nükleer kuvvetler çekirdek ölçeğindeki olaylarla ilişkilidir. Verilen iki olayın sırası, elektromanyetik ve kütle çekim olmalıdır. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-02', 'pair': ['TYT-A-Fen_Bilimleri-02', 'TYT-B-Fen_Bilimleri-06'], 'narration': 'Isı, sıcaklığı kırk derece olan Y’den on derece olan X’e aktarılır. Birinci yargı doğrudur. Aynı maddeden oldukları için öz ısıları aynıdır. Alınan ısı ile verilen ısı eşittir. Te eksi on, seksen eksi iki teye eşit olur; buradan denge sıcaklığı otuz derecedir. İkinci yargı yanlıştır. X’in sıcaklığı yirmi, Y’nin sıcaklığı on derece değişir. X’in sıcaklık değişimi daha büyüktür. Birinci ve üçüncü yargıları seçeriz. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-03', 'pair': ['TYT-A-Fen_Bilimleri-03', 'TYT-B-Fen_Bilimleri-07'], 'narration': 'K su yüzeyinde kısmen batmış, L ise kabın dibine çökmüştür. K’nin özkütlesi sudan küçük, L’ninki sudan büyüktür. Birinci yargı doğrudur. Kürelerin toplam hacimleri eşittir. L’nin tamamı, K’nin yalnız bir bölümü su içinde olduğundan standart kaldırma kuvveti modelinde L’ye etki eden kaldırma kuvveti daha büyüktür. L su içinde askıda değil, dibe çökmüş durumdadır. Bu nedenle özkütlesinin suya eşit olduğunu söyleyen üçüncü yargı yanlıştır. Bir ve iki doğrudur. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-04', 'pair': ['TYT-A-Fen_Bilimleri-04', 'TYT-B-Fen_Bilimleri-02'], 'narration': 'Yer altındaki rezervi sınırlı olan ve kullanımı kirlilik oluşturan birinci kaynak, yenilenemez kaynak özellikleri taşır. İkinci kaynakta tükenme riski bulunmaması vurgulanıyor. Yüksek kurulum maliyeti, onu yenilenemez yapmaz. Kazıyla çıkarılıp yakıldığında sera gazlarını artıran üçüncü kaynak da fosil yakıt özellikleri gösterir. Yenilenemez olanlar bir ve üçtür. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-05', 'pair': ['TYT-A-Fen_Bilimleri-05', 'TYT-B-Fen_Bilimleri-03'], 'narration': 'Hız zaman grafiğinin altında kalan alan yer değiştirmeyi verir. İlk on saniyede hız bir buçuk olduğundan ilk bantta alınan yol on beş metredir. İkinci bantta beş saniye boyunca hız üçtür; burada da on beş metre ilerler. Hareket aynı yönde olduğundan toplam yer değiştirme otuz metredir. Toplam süre on beş saniyedir. Otuzu on beşe bölersek ortalama hızın büyüklüğü saniyede iki metre olur. Üç yargı da doğrudur. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-06', 'pair': ['TYT-A-Fen_Bilimleri-06', 'TYT-B-Fen_Bilimleri-01'], 'narration': 'Şekilde başlangıç ile bitiş arasında iki tam dalga bulunuyor. Aynı fazdaki noktalar arasındaki tekrarları sayalım. Yirmi dört santimetre iki dalga boyu olduğundan bir dalga boyu on iki santimetredir. Kaynak dört saniyede iki tam dalga üretmiştir. Bir tam dalga üretme süresi, yani periyot iki saniyedir. On iki santimetre ve iki saniyeyi birlikte seçeriz. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-07', 'pair': ['TYT-A-Fen_Bilimleri-07', 'TYT-B-Fen_Bilimleri-04'], 'narration': 'Birinci devrede anahtar açıkken iki direnç seri, eş değer direnç iki erdir. Kapanınca soldaki iki direnç paralel olur; er bölü ikiye sağdaki er eklenir. Eş değer direnç üç er bölü ikiye düşer. İkinci devrede anahtar kapanınca soldaki direnç kısa devre olur. Devrede yalnız sağdaki er direnci etkili kalır. Eş değer direnç yine azalır. Üreteç gerilimleri sabittir ve ampermetreler toplam akımı ölçer. Eş değer direnç azaldığı için her iki ampermetrenin gösterdiği akım artar. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-08', 'pair': ['TYT-A-Fen_Bilimleri-08', 'TYT-B-Fen_Bilimleri-12'], 'narration': 'Okul düzeyindeki adlandırmada alüminyumun iyon yükü sabit, artı üç kabul edilir. Bu yüzden adında Roma rakamıyla ayrıca yük belirtilmez. Bileşiğin beklenen adı alüminyum nitrattır. Alüminyum üç nitrat biçimindeki Stock gösterimi bu sorunun kullandığı adlandırma kuralına uymaz. Bakır ve cıva farklı yükseltgenme basamakları alabildiği için verilen iki rakamı uygundur. Kovalent bileşiklerdeki di ve tri ön ekleri de atom sayılarına uyar. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-09', 'pair': ['TYT-A-Fen_Bilimleri-09', 'TYT-B-Fen_Bilimleri-11'], 'narration': 'Elektronları toplarsak X on iki, Y on yedi elektrona sahiptir. X magnezyum, yani toprak alkali metalidir; Y klor, yani halojendir. Birinci yargı doğru. Metal olan X elektron verir, Y elektron alır. Aralarında ortaklaşa elektron kullanımıyla değil, iyonik etkileşimle bileşik oluşur. İkinci yargı yanlıştır. İyonik bileşik eridiğinde iyonlar hareket edebilir ve elektrik akımını iletir. Üçüncü yargı da doğrudur; bir ve üçü seçeriz. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-10', 'pair': ['TYT-A-Fen_Bilimleri-10', 'TYT-B-Fen_Bilimleri-14'], 'narration': 'Kükürt dioksitin mol kütlesi otuz iki artı iki çarpı on altı, yani altmış dört gramdır. Başlangıçta her iki gazdan birer mol vardır. Denkleme göre iki mol hidrojen sülfür, bir mol kükürt dioksitle tepkimeye girer. Bir mol hidrojen sülfür için yarım mol kükürt dioksit yeterlidir; sınırlayıcı hidrojen sülfürdür. İki mol hidrojen sülfürden üç mol kükürt oluşuyorsa bir molden bir buçuk mol oluşur. Bir buçuk ile otuz ikiyi çarpar, kırk sekiz gram buluruz. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-11', 'pair': ['TYT-A-Fen_Bilimleri-11', 'TYT-B-Fen_Bilimleri-13'], 'narration': 'Bir mol kükürt dioksitte otuz iki gram oksijen vardır. Verilen on altı gram oksijen bunun yarısıdır; örnek yarım moldür. Birinci yargı yanlıştır. Bir mol bileşiğin altmış dört gramının otuz iki gramı kükürttür. Kükürdün kütlece yüzdesi ellidir; ikinci yargı doğrudur. Normal koşullarda bir mol gaz yirmi iki virgül dört litre hacim kaplar. Yarım mol, on bir virgül iki litredir. İkinci ve üçüncü yargılar doğrudur. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-12', 'pair': ['TYT-A-Fen_Bilimleri-12', 'TYT-B-Fen_Bilimleri-10'], 'narration': 'Birinci kaptaki glikoz bir moldür. İkinci kaptaki mol sayısı sıfır virgül sekiz çarpı yarım litreden sıfır virgül dört moldür. Toplam bir virgül dört mol glikoz var. Son derişim bir virgül dört molar olduğuna göre toplam çözelti hacmi bir litredir. Hacimlerin toplandığı kabulüyle birinci kabın hacmi, bin mililitreden beş yüz mililitre çıkarılarak beş yüz mililitre bulunur. Litre ile mililitreyi karıştırmayalım. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-13', 'pair': ['TYT-A-Fen_Bilimleri-13', 'TYT-B-Fen_Bilimleri-08'], 'narration': 'Önce sıcaklıkları aynı birime çevirelim. Yirmi yedi derece Celsius, yaklaşık üç yüz Kelvin’dir. İki gaz aynı sıcaklıktadır. Graham yasasına göre hız, mol kütlesinin kareköküyle ters orantılıdır. Hidrojenin hızı oksijeninkinin dört katıdır. Aynı sürede oksijen iks, hidrojen dört iks yol alır. Toplam yüz elli santimetre olduğundan iks otuz santimetredir. Bir numaralı musluk oksijen tarafında olduğu için aranan uzaklık otuzdur. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-14', 'pair': ['TYT-A-Fen_Bilimleri-14', 'TYT-B-Fen_Bilimleri-09'], 'narration': 'Ekolojik sürdürülebilirlik, kaynakları koruyarak ve kirliliği azaltarak üretim ve tüketimin devam etmesini hedefler. Yeşil kimya ilkeleri zararlı madde ve atık oluşumunu azaltmayı amaçlar. Bu ilkelere aykırı üretim, sürdürülebilirlik hedefiyle uyuşmaz. Yenilenebilir enerji, geri dönüşüm, zararlı atıkları önleme ve çevre dostu madde seçimi bu hedefi destekler. Uygun olmayan üçüncü seçenektir. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-15', 'pair': ['TYT-A-Fen_Bilimleri-15', 'TYT-B-Fen_Bilimleri-20'], 'narration': 'Hif, mantarların ipliksi yapısının adıdır; bitkilerin kök sistemi değildir. Sorudaki ayırt edici sözcük budur. Bitkiler aleminde fotosentezle besin üreten ve oksijenli solunum yapan türler bulunur. Selüloz içeren hücre duvarı da bitkilerin tipik özelliğidir. Bütün bitkilerde iletim demeti bulunması gerekmez; soruda türlerde rastlanabilen özellikler soruluyor. İletim demetli bitkiler vardır, fakat hif bitki kökü değildir. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-16', 'pair': ['TYT-A-Fen_Bilimleri-16', 'TYT-B-Fen_Bilimleri-18'], 'narration': 'Mineraller metabolik süreçlerde görev alır, bazı enzimlerin çalışmasına yardımcı olur ve enerji veren besinler arasında sayılmaz. Vücudun ihtiyaç duyduğu bir mineralin yetersizliği, o mineralin görev yaptığı süreçleri etkileyebilir. Bu nedenle eksikliğin belirgin sorun oluşturmayacağını söylemek yanlıştır. Diğer seçenekler minerallerin bilinen görevleriyle uyumludur. Söylenemeyen, mineral eksikliğinin sağlık sorunu doğurmadığını öne süren seçenektir. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-17', 'pair': ['TYT-A-Fen_Bilimleri-17', 'TYT-B-Fen_Bilimleri-19'], 'narration': 'Bilimsel yöntemde problem belirlenir, gözlemler yapılır, hipotez kurulur ve uygun deneylerle sınanır. Bu adımlar kanıt üretmeye yöneliktir. Elde edilen veriler hipotezi destekleyebilir veya onun değiştirilmesini gerektirebilir. Sonucu önceden kişisel inanca göre seçemeyiz. Bu yüzden kişisel inançlarla uyumlu sonuçlar çıkarma, bilimsel yöntemin beklenen bir uygulaması değildir. Ölçüt, gözlem ve deneyden gelen kanıttır. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-18', 'pair': ['TYT-A-Fen_Bilimleri-18', 'TYT-B-Fen_Bilimleri-15'], 'narration': 'Tablodaki okul düzeyi sindirim modelinde yağların kimyasal sindirimi iki numarada gösterilmiştir. Bu bölüm ince bağırsaktır; diğer besinlerin sindirimi de burada sürer. Karbohidratların kimyasal sindirimi ağızda başlayıp ince bağırsakta devam eder. Bir ve iki dendiğine göre bir numara ağızdır. Proteinlerin kimyasal sindirimi midede başlayıp ince bağırsakta sürer. İki ve üçteki üç, midedir. Sıralama ağız, ince bağırsak, mide olur. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-19', 'pair': ['TYT-A-Fen_Bilimleri-19', 'TYT-B-Fen_Bilimleri-17'], 'narration': 'Ekolojik niş yalnız yaşanılan yer değildir. Beslenme, enerji akışındaki rol, diğer canlılarla ilişkiler ve etkinlik zamanı gibi özellikleri kapsar. İkinci ifade doğrudur. Arıların tozlaşma ve besin olma işlevleri diğer türlerle bağlantılıdır. Bu işlevlerin kaybı, diğer canlıları ve besin ağını etkiler. Birinci ifade yanlıştır. Tamamen aynı nişi paylaşan türler aynı sınırlı kaynakları kullanır ve aralarında rekabet beklenir. Rekabetsiz birlikte yaşayacaklarını söyleyen üçüncü ifade de yanlıştır. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Fen_Bilimleri-20', 'pair': ['TYT-A-Fen_Bilimleri-20', 'TYT-B-Fen_Bilimleri-16'], 'narration': 'Kemosentez yapan bakteriler enerji kaynağı olarak inorganik maddelerin oksidasyonundan yararlanır. Açığa çıkan enerjiyle ATP üretebilirler. Bu enerji, inorganik karbon kaynağından organik madde üretiminde ve diğer hücresel işlerde kullanılır. Hücre gerekli enzimleri de sentezler. Kemosentezin enerji kaynağı ışık değildir. Işık enerjisinin soğurulması fotosentezle ilişkili olduğundan, burada beklenmeyen olay budur. Doğru cevap D seçeneğidir.'}]
          for item in items:
              try:
                  produce(item)
              except ProductionStop:
                  raise SystemExit(2)
              except Exception as error:
                  print('BATCH_STOP '+json.dumps({'id':item['id'],'error_type':type(error).__name__,'action':'Inspect saved artifacts before any new TTS request.'}))
                  raise SystemExit(3)

      - name: Preserve generated audio and provider timestamps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atolye-tyt-batch02-${{ github.run_id }}
          path: atolye-tyt-batch02/
          if-no-files-found: warn
          retention-days: 30
