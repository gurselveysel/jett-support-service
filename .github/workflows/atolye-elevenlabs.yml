name: Atolye ElevenLabs R12 Batch02
run-name: Atolye R12 Batch02 - 8 unique questions - included credit
on:
  push:
    branches: [atolye-elevenlabs-20260921]
    paths: [.github/workflows/atolye-elevenlabs.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: atolye-elevenlabs-production
  cancel-in-progress: false
jobs:
  speech:
    if: github.ref == 'refs/heads/atolye-elevenlabs-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ensure audio verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Verify quota and produce 8 real narrations with provider timestamps
        shell: python
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          import json, pathlib
          class ProductionStop(Exception): pass
          def produce(item):
              import os, sys, json, pathlib, urllib.request, urllib.error, base64, hashlib, re, math
              out = pathlib.Path('atolye-r12-batch02')/item['id']
              out.mkdir(parents=True,exist_ok=True)
              voice = 'tZYpRZkmCNQcfmtDbhUg'
              model_id = 'eleven_v3'
              report = {'pair':item['pair'],
                        'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                        'commit':os.environ.get('GITHUB_SHA'), 'run_id':os.environ.get('GITHUB_RUN_ID'),
                        'credential_present':False,'api_called':False,'tts_called':False,
                        'audio_generated':False,'fallback_used':False,'video_completed':False,
                        'auditory_review':False}
              def save_report(status, **extra):
                  report.update(status=status, **extra)
                  (out/'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('ATOLYE_RESULT '+json.dumps(report,ensure_ascii=False))
              def stop(status, **extra):
                  save_report(status, **extra)
                  raise ProductionStop(status)
              key = os.environ.get('ELEVENLABS_API_KEY','').strip()
              if not key:
                  stop('blocked_missing_credential', required_secret='ELEVENLABS_API_KEY')
              report['credential_present'] = True
              # A rerun must never unknowingly spend credits twice. Use a fresh dispatch only after inspecting artifacts.
              if int(os.environ.get('GITHUB_RUN_ATTEMPT','1')) > 1:
                  stop('blocked_automatic_audio_regeneration', action='Inspect and reuse existing audio artifacts; fresh dispatch only if no audio was generated.')
              text=item['narration']
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              def call(path, payload=None):
                  report['api_called'] = True
                  req = urllib.request.Request('https://api.elevenlabs.io'+path,
                      headers={'xi-api-key':key,'Content-Type':'application/json'},
                      data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                      method='GET' if payload is None else 'POST')
                  try:
                      with opener.open(req, timeout=180) as response:
                          return json.loads(response.read(24000000)), response.headers.get('request-id')
                  except urllib.error.HTTPError as error:
                      try:
                          detail=json.loads(error.read(4000)).get('detail',{})
                          provider_code=detail.get('status') if isinstance(detail,dict) else None
                          if not isinstance(provider_code,str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,100}',provider_code) or key in provider_code:
                              provider_code=None
                      except Exception:
                          provider_code=None
                      stop('provider_error', http_status=error.code, provider_code=provider_code,
                           operation='tts' if payload is not None else path)
                  except Exception as error:
                      stop('transport_or_response_error', error_type=type(error).__name__,
                           tts_outcome_uncertain=payload is not None)
              voice_info,_=call('/v1/voices/'+voice)
              if voice_info.get('voice_id') != voice:
                  stop('blocked_voice_mismatch')
              report['voice_accessible'] = True
              models,_=call('/v1/models')
              selected=next((m for m in models if m.get('model_id')==model_id),None)
              if not selected or not selected.get('can_do_text_to_speech'):
                  stop('blocked_model_unavailable')
              report['model_accessible'] = True
              subscription,_=call('/v1/user/subscription')
              used=subscription.get('character_count')
              limit=subscription.get('character_limit')
              if type(used) is not int or type(limit) is not int or used<0 or limit<0:
                  stop('blocked_quota_not_verifiable')
              # No billing settings are changed. Stop unless paid overage is known to be disabled.
              extension=subscription.get('max_credit_limit_extension')
              overage_disabled=(type(extension) is int and extension==0) or subscription.get('can_extend_character_limit') is False
              if not overage_disabled:
                  stop('blocked_paid_overage_not_disabled', action='No audio request made; billing settings were not changed.')
              rates=selected.get('model_rates') or {}
              cost_factor=rates.get('character_cost_multiplier',selected.get('token_cost_factor'))
              if not isinstance(cost_factor,(int,float)) or isinstance(cost_factor,bool) or not math.isfinite(cost_factor) or cost_factor<=0:
                  stop('blocked_model_cost_not_verifiable')
              required=math.ceil(len(text)*max(1.0,float(cost_factor)))
              remaining=limit-used
              report.update(narration_characters=len(text), required_credits_conservative=required,
                            quota_checked=True, paid_overage_disabled=True, remaining_included_credits=remaining)
              if remaining < required:
                  stop('blocked_insufficient_included_credits', required_credits=required, remaining_included_credits=max(0,remaining))
              maximum=selected.get('maximum_text_length_per_request')
              tier_limit=selected.get('max_characters_request_free_user' if subscription.get('tier')=='free' else 'max_characters_request_subscribed_user')
              limits=[x for x in [maximum,tier_limit] if isinstance(x,int) and x>0]
              if limits and len(text)>min(limits):
                  stop('blocked_text_exceeds_model_limit', model_character_limit=min(limits))
              payload={'text':text,'model_id':model_id,'language_code':'tr',
                       'voice_settings':{'stability':0.5,'speed':0.94}}
              (out/'narration.txt').write_text(text,encoding='utf-8')
              report['narration_sha256']=hashlib.sha256(text.encode('utf-8')).hexdigest()
              report['tts_called']=True
              save_report('tts_request_started')
              result,request_id=call('/v1/text-to-speech/'+voice+'/with-timestamps?output_format=mp3_44100_128',payload)
              try:
                  audio=base64.b64decode(result['audio_base64'],validate=True)
                  if len(audio)<10000:
                      stop('invalid_audio_size')
                  (out/'speech.mp3').write_bytes(audio)
                  report.update(audio_generated=True, bytes=len(audio), sha256=hashlib.sha256(audio).hexdigest())
                  (out/'alignment.json').write_text(json.dumps({'alignment':result.get('alignment'),'normalized_alignment':result.get('normalized_alignment')},ensure_ascii=False,indent=2),encoding='utf-8')
                  alignment=result.get('normalized_alignment') or result.get('alignment')
                  if not alignment:
                      stop('audio_saved_but_alignment_missing', action='Reuse saved audio; do not regenerate for drawing.')
                  chars=alignment['characters']
                  starts=alignment['character_start_times_seconds']
                  ends=alignment['character_end_times_seconds']
                  assert len(chars)==len(starts)==len(ends)>0
                  assert all(isinstance(c,str) and len(c)==1 for c in chars)
                  assert all(math.isfinite(float(s)) and math.isfinite(float(e)) and 0<=float(s)<=float(e) for s,e in zip(starts,ends))
                  assert all(float(starts[i])<=float(starts[i+1]) for i in range(len(starts)-1))
                  joined=''.join(chars)
                  def segments(pattern):
                      return [{'text':m.group().strip(),'start':starts[m.start()],'end':ends[m.end()-1]} for m in re.finditer(pattern,joined) if m.group().strip()]
                  words=segments(r'\S+')
                  phrases=segments(r'[^.!?\n]+[.!?]?')
                  speech={'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                          'duration_alignment':max(ends),'word_timestamps':words,'phrase_timestamps':phrases,
                          'text':text,'request_id':request_id,'timing_source':'provider_character_alignment'}
                  (out/'speech.json').write_text(json.dumps(speech,ensure_ascii=False,indent=2),encoding='utf-8')
                  save_report('audio_saved_pending_decode', word_count=len(words),phrase_count=len(phrases),
                              last_alignment_second=max(ends), character_alignment_validated=True)
              except Exception as error:
                  stop('audio_processing_error',error_type=type(error).__name__,action='Inspect saved files before any new TTS request.')
              import subprocess
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(out/'speech.mp3')]))
              duration=float(probe['format']['duration'])
              assert math.isfinite(duration) and duration>1
              assert any(s['codec_type']=='audio' for s in probe['streams'])
              assert report['last_alignment_second']<=duration+0.5
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(out/'speech.mp3'),'-f','null','-'],check=True,capture_output=True)
              save_report('audio_generated_and_decoded',duration_seconds=duration,audio_decode_pass=True,auditory_review=False)

          items=[{'id': 'A-Temel_Matematik-12', 'pair': ['A-Temel_Matematik-12', 'B-Temel_Matematik-18'], 'narration': 'Akış şemasını adım adım izleyelim. Önce te değerini, iksin karesinden iks ile yenin çarpımını çıkararak buluyoruz. Te doksana eşit ya da büyükse işlem durur. Küçükse iks bir artar, ye bir azalır ve hesap tekrarlanır.\n\nBaşlangıçta iks üç, ye eksi dört. Üçün karesi dokuzdur. Üç ile eksi dördün çarpımı eksi on iki. Dokuzdan eksi on ikiyi çıkarınca yirmi bir buluruz. Doksandan küçük, devam.\n\nİks dört ve ye eksi beş olunca on altı artı yirmi, otuz altı eder. İks beş ve ye eksi altıda yirmi beş artı otuz, elli beş eder. Her ikisi de doksandan küçük.\n\nİks altı, ye eksi yedi için otuz altı artı kırk iki, yetmiş sekizdir. Henüz duramayız. İks yedi ve ye eksi sekize geçeriz. Kırk dokuz artı elli altı, yüz beş eder.\n\nYüz beş doksandan büyük olduğu için bu kez evet yolunu izleriz. Ekrana yüz beş yazılır. D seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-08', 'pair': ['A-Fen_Bilimleri-08', 'B-Fen_Bilimleri-13'], 'narration': 'Grafikte başlangıçta sıfır virgül bir mol iks bileşiği var. Tepkime sonunda iks tamamen tükenirken sıfır virgül üç mol karbondioksit ve sıfır virgül dört mol su oluşuyor.\n\nKarbondioksitin her molekülünde bir karbon bulunur. Sıfır virgül üçü sıfır virgül bire bölersek, iks molekülü başına üç karbon atomu elde ederiz.\n\nSuyun her molekülünde iki hidrojen vardır. İki çarpı sıfır virgül dört, bölü sıfır virgül bir, sekiz eder. Bileşiğimiz üç karbon ve sekiz hidrojen içerir. İkinci yargıdaki üç karbon dört hidrojen formülü yanlıştır.\n\nKimyasal tepkimelerde toplam kütle korunur; birinci yargı doğrudur. Grafik, yeterli oksijenle yakılan iksin tamamen tükendiğini gösterdiğinden sorunun ideal tepkime kabulünde tam verim vardır. Üçüncü yargı da doğrudur. Birinci ve üçüncüyü veren C seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-15', 'pair': ['A-Fen_Bilimleri-15', 'B-Fen_Bilimleri-19'], 'narration': 'Burada doğru ifadeleri değil, söylenemeyecek ifadeleri seçiyoruz. Hücresel canlılar prokaryot ya da ökaryot yapıdadır. Birinci ifade bu ayrımı doğru verir.\n\nAncak tek hücreli olmak, mutlaka prokaryot olmak demek değildir. Amip ve maya tek hücreli ökaryot örnekleridir. Bu örnekler, ikinci ifadedeki tümü sözünü geçersiz kılar.\n\nAynı örnekler üçüncü ifadeyi de çürütür. Ökaryotların hepsi çok hücreli olsaydı tek hücreli amip ve maya bulunamazdı. Ökaryotlarda hem tek hücreli hem çok hücreli canlılar vardır.\n\nO halde ikinci ve üçüncü ifadeler söylenemez. D seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-06', 'pair': ['A-Sosyal_Bilimler-06', 'B-Sosyal_Bilimler-10'], 'narration': 'Şekilde aynı dağın denize bakan yamacındaki bitki kuşaklarını görüyoruz. Deniz seviyesine yakın yerde geniş yapraklı ormanlar var. Yükseldikçe karma ormanlara, iğne yapraklı ormanlara ve en üstte dağ çayırlarına geçiliyor.\n\nBurada karşılaştırılan yerlerin yüksekliği değişiyor. Yükseldikçe sıcaklık genel olarak azalır. Sıcaklık koşulları değişince bu koşullara uyum sağlayan bitkiler de değişir; kuşaklanma ortaya çıkar.\n\nŞekil iki farklı yamacın güneşlenmesini ya da rüzgarların etkisini karşılaştırmıyor. Kara ile denizin ısınma hızını da göstermiyor. Doğrudan desteklediği bilgi, yükseldikçe sıcaklığın düşmesidir. B seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-11', 'pair': ['A-Sosyal_Bilimler-11', 'B-Sosyal_Bilimler-12'], 'narration': 'Parçada filozofun yaptığı iki ayrı iş anlatılıyor. Önce kendisine sunulan bilgi, deney, algı ve sezgi sonuçlarını inceliyor, yeniden düşünüyor ve analiz ediyor. Bu aşama çözümlemedir.\n\nSonra elindeki verilerden hareketle dünyayı yeniden oluşturuyor; bir birlik ve bütünlük kuruyor. Bu ikinci aşama yeniden kurucu olmayı anlatır.\n\nİki aşamayı birlikte karşılayan ifade, filozofun çözümleyici ve yeniden kurucu olduğudur. Parçada yalnızca soyut düşünceye yönelme ya da bilimsel otoriteye uyumdan söz edilmiyor. C seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-16', 'pair': ['A-Sosyal_Bilimler-16', 'B-Sosyal_Bilimler-19'], 'narration': 'Ödevin konusu İslamda aile içi iletişim ve görevler. Soru, bu konuyla doğrudan ilgisi bulunmayan sözü soruyor. Bu nedenle seçeneklerin hangi ilişkiyi anlattığına bakalım.\n\nEşlerin karşılıklı hakları aile içi görevlerle ilgilidir. Çocuğa güzel terbiye verilmesi de ailedeki sorumlulukları anlatır. Bakmakla yükümlü olunan kişileri ihmal etmemek ve aileye iyi davranmak da aynı konunun içindedir.\n\nA seçeneği ise genel olarak duanın kıymetini anlatıyor. Bu sözde aile içi iletişim veya aile üyelerinin görevleri doğrudan ele alınmıyor. Seçenekleri konuyla ilgileri bakımından karşılaştırınca A seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-21', 'pair': ['A-Sosyal_Bilimler-21', 'B-Sosyal_Bilimler-23'], 'narration': 'Bu soruda parçanın hangi siyaset felsefesi sorularına cevap verdiğini belirliyoruz. Metin, yönetimi tek kişinin, birkaç kişinin ya da çoğunluğun üstlenmesini karşılaştırıyor. Bu, devleti kimin yönetmesi gerektiği sorusuyla ilgilidir. İkinci maddeye ulaşırız.\n\nYönetimin iyi olması da hukuka bağlılık, bilgelik ve halkın çıkarlarını gözetme üzerinden açıklanıyor. Böylece en iyi yönetim şeklinin ne olduğu sorusuna da cevap aranıyor. Üçüncü madde de var.\n\nFakat parçada sivil toplumun anlamı tanımlanmıyor. Birinci maddeyi alamayız. İkinci ve üçüncü maddeleri birlikte veren E seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-02', 'pair': ['A-Turkce-02', 'B-Turkce-15'], 'narration': 'Sözün anlamını bulunduğu bağlamla çözelim. Yazar yeni kitabının önceki romanını tekrar etmesini istemiyor; yeni ve farklı bir eser amaçlıyor. Ancak başlangıcı yapmakta zorlanıyor.\n\nİğneye ipliği geçirmenin zor olması, burada yazma işine başlayıp ilk ilerlemeyi sağlamanın güçlüğünü anlatıyor. Hemen sonraki cümlede haftalar geçtiği halde ancak birkaç sayfa yazabildiğini söylüyor.\n\nDemek ki hiç başlayamamış değil; güç de olsa birkaç sayfalık giriş yapmış. Özgün olma isteği metinde var ama sorulan sözün doğrudan anlamı bu değil. Kolay olmasa da yapıtına giriş yapabildiğini belirten E seçeneğini işaretliyoruz.'}]
          for item in items:
              try:
                  produce(item)
              except ProductionStop:
                  raise SystemExit(2)
              except Exception as error:
                  print('BATCH_STOP '+json.dumps({'id':item['id'],'error_type':type(error).__name__,'action':'Inspect saved artifacts before any new TTS request.'}))
                  raise SystemExit(3)

      - name: Preserve all generated audio and timestamps even after partial failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atolye-r12-batch02-${{ github.run_id }}
          path: atolye-r12-batch02/
          if-no-files-found: warn
          retention-days: 30
