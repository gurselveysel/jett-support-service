name: Atolye ElevenLabs R12 Batch07
run-name: Atolye R12 Batch07 - 16 unique questions - included credit
on:
  push:
    branches: [atolye-elevenlabs-20260921]
    paths: [.github/workflows/atolye-elevenlabs.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: atolye-elevenlabs-production
  cancel-in-progress: false
jobs:
  speech:
    if: github.ref == 'refs/heads/atolye-elevenlabs-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ensure audio verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Verify quota and produce 16 real narrations with provider timestamps
        shell: python
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          import json, pathlib
          class ProductionStop(Exception): pass
          def produce(item):
              import os, sys, json, pathlib, urllib.request, urllib.error, base64, hashlib, re, math
              out = pathlib.Path('atolye-r12-batch07')/item['id']
              out.mkdir(parents=True,exist_ok=True)
              voice = 'tZYpRZkmCNQcfmtDbhUg'
              model_id = 'eleven_v3'
              report = {'pair':item['pair'],
                        'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                        'commit':os.environ.get('GITHUB_SHA'), 'run_id':os.environ.get('GITHUB_RUN_ID'),
                        'credential_present':False,'api_called':False,'tts_called':False,
                        'audio_generated':False,'fallback_used':False,'video_completed':False,
                        'auditory_review':False}
              def save_report(status, **extra):
                  report.update(status=status, **extra)
                  (out/'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('ATOLYE_RESULT '+json.dumps(report,ensure_ascii=False))
              def stop(status, **extra):
                  save_report(status, **extra)
                  raise ProductionStop(status)
              key = os.environ.get('ELEVENLABS_API_KEY','').strip()
              if not key:
                  stop('blocked_missing_credential', required_secret='ELEVENLABS_API_KEY')
              report['credential_present'] = True
              # A rerun must never unknowingly spend credits twice. Use a fresh dispatch only after inspecting artifacts.
              if int(os.environ.get('GITHUB_RUN_ATTEMPT','1')) > 1:
                  stop('blocked_automatic_audio_regeneration', action='Inspect and reuse existing audio artifacts; fresh dispatch only if no audio was generated.')
              text=item['narration']
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              def call(path, payload=None):
                  report['api_called'] = True
                  req = urllib.request.Request('https://api.elevenlabs.io'+path,
                      headers={'xi-api-key':key,'Content-Type':'application/json'},
                      data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                      method='GET' if payload is None else 'POST')
                  try:
                      with opener.open(req, timeout=180) as response:
                          return json.loads(response.read(24000000)), response.headers.get('request-id')
                  except urllib.error.HTTPError as error:
                      try:
                          detail=json.loads(error.read(4000)).get('detail',{})
                          provider_code=detail.get('status') if isinstance(detail,dict) else None
                          if not isinstance(provider_code,str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,100}',provider_code) or key in provider_code:
                              provider_code=None
                      except Exception:
                          provider_code=None
                      stop('provider_error', http_status=error.code, provider_code=provider_code,
                           operation='tts' if payload is not None else path)
                  except Exception as error:
                      stop('transport_or_response_error', error_type=type(error).__name__,
                           tts_outcome_uncertain=payload is not None)
              voice_info,_=call('/v1/voices/'+voice)
              if voice_info.get('voice_id') != voice:
                  stop('blocked_voice_mismatch')
              report['voice_accessible'] = True
              models,_=call('/v1/models')
              selected=next((m for m in models if m.get('model_id')==model_id),None)
              if not selected or not selected.get('can_do_text_to_speech'):
                  stop('blocked_model_unavailable')
              report['model_accessible'] = True
              subscription,_=call('/v1/user/subscription')
              used=subscription.get('character_count')
              limit=subscription.get('character_limit')
              if type(used) is not int or type(limit) is not int or used<0 or limit<0:
                  stop('blocked_quota_not_verifiable')
              # No billing settings are changed. Stop unless paid overage is known to be disabled.
              extension=subscription.get('max_credit_limit_extension')
              overage_disabled=(type(extension) is int and extension==0) or subscription.get('can_extend_character_limit') is False
              if not overage_disabled:
                  stop('blocked_paid_overage_not_disabled', action='No audio request made; billing settings were not changed.')
              rates=selected.get('model_rates') or {}
              cost_factor=rates.get('character_cost_multiplier',selected.get('token_cost_factor'))
              if not isinstance(cost_factor,(int,float)) or isinstance(cost_factor,bool) or not math.isfinite(cost_factor) or cost_factor<=0:
                  stop('blocked_model_cost_not_verifiable')
              required=math.ceil(len(text)*max(1.0,float(cost_factor)))
              remaining=limit-used
              report.update(narration_characters=len(text), required_credits_conservative=required,
                            quota_checked=True, paid_overage_disabled=True, remaining_included_credits=remaining)
              if remaining < required:
                  stop('blocked_insufficient_included_credits', required_credits=required, remaining_included_credits=max(0,remaining))
              maximum=selected.get('maximum_text_length_per_request')
              tier_limit=selected.get('max_characters_request_free_user' if subscription.get('tier')=='free' else 'max_characters_request_subscribed_user')
              limits=[x for x in [maximum,tier_limit] if isinstance(x,int) and x>0]
              if limits and len(text)>min(limits):
                  stop('blocked_text_exceeds_model_limit', model_character_limit=min(limits))
              payload={'text':text,'model_id':model_id,'language_code':'tr',
                       'voice_settings':{'stability':0.5,'speed':0.94}}
              (out/'narration.txt').write_text(text,encoding='utf-8')
              report['narration_sha256']=hashlib.sha256(text.encode('utf-8')).hexdigest()
              report['tts_called']=True
              save_report('tts_request_started')
              result,request_id=call('/v1/text-to-speech/'+voice+'/with-timestamps?output_format=mp3_44100_128',payload)
              try:
                  audio=base64.b64decode(result['audio_base64'],validate=True)
                  if len(audio)<10000:
                      stop('invalid_audio_size')
                  (out/'speech.mp3').write_bytes(audio)
                  report.update(audio_generated=True, bytes=len(audio), sha256=hashlib.sha256(audio).hexdigest())
                  (out/'alignment.json').write_text(json.dumps({'alignment':result.get('alignment'),'normalized_alignment':result.get('normalized_alignment')},ensure_ascii=False,indent=2),encoding='utf-8')
                  alignment=result.get('normalized_alignment') or result.get('alignment')
                  if not alignment:
                      stop('audio_saved_but_alignment_missing', action='Reuse saved audio; do not regenerate for drawing.')
                  chars=alignment['characters']
                  starts=alignment['character_start_times_seconds']
                  ends=alignment['character_end_times_seconds']
                  assert len(chars)==len(starts)==len(ends)>0
                  assert all(isinstance(c,str) and len(c)==1 for c in chars)
                  assert all(math.isfinite(float(s)) and math.isfinite(float(e)) and 0<=float(s)<=float(e) for s,e in zip(starts,ends))
                  assert all(float(starts[i])<=float(starts[i+1]) for i in range(len(starts)-1))
                  joined=''.join(chars)
                  def segments(pattern):
                      return [{'text':m.group().strip(),'start':starts[m.start()],'end':ends[m.end()-1]} for m in re.finditer(pattern,joined) if m.group().strip()]
                  words=segments(r'\S+')
                  phrases=segments(r'[^.!?\n]+[.!?]?')
                  speech={'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                          'duration_alignment':max(ends),'word_timestamps':words,'phrase_timestamps':phrases,
                          'text':text,'request_id':request_id,'timing_source':'provider_character_alignment'}
                  (out/'speech.json').write_text(json.dumps(speech,ensure_ascii=False,indent=2),encoding='utf-8')
                  save_report('audio_saved_pending_decode', word_count=len(words),phrase_count=len(phrases),
                              last_alignment_second=max(ends), character_alignment_validated=True)
              except Exception as error:
                  stop('audio_processing_error',error_type=type(error).__name__,action='Inspect saved files before any new TTS request.')
              import subprocess
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(out/'speech.mp3')]))
              duration=float(probe['format']['duration'])
              assert math.isfinite(duration) and duration>1
              assert any(s['codec_type']=='audio' for s in probe['streams'])
              assert report['last_alignment_second']<=duration+0.5
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(out/'speech.mp3'),'-f','null','-'],check=True,capture_output=True)
              save_report('audio_generated_and_decoded',duration_seconds=duration,audio_decode_pass=True,auditory_review=False)

          items=[{'id': 'A-Turkce-09', 'pair': ['A-Turkce-09', 'B-Turkce-05'], 'narration': 'Virgülleri verilen dört görevle eşleştirelim. A seçeneğinde bulut, yağmur ve kar sıralanıyor; bu, eş görevli sözcükleri ayırmadır. B seçeneğinde koşarak ve yüzerek gibi art arda gelen zarf fiiller ayrılıyor. D seçeneğinde tırnaksız aktarılan sözden sonra virgül var. E seçeneğinde bu sözcüğünden sonraki virgül, bu oda biçiminde yanlış bir birleşme yapılmasını önlüyor. C seçeneğindeki virgül ise özne olan Atık Yönetimi Piramidinden sonra gelmiştir; verilen dört açıklamadan birine örnek değildir. C seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-10', 'pair': ['A-Turkce-10', 'B-Turkce-04'], 'narration': 'Tamlamaların içindeki sözcük ilişkisine bakalım. Kanatlı kapı sözünde kanatlı, kapının nasıl olduğunu bildirir. Bir adı nitelediği için sıfattır; bu grup sıfat tamlamasıdır. İnsanın yüzü, havuzun şırıltısı ve bunların arası sözlerinde ise tamlayanla tamlanan arasında isim tamlaması ilişkisi vardır. Işık hüzmesi de belirtisiz isim tamlamasıdır. Kapısı sözcüğünün sonunda ek bulunması, kanatlı sözcüğünü isim yapmaz. Diğerlerinden farklı olan birinci tamlamadır. A seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-11', 'pair': ['A-Turkce-11', 'B-Turkce-02'], 'narration': 'İlk cümlede kurum adı olan İstanbul Üniversitesi Hukuk Fakültesine gelen ayrılma eki kesmeyle ayrılmış. Türk Dil Kurumunun kuralına göre kurum ve kuruluş adlarına getirilen ekler kesme işaretiyle ayrılmaz. Bu yüzden Fakültesi sözcüğü ile den eki arasındaki kesme kaldırılmalı; Fakültesinden bitişik yazılmalıdır. Kadıköy gibi yer adlarına gelen durum ekinin kesmeyle ayrılması ise doğrudur. Sorudaki noktalama yanlışı birinci cümlededir. A seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-12', 'pair': ['A-Turkce-12', 'B-Turkce-03'], 'narration': 'Seçeneklerdeki ses olaylarını sözcüklerde arayalım. Kıştan sözcüğünde sert ş ünsüzünden sonra ek te ile başlar; ünsüz benzeşmesi vardır. Başlıyordu sözcüğünde başla fiilindeki a, şimdiki zaman ekiyle ıya daralır. Ardından sözünde art kökündeki te, deye dönüşmüştür; ünsüz değişmesidir. Yükseliyordu sözcüğünün yüksekten yüksel biçimine türeyişinde ke ünsüzü düşer. Bu örnekler arasında yeni bir ünlünün ortaya çıkması, yani ünlü türemesi yoktur. Örneği bulunmayan B seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-13', 'pair': ['A-Turkce-13', 'B-Turkce-01'], 'narration': 'Sözcüğün türünü belirlerken neyi nitelediğine bakarız. Sımsıcak konuşmak, sessiz durmak ve ırmak gibi süzülmek ifadelerinde altı çizili sözler eylemin nasıl gerçekleştiğini söylüyor; zarf görevindeler. Yayla kokulu sözü çiçekleri, mor sözcüğü menekşeleri niteliyor. Çiçek ve menekşe isim olduğu için bu iki niteleyici sıfat görevindedir. Böylece ilk üçü zarf, dördüncü ve beşinci sıfattır. Diğerlerinden ayrılan dördüncü ve beşinciyi veren E seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-14', 'pair': ['A-Turkce-14', 'B-Turkce-32'], 'narration': 'Dördüncü cümleyi ögelerine ayıralım. Yüklem fetheder. Kim fetheder sorusunun cevabı Fatih Sultan Mehmet, yani öznedir. Neyi fetheder sorusuna kenti cevabı gelir; bu, belirtili nesnedir. Cümlenin başındaki bin dört yüz altmışta ifadesi zamanı bildirir ve zarf tümlecidir. Dolayısıyla sıralama zarf tümleci, özne, belirtili nesne ve yüklem olmalıdır. D seçeneği belirtili nesneyi atlamış. Yanlış çözümlemeyi veren D seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-15', 'pair': ['A-Turkce-15', 'B-Turkce-31'], 'narration': 'Burada sorulan yazım yanlışıdır. Beşinci bölümde doğu Anadolu ifadesinin ilk sözcüğü küçük harfle başlamış. Oysa bu söz bir yön tarifi olarak değil, coğrafi bölge adı olarak kullanılıyor. Bölge adı Doğu Anadolu olduğu için Doğu sözcüğü büyük de harfiyle başlamalıdır. Bir yerin doğusunu tarif ederken küçük harf kullanılabilmesi, özel bölge adını küçük yazmamıza izin vermez. Doğru yazım Doğu Anadolu biçimindedir. Beşinci bölümü veren E seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-16', 'pair': ['A-Turkce-16', 'B-Turkce-30'], 'narration': 'İkinci sözcüğü cümle içindeki göreviyle inceleyelim: işleri kabul ediyorum. Neyi kabul ediyorum sorusuna işleri cevabı geldiğinden, sondaki i belirtme durum ekidir. Sözcük iş kökü, ler çoğul eki ve i belirtme eki olarak ayrılır. Burada sahiplik bildiren bir iyelik eki yoktur. Bu nedenle çoğul ve iyelik eki aldığını söyleyen B açıklaması yanlıştır. Üretebiliyorum yeterlik bildiren kurallı birleşik fiildir; söylemeliyim ise gereklilik bildirir. Yanlış açıklamayı veren B seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-17', 'pair': ['A-Turkce-17', 'B-Turkce-29'], 'narration': 'Boşluktan hemen sonraki aksine sözcüğü bir karşıtlık kuruyor. Devamında yorulsa bile zevk almak ve yazmayı çile saymamak anlatılmış. Buna uygun başlangıç, sevilen bir işin kişiye zahmet ve çile gibi gelmeyeceğini söylemelidir. D seçeneği tam bu düşünceyi kuruyor; ardından gelen aksine yorulsanız da zevk alırsınız cümlesi onu açıklıyor. Plan yapma, başarı beklentisi ya da yalnız yazının işlevi, bu karşıtlığı aynı şekilde tamamlamaz. D seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-18', 'pair': ['A-Turkce-18', 'B-Turkce-24'], 'narration': 'Parçada iki örnek aynı ilişkiyi gösteriyor. Kültürel bunalımın yaşandığı dönemde yabancılaşma konusu, ekonomik sıkıntıların yaşandığı dönemde ekonomik sorunlar edebiyatta öne çıkabiliyor. Demek ki eserlerin konuları ile yazıldıkları dönemin toplumsal koşulları arasında bağ var. Buradan her eserin mutlaka yazarının kişisel hayatını anlattığı veya toplumsal olayların mutlaka yazıya geçirilmesi gerektiği sonucu çıkmaz. Dönemin sosyal özellikleriyle edebiyat eserleri arasındaki bağı belirten B seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-19', 'pair': ['A-Turkce-19', 'B-Turkce-23'], 'narration': 'Yazar kendi yöntemini üç unsurla anlatıyor. Çevresinde gözlemlediği yaşam öyküleri var, eski kent hakkında yaptığı araştırmalar var ve bunları birleştirdiği yeni bir kurgu var. Tarihi gerçeklere yakın olduğunu söylese de romanın tarih kitabı gibi okunmaması gerektiğini özellikle belirtiyor. Dolayısıyla olayları olduğu gibi belgelemekten veya eski yazarları taklit etmekten söz etmiyor. Gözlemlerini eski bir döneme yeni bir kurgu içinde uyarlıyor. Bu yöntemi veren A seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-20', 'pair': ['A-Turkce-20', 'B-Turkce-21'], 'narration': 'Paragrafı ayırırken yalnız sözcük değişimine değil, konunun yön değiştirdiği yere bakıyoruz. İlk dört cümlede tarihin kültür ve edebiyata genel olarak kaynak oluşturması anlatılıyor. Beşinci cümlede romantizm akımıyla birlikte yeni bir alt konu başlıyor. Altıncı cümlede romantizmin neden tarihe yönelttiği, yedincide bunun tarihî romana etkisi açıklanıyor. Bu üç cümle kendi içinde bir bütün oluşturur. İkinci paragraf beşinci cümleyle başlamalıdır. E seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-21', 'pair': ['A-Turkce-21', 'B-Turkce-22'], 'narration': 'Parça bilim kurguyu, bilimin mümkün kıldığı olasılıkları kullanan bir düş gücü olarak tanımlıyor. Özellikle çağdaş gerçeklerden yola çıkıp bunları düşsel yöntemlerle yeniden yorumladığını söylüyor. Bu yüzden düşsel öğeler taşıması, yaşadığı çağın gerçeklerinden bütünüyle kopuk olduğu anlamına gelmez. D seçeneği hayal ile çağın gerçekleri arasındaki bu bağı birlikte ifade ediyor. Geleceğe yön verme veya toplumsal sorunlara çözüm üretme gibi başka işlevler bu parçada gösterilmemiş. D seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-22', 'pair': ['A-Turkce-22', 'B-Turkce-08'], 'narration': 'Metindeki tersane benzetmesi, insanın edebiyatla yeniden biçimlenmesini anlatıyor. Ardından daha sakin davranma, derin düşünme, hoşgörülü ve iyi olma gibi sonuçlar sıralanıyor. Bunların ortak noktası insanın iç dünyasının gelişmesi ve olgunlaşmasıdır. Metin yalnız gündelik sıkıntıdan kaçışı veya edebiyatın öğüt verme yöntemini anlatmıyor. Edebiyatın yaşamı biçimlendirdiğini ve insanı ruhen olgunlaştırdığını söyleyen B seçeneği, bütün örnekleri kapsıyor. B seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-23', 'pair': ['A-Turkce-23', 'B-Turkce-07'], 'narration': 'Saptamaları metinde tek tek arayalım. Toplumsal sorunlardan uzak durup bireysel konular yazmaları birinci saptamayı destekliyor. Önceki kuşakla yazınsal bağ kurmamaları ikinci saptamadır. Batıdan çevrilen modernist eserleri okumaları dördüncü saptamayı karşılıyor. Ancak kapalı ve yoğun bir öykü evreni kurdukları söylenmemiş. Metinde bulunmayan bu özelliği dışarıdan ekleyemeyiz. Yapılmayan yalnız üçüncü saptamadır. C seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-24', 'pair': ['A-Turkce-24', 'B-Turkce-06'], 'narration': 'Sorunun istediği, kitap okumanın yararları değil; ailelerin nasıl davranıp çocukları nasıl teşvik edeceğidir. B paragrafında doğrudan davranış önerileri var. Baskı kurmamak, okumayı sevdirecek etkinlikler yapmak ve ailece okuma saati düzenlemek öneriliyor. Çocuğa kitap seçiminde söz hakkı verilmesi ve anne babanın örnek olması da eklenmiş. A daha çok alışkanlığın önemini, C erken başlamayı, E okumanın kazandırdığı düşünme becerilerini anlatıyor. B paragrafı sorunun davranış ve teşvik boyutlarını birlikte karşılıyor. B seçeneğini işaretliyoruz.'}]
          for item in items:
              try:
                  produce(item)
              except ProductionStop:
                  raise SystemExit(2)
              except Exception as error:
                  print('BATCH_STOP '+json.dumps({'id':item['id'],'error_type':type(error).__name__,'action':'Inspect saved artifacts before any new TTS request.'}))
                  raise SystemExit(3)

      - name: Preserve all generated audio and timestamps even after partial failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atolye-r12-batch07-${{ github.run_id }}
          path: atolye-r12-batch07/
          if-no-files-found: warn
          retention-days: 30
