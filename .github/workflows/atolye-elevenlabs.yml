name: Atolye ElevenLabs R12 Batch08
run-name: Atolye R12 Batch08 - 16 unique questions - included credit
on:
  push:
    branches: [atolye-elevenlabs-20260921]
    paths: [.github/workflows/atolye-elevenlabs.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: atolye-elevenlabs-production
  cancel-in-progress: false
jobs:
  speech:
    if: github.ref == 'refs/heads/atolye-elevenlabs-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ensure audio verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Verify quota and produce 16 real narrations with provider timestamps
        shell: python
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          import json, pathlib
          class ProductionStop(Exception): pass
          def produce(item):
              import os, sys, json, pathlib, urllib.request, urllib.error, base64, hashlib, re, math
              out = pathlib.Path('atolye-r12-batch08')/item['id']
              out.mkdir(parents=True,exist_ok=True)
              voice = 'tZYpRZkmCNQcfmtDbhUg'
              model_id = 'eleven_v3'
              report = {'pair':item['pair'],
                        'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                        'commit':os.environ.get('GITHUB_SHA'), 'run_id':os.environ.get('GITHUB_RUN_ID'),
                        'credential_present':False,'api_called':False,'tts_called':False,
                        'audio_generated':False,'fallback_used':False,'video_completed':False,
                        'auditory_review':False}
              def save_report(status, **extra):
                  report.update(status=status, **extra)
                  (out/'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('ATOLYE_RESULT '+json.dumps(report,ensure_ascii=False))
              def stop(status, **extra):
                  save_report(status, **extra)
                  raise ProductionStop(status)
              key = os.environ.get('ELEVENLABS_API_KEY','').strip()
              if not key:
                  stop('blocked_missing_credential', required_secret='ELEVENLABS_API_KEY')
              report['credential_present'] = True
              # A rerun must never unknowingly spend credits twice. Use a fresh dispatch only after inspecting artifacts.
              if int(os.environ.get('GITHUB_RUN_ATTEMPT','1')) > 1:
                  stop('blocked_automatic_audio_regeneration', action='Inspect and reuse existing audio artifacts; fresh dispatch only if no audio was generated.')
              text=item['narration']
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              def call(path, payload=None):
                  report['api_called'] = True
                  req = urllib.request.Request('https://api.elevenlabs.io'+path,
                      headers={'xi-api-key':key,'Content-Type':'application/json'},
                      data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                      method='GET' if payload is None else 'POST')
                  try:
                      with opener.open(req, timeout=180) as response:
                          return json.loads(response.read(24000000)), response.headers.get('request-id')
                  except urllib.error.HTTPError as error:
                      try:
                          detail=json.loads(error.read(4000)).get('detail',{})
                          provider_code=detail.get('status') if isinstance(detail,dict) else None
                          if not isinstance(provider_code,str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,100}',provider_code) or key in provider_code:
                              provider_code=None
                      except Exception:
                          provider_code=None
                      stop('provider_error', http_status=error.code, provider_code=provider_code,
                           operation='tts' if payload is not None else path)
                  except Exception as error:
                      stop('transport_or_response_error', error_type=type(error).__name__,
                           tts_outcome_uncertain=payload is not None)
              voice_info,_=call('/v1/voices/'+voice)
              if voice_info.get('voice_id') != voice:
                  stop('blocked_voice_mismatch')
              report['voice_accessible'] = True
              models,_=call('/v1/models')
              selected=next((m for m in models if m.get('model_id')==model_id),None)
              if not selected or not selected.get('can_do_text_to_speech'):
                  stop('blocked_model_unavailable')
              report['model_accessible'] = True
              subscription,_=call('/v1/user/subscription')
              used=subscription.get('character_count')
              limit=subscription.get('character_limit')
              if type(used) is not int or type(limit) is not int or used<0 or limit<0:
                  stop('blocked_quota_not_verifiable')
              # No billing settings are changed. Stop unless paid overage is known to be disabled.
              extension=subscription.get('max_credit_limit_extension')
              overage_disabled=(type(extension) is int and extension==0) or subscription.get('can_extend_character_limit') is False
              if not overage_disabled:
                  stop('blocked_paid_overage_not_disabled', action='No audio request made; billing settings were not changed.')
              rates=selected.get('model_rates') or {}
              cost_factor=rates.get('character_cost_multiplier',selected.get('token_cost_factor'))
              if not isinstance(cost_factor,(int,float)) or isinstance(cost_factor,bool) or not math.isfinite(cost_factor) or cost_factor<=0:
                  stop('blocked_model_cost_not_verifiable')
              required=math.ceil(len(text)*max(1.0,float(cost_factor)))
              remaining=limit-used
              report.update(narration_characters=len(text), required_credits_conservative=required,
                            quota_checked=True, paid_overage_disabled=True, remaining_included_credits=remaining)
              if remaining < required:
                  stop('blocked_insufficient_included_credits', required_credits=required, remaining_included_credits=max(0,remaining))
              maximum=selected.get('maximum_text_length_per_request')
              tier_limit=selected.get('max_characters_request_free_user' if subscription.get('tier')=='free' else 'max_characters_request_subscribed_user')
              limits=[x for x in [maximum,tier_limit] if isinstance(x,int) and x>0]
              if limits and len(text)>min(limits):
                  stop('blocked_text_exceeds_model_limit', model_character_limit=min(limits))
              payload={'text':text,'model_id':model_id,'language_code':'tr',
                       'voice_settings':{'stability':0.5,'speed':0.94}}
              (out/'narration.txt').write_text(text,encoding='utf-8')
              report['narration_sha256']=hashlib.sha256(text.encode('utf-8')).hexdigest()
              report['tts_called']=True
              save_report('tts_request_started')
              result,request_id=call('/v1/text-to-speech/'+voice+'/with-timestamps?output_format=mp3_44100_128',payload)
              try:
                  audio=base64.b64decode(result['audio_base64'],validate=True)
                  if len(audio)<10000:
                      stop('invalid_audio_size')
                  (out/'speech.mp3').write_bytes(audio)
                  report.update(audio_generated=True, bytes=len(audio), sha256=hashlib.sha256(audio).hexdigest())
                  (out/'alignment.json').write_text(json.dumps({'alignment':result.get('alignment'),'normalized_alignment':result.get('normalized_alignment')},ensure_ascii=False,indent=2),encoding='utf-8')
                  alignment=result.get('normalized_alignment') or result.get('alignment')
                  if not alignment:
                      stop('audio_saved_but_alignment_missing', action='Reuse saved audio; do not regenerate for drawing.')
                  chars=alignment['characters']
                  starts=alignment['character_start_times_seconds']
                  ends=alignment['character_end_times_seconds']
                  assert len(chars)==len(starts)==len(ends)>0
                  assert all(isinstance(c,str) and len(c)==1 for c in chars)
                  assert all(math.isfinite(float(s)) and math.isfinite(float(e)) and 0<=float(s)<=float(e) for s,e in zip(starts,ends))
                  assert all(float(starts[i])<=float(starts[i+1]) for i in range(len(starts)-1))
                  joined=''.join(chars)
                  def segments(pattern):
                      return [{'text':m.group().strip(),'start':starts[m.start()],'end':ends[m.end()-1]} for m in re.finditer(pattern,joined) if m.group().strip()]
                  words=segments(r'\S+')
                  phrases=segments(r'[^.!?\n]+[.!?]?')
                  speech={'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                          'duration_alignment':max(ends),'word_timestamps':words,'phrase_timestamps':phrases,
                          'text':text,'request_id':request_id,'timing_source':'provider_character_alignment'}
                  (out/'speech.json').write_text(json.dumps(speech,ensure_ascii=False,indent=2),encoding='utf-8')
                  save_report('audio_saved_pending_decode', word_count=len(words),phrase_count=len(phrases),
                              last_alignment_second=max(ends), character_alignment_validated=True)
              except Exception as error:
                  stop('audio_processing_error',error_type=type(error).__name__,action='Inspect saved files before any new TTS request.')
              import subprocess
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(out/'speech.mp3')]))
              duration=float(probe['format']['duration'])
              assert math.isfinite(duration) and duration>1
              assert any(s['codec_type']=='audio' for s in probe['streams'])
              assert report['last_alignment_second']<=duration+0.5
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(out/'speech.mp3'),'-f','null','-'],check=True,capture_output=True)
              save_report('audio_generated_and_decoded',duration_seconds=duration,audio_decode_pass=True,auditory_review=False)

          items=[{'id': 'A-Turkce-25', 'pair': ['A-Turkce-25', 'B-Turkce-40'], 'narration': 'Bu soruda esere ilişkin dışarıdan bildiklerimizi değil, parçada söylenenleri arıyoruz. Mitolojilerden yararlanılması A seçeneğini, fantastik bir roman olması B seçeneğini karşılıyor. Başka dillere çevrilmesi ulusal sınırları aştığını; modern fantastik yazını etkilemesi de kendi türüne etkisini gösteriyor. Ancak sinematografik yönü bulunması, sinemaya aktarıldığı ve bu yolla daha çok kişiye ulaştığı demek değildir. Parçada bu son bilgi verilmemiş. Değinilmeyen D seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-26', 'pair': ['A-Turkce-26', 'B-Turkce-39'], 'narration': 'Boşluğun iki yanını birlikte okuyalım. Önce nitelikli eserlerden söz edilmiş; fakat bağlacıyla karşıt bir gruba geçilecek. Boşluktan sonraki bunlar sözcüğü, okuru yalnız güncellik ve ilginçlikle oyalayan kitaplara gönderme yapıyor. Öyleyse boşlukta özensiz yazılmış eserler tanıtılmalı. C seçeneğini yerleştirince nitelikli eserlerden özensiz eserlere geçiş ve bunlar sözcüğünün göndergesi birlikte tamamlanır. Nitelikli eserlerden söz etmeyi sürdüren seçenekler bu bağı kurmaz. C seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-27', 'pair': ['A-Turkce-27', 'B-Turkce-38'], 'narration': 'Yaşanan olayın sonucuna odaklanalım. Yazar dostlarıyla buluşunca yeni imgeler ve yazma isteği kazanıyor. Fakat o anda yazmıyor; düşüncelerini ertesi güne bırakıyor. Ertesi sabah aynı ilhamı yeniden yakalayamıyor. Bu olay, esin geldiğinde onu değerlendirmenin önemini gösterir. Parça başyapıt için gereken genel emek kurallarını veya bütün yazarların yalnız kendi hayatını anlattığını kanıtlamıyor. İlhamın geldiği anı değerlendirmeyi öneren C seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-28', 'pair': ['A-Turkce-28', 'B-Turkce-37'], 'narration': 'Paragraftaki ana akış, atmosferin doğal sera işlevinin açıklanmasıdır. İlk üç cümlede bu işlev tanıtılıyor; beşinci ve altıncı cümleler yaşam sıcaklığına katkısını anlatıyor. Dördüncü cümle ise fosil yakıtların yakılmasıyla karbondioksitin artmasına geçiyor. Bu, doğal işlevden farklı bir nedene yönelmiş açıklamadır. Dördüncüyü çıkarınca üçüncü cümledeki sera gazlarının işlevi, beşinci cümlede böylece sözüyle doğrudan sürer. Akışı bozan dördüncü cümledir. D seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-29', 'pair': ['A-Turkce-29', 'B-Turkce-12'], 'narration': 'Bu durum sözünün neyi gösterdiğini bulmak için hemen önceki cümleye dönelim. Dolandırıcılar paranın kenarlarını yontup değerli metal biriktiriyor. Bu durum sözü tam olarak bu yontma eylemini karşılıyor. Paranın üretiminde bir hata anlatılmamış. Tüccarların tedbir alması ise yontmanın yol açtığı sonuçtur; bu durum sözünün göndergesi değildir. Dolayısıyla yalnız ikinci ifade doğrudur. B seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-30', 'pair': ['A-Turkce-30', 'B-Turkce-11'], 'narration': 'Sıralamayı gönderme sözleriyle kuralım. İkinci cümle normal hava basıncını tanıtır. Beşinci cümle bu basınç düzeyi diyerek ona bağlanır. Birinci cümle basıncın yavaş düşmesini anlatır. Ardından dördüncü cümlede ancak sözüyle ani düşüşe geçilir. Üçüncü cümlenin devamında sözü de bu ani değişimin etkilerini sürdürür. Böylece sıra iki, beş, bir, dört, üç olur. Baştan üçüncü sıraya gelen, bir numaralı cümledir. A seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-31', 'pair': ['A-Turkce-31', 'B-Turkce-10'], 'narration': 'Sorudaki karmaşık ve yabancı sözcüklerle dolu anlatışın karşıtını arıyoruz. Beşinci cümlede sanatçının günlük yaşamdan uzak, donuk bir anlatıma yer vermediği söyleniyor. Altıncı cümlede ise pazardaki insanın bile anlayabileceği dili benimsediği belirtiliyor. İki cümle birlikte açıklığı ve anlaşılabilirliği savunuyor. Bilgi birikimi veya özgün anlatım tek başına bu karşıtlığı göstermez. Doğrudan sade ve anlaşılır dili anlatan beşinci ve altıncı cümlelerdir. E seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-32', 'pair': ['A-Turkce-32', 'B-Turkce-09'], 'narration': 'Seçenekleri parçada verilen bilgilere bağlayalım. Anı, belge ve tanıklıklardan yararlanması kapsamlı çalışmayı ve gerçek olaylara dayanmayı gösteriyor. Hareketli, değişken anlatımı özgünlüğünü; önceki kaliteyi koruması da yetkinliğini destekliyor. Ancak anlatılan kişinin daha önce bilinmeyen yönlerini ortaya çıkardığı söylenmiyor. Çok belge kullanmak, mutlaka yeni bir sırrı açığa çıkarmak anlamına gelmez. Metnin desteklemediği B seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-33', 'pair': ['A-Turkce-33', 'B-Turkce-20'], 'narration': 'Boşluğa gelecek düşünce, ardından verilen bütün örnekleri kapsamalı. Metin Milton ve Beethoven için bedensel engelleri, romancılar için acılı yaşamları, besteci için yaşadığı aşk acısını öne çıkarıyor. Yazarın bu örneklerle kurduğu ortak bağ, yaşamdaki güçlüklerin sanat için esin kaynağına dönüşmesidir. Yalnız maddi sıkıntıdan söz eden seçenek bu örneklerin tümünü karşılamaz. Metnin düşüncesini güçlükler ve acılar üzerinden birleştiren E seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-34', 'pair': ['A-Turkce-34', 'B-Turkce-19'], 'narration': 'Söylenemeyen ifadeleri arıyoruz. Yazar mevcut koşullarda geleneğin yok oluşunu önleyemediğimizi, ancak geciktirebileceğimizi söylüyor; birinci ifade desteklenir. Televizyonu yeterli görmediğinden, medyayla canlanacağı sonucu çıkmaz. Festival ve düğünlerin geleneği canlı tutmaya yetmediğini de açıkça belirtir. Bu yüzden ikinci ve üçüncü çıkarımlar desteklenmez. Şiirlerin düzenli kaydedilip kaydedilmediği konusunda ise bilgi yoktur; dördüncü de söylenemez. İkinci, üçüncü ve dördüncüyü veren E seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-35', 'pair': ['A-Turkce-35', 'B-Turkce-17'], 'narration': 'Ortak paragrafta boşluğun öncesiyle sonrasını bağlayalım. Öncesinde yazarın toplumun bir bireyi olduğu söyleniyor. Sonrasında sosyal amaç gütmese bile toplumunu eserine yansıttığı anlatılıyor. Bu iki düşüncenin arasına, yazarın toplumuna bütünüyle duyarsız kalamayacağı sonucu gelir. D seçeneğindeki bu yüzden sözü önceki gerekçeye bağlanır; sonraki örnek de bu sonucu açıklar. Kalıcılık ya da toplumun bütün beklentilerini karşılama hakkında bir zorunluluk çıkaramayız. D seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-36', 'pair': ['A-Turkce-36', 'B-Turkce-18'], 'narration': 'Altı çizili reçete sözünü paragrafın bağlamında düşünelim. Önce yazarın toplumun aksayan yönlerini dile getirmesi, yani sorunları göstermesi anlatılıyor. Eseri reçete hâline getirmek ise bunun bir adım ötesidir: gösterilen sorunlara çözüm önerileri sunmak. Buradaki reçete bir yemek tarifi ya da ilacın kendisi değildir; çözüm yolu sunmayı anlatan bir mecazdır. Yalnız toplumsal değerleri anlatmak aynı anlamı karşılamaz. Çeşitli sorunlara çözüm önerileri sunmayı belirten E seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-37', 'pair': ['A-Turkce-37', 'B-Turkce-35'], 'narration': 'Ortak paragraftaki dayanaklara bakalım. Dünya çapında saygınlık, evrensel tanınmayı destekler. Söylem çözümlemeleri, görünürdeki sözlerin arkasını açığa çıkarmayı; gülme ve öfkelenme de birbirine zıt duyguları gösterir. Eleştiri ve deneme yazıları düşünsel eserlerdir. Ancak geniş bir okur kitlesinin bu yazarı beğendiği söylenmemiş. Saygınlık ve ödül kazanmak, geniş okur kitlesinin beğenisini tek başına kanıtlamaz. Parçadan çıkarılamayan D seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-38', 'pair': ['A-Turkce-38', 'B-Turkce-36'], 'narration': 'Altı çizili sözcükleri bağlamlarıyla inceleyelim. Zenginleştirmek, düşünce dünyasını geliştirmek anlamında mecazdır. Çapında sözü dünya ölçeğini anlatır; geometrik çap kastedilmez. Doğurmuştur bir dili ortaya çıkarmak, çıkarmamız ise söylemden anlam veya sonuç elde etmek anlamındadır. Bunlar da somut ilk anlamlarıyla kullanılmamış. Üçüncü sözcük önemli ise doğrudan değerli, dikkate değer anlamındadır; mecazlı bir aktarım yapılmamış. Bu nedenle üçüncü sözcüğü veren C seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-39', 'pair': ['A-Turkce-39', 'B-Turkce-33'], 'narration': 'Söz öbeğinin iki parçasını birlikte yorumlayalım. Bu topraklar, içinde yaşanan kültürü ve yerli değerleri çağrıştırıyor. İçli nağmeler ise içten, duygu yüklü şiirsel söyleyişi anlatıyor. İkisini birleştirdiğimizde kendi kültürümüzü yansıtan duygulu şiirler anlamı ortaya çıkar. Yalnız heyecanlı söyleyiş demek kültürel yönü eksik bırakır. Söz, eserlerin bütün dünyada tanınmasını da söylemiyor. İki anlamı birlikte veren A seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-40', 'pair': ['A-Turkce-40', 'B-Turkce-34'], 'narration': 'Ortak paragrafı seçeneklerle karşılaştıralım. İlmek ilmek işlenen şiirler titizliği; öğretmen, şair ve oyun yazarı olması farklı çalışmalarını gösterir. Halk şiirini yeni bir söyleyişle işlemesi özgünlüğünü, eski şairleri gençlere tanıtması da edebiyata katkısını açıklar. Son cümlede memleketçi edebiyatın önemli temsilcilerinden biri olduğu yazıyor. Önemli temsilci olmak, ilk temsilci olmak demek değildir. Metinde ilk olduğu bilgisi bulunmadığından C seçeneğine ulaşılamaz. C seçeneğini işaretliyoruz.'}]
          for item in items:
              try:
                  produce(item)
              except ProductionStop:
                  raise SystemExit(2)
              except Exception as error:
                  print('BATCH_STOP '+json.dumps({'id':item['id'],'error_type':type(error).__name__,'action':'Inspect saved artifacts before any new TTS request.'}))
                  raise SystemExit(3)

      - name: Preserve all generated audio and timestamps even after partial failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atolye-r12-batch08-${{ github.run_id }}
          path: atolye-r12-batch08/
          if-no-files-found: warn
          retention-days: 30
