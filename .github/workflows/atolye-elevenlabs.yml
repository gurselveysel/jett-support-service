name: Atolye ElevenLabs R12 Batch06
run-name: Atolye R12 Batch06 - 18 unique questions - included credit
on:
  push:
    branches: [atolye-elevenlabs-20260921]
    paths: [.github/workflows/atolye-elevenlabs.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: atolye-elevenlabs-production
  cancel-in-progress: false
jobs:
  speech:
    if: github.ref == 'refs/heads/atolye-elevenlabs-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ensure audio verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Verify quota and produce 18 real narrations with provider timestamps
        shell: python
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          import json, pathlib
          class ProductionStop(Exception): pass
          def produce(item):
              import os, sys, json, pathlib, urllib.request, urllib.error, base64, hashlib, re, math
              out = pathlib.Path('atolye-r12-batch06')/item['id']
              out.mkdir(parents=True,exist_ok=True)
              voice = 'tZYpRZkmCNQcfmtDbhUg'
              model_id = 'eleven_v3'
              report = {'pair':item['pair'],
                        'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                        'commit':os.environ.get('GITHUB_SHA'), 'run_id':os.environ.get('GITHUB_RUN_ID'),
                        'credential_present':False,'api_called':False,'tts_called':False,
                        'audio_generated':False,'fallback_used':False,'video_completed':False,
                        'auditory_review':False}
              def save_report(status, **extra):
                  report.update(status=status, **extra)
                  (out/'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('ATOLYE_RESULT '+json.dumps(report,ensure_ascii=False))
              def stop(status, **extra):
                  save_report(status, **extra)
                  raise ProductionStop(status)
              key = os.environ.get('ELEVENLABS_API_KEY','').strip()
              if not key:
                  stop('blocked_missing_credential', required_secret='ELEVENLABS_API_KEY')
              report['credential_present'] = True
              # A rerun must never unknowingly spend credits twice. Use a fresh dispatch only after inspecting artifacts.
              if int(os.environ.get('GITHUB_RUN_ATTEMPT','1')) > 1:
                  stop('blocked_automatic_audio_regeneration', action='Inspect and reuse existing audio artifacts; fresh dispatch only if no audio was generated.')
              text=item['narration']
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              def call(path, payload=None):
                  report['api_called'] = True
                  req = urllib.request.Request('https://api.elevenlabs.io'+path,
                      headers={'xi-api-key':key,'Content-Type':'application/json'},
                      data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                      method='GET' if payload is None else 'POST')
                  try:
                      with opener.open(req, timeout=180) as response:
                          return json.loads(response.read(24000000)), response.headers.get('request-id')
                  except urllib.error.HTTPError as error:
                      try:
                          detail=json.loads(error.read(4000)).get('detail',{})
                          provider_code=detail.get('status') if isinstance(detail,dict) else None
                          if not isinstance(provider_code,str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,100}',provider_code) or key in provider_code:
                              provider_code=None
                      except Exception:
                          provider_code=None
                      stop('provider_error', http_status=error.code, provider_code=provider_code,
                           operation='tts' if payload is not None else path)
                  except Exception as error:
                      stop('transport_or_response_error', error_type=type(error).__name__,
                           tts_outcome_uncertain=payload is not None)
              voice_info,_=call('/v1/voices/'+voice)
              if voice_info.get('voice_id') != voice:
                  stop('blocked_voice_mismatch')
              report['voice_accessible'] = True
              models,_=call('/v1/models')
              selected=next((m for m in models if m.get('model_id')==model_id),None)
              if not selected or not selected.get('can_do_text_to_speech'):
                  stop('blocked_model_unavailable')
              report['model_accessible'] = True
              subscription,_=call('/v1/user/subscription')
              used=subscription.get('character_count')
              limit=subscription.get('character_limit')
              if type(used) is not int or type(limit) is not int or used<0 or limit<0:
                  stop('blocked_quota_not_verifiable')
              # No billing settings are changed. Stop unless paid overage is known to be disabled.
              extension=subscription.get('max_credit_limit_extension')
              overage_disabled=(type(extension) is int and extension==0) or subscription.get('can_extend_character_limit') is False
              if not overage_disabled:
                  stop('blocked_paid_overage_not_disabled', action='No audio request made; billing settings were not changed.')
              rates=selected.get('model_rates') or {}
              cost_factor=rates.get('character_cost_multiplier',selected.get('token_cost_factor'))
              if not isinstance(cost_factor,(int,float)) or isinstance(cost_factor,bool) or not math.isfinite(cost_factor) or cost_factor<=0:
                  stop('blocked_model_cost_not_verifiable')
              required=math.ceil(len(text)*max(1.0,float(cost_factor)))
              remaining=limit-used
              report.update(narration_characters=len(text), required_credits_conservative=required,
                            quota_checked=True, paid_overage_disabled=True, remaining_included_credits=remaining)
              if remaining < required:
                  stop('blocked_insufficient_included_credits', required_credits=required, remaining_included_credits=max(0,remaining))
              maximum=selected.get('maximum_text_length_per_request')
              tier_limit=selected.get('max_characters_request_free_user' if subscription.get('tier')=='free' else 'max_characters_request_subscribed_user')
              limits=[x for x in [maximum,tier_limit] if isinstance(x,int) and x>0]
              if limits and len(text)>min(limits):
                  stop('blocked_text_exceeds_model_limit', model_character_limit=min(limits))
              payload={'text':text,'model_id':model_id,'language_code':'tr',
                       'voice_settings':{'stability':0.5,'speed':0.94}}
              (out/'narration.txt').write_text(text,encoding='utf-8')
              report['narration_sha256']=hashlib.sha256(text.encode('utf-8')).hexdigest()
              report['tts_called']=True
              save_report('tts_request_started')
              result,request_id=call('/v1/text-to-speech/'+voice+'/with-timestamps?output_format=mp3_44100_128',payload)
              try:
                  audio=base64.b64decode(result['audio_base64'],validate=True)
                  if len(audio)<10000:
                      stop('invalid_audio_size')
                  (out/'speech.mp3').write_bytes(audio)
                  report.update(audio_generated=True, bytes=len(audio), sha256=hashlib.sha256(audio).hexdigest())
                  (out/'alignment.json').write_text(json.dumps({'alignment':result.get('alignment'),'normalized_alignment':result.get('normalized_alignment')},ensure_ascii=False,indent=2),encoding='utf-8')
                  alignment=result.get('normalized_alignment') or result.get('alignment')
                  if not alignment:
                      stop('audio_saved_but_alignment_missing', action='Reuse saved audio; do not regenerate for drawing.')
                  chars=alignment['characters']
                  starts=alignment['character_start_times_seconds']
                  ends=alignment['character_end_times_seconds']
                  assert len(chars)==len(starts)==len(ends)>0
                  assert all(isinstance(c,str) and len(c)==1 for c in chars)
                  assert all(math.isfinite(float(s)) and math.isfinite(float(e)) and 0<=float(s)<=float(e) for s,e in zip(starts,ends))
                  assert all(float(starts[i])<=float(starts[i+1]) for i in range(len(starts)-1))
                  joined=''.join(chars)
                  def segments(pattern):
                      return [{'text':m.group().strip(),'start':starts[m.start()],'end':ends[m.end()-1]} for m in re.finditer(pattern,joined) if m.group().strip()]
                  words=segments(r'\S+')
                  phrases=segments(r'[^.!?\n]+[.!?]?')
                  speech={'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                          'duration_alignment':max(ends),'word_timestamps':words,'phrase_timestamps':phrases,
                          'text':text,'request_id':request_id,'timing_source':'provider_character_alignment'}
                  (out/'speech.json').write_text(json.dumps(speech,ensure_ascii=False,indent=2),encoding='utf-8')
                  save_report('audio_saved_pending_decode', word_count=len(words),phrase_count=len(phrases),
                              last_alignment_second=max(ends), character_alignment_validated=True)
              except Exception as error:
                  stop('audio_processing_error',error_type=type(error).__name__,action='Inspect saved files before any new TTS request.')
              import subprocess
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(out/'speech.mp3')]))
              duration=float(probe['format']['duration'])
              assert math.isfinite(duration) and duration>1
              assert any(s['codec_type']=='audio' for s in probe['streams'])
              assert report['last_alignment_second']<=duration+0.5
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(out/'speech.mp3'),'-f','null','-'],check=True,capture_output=True)
              save_report('audio_generated_and_decoded',duration_seconds=duration,audio_decode_pass=True,auditory_review=False)

          items=[{'id': 'A-Temel_Matematik-23', 'pair': ['A-Temel_Matematik-23', 'B-Temel_Matematik-01'], 'narration': 'Yüksekliği altı yaparak o anki zamanı bulalım. Te eksi dördün karesinin eksi yarısı artı sekiz, altıya eşit. Buradan te eksi dördün karesi dört olur; te iki veya altıdır. Şekilde roket yükselirken gösterildiği için başlangıç aldığımız an ikinci saniyedir. Yere dönüşte yükseklik sıfır olur. Aynı bağıntıdan te eksi dördün karesi on altı çıkar; uçuşun sonu sekizinci saniyedir. Sekiz eksi iki, altı saniye sonra yere düşer. Tepe noktası dördüncü saniyede sekiz metredir. Bir ve üç saniye sonrası, üçüncü ve beşinci saniyelerdir. Tepe zamanına eşit uzak olduklarından iki yükseklik de yedi buçuk metredir. Üç yargı da doğru; E seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-24', 'pair': ['A-Temel_Matematik-24', 'B-Temel_Matematik-26'], 'narration': 'Eş karelerin kenarını bir birim kabul edelim. Pembe doğrunun iki ucu arasında yatayda dört, düşeyde üç birim fark var. Böylece kenarları üç ve dört olan bir dik üçgen kurarız. Pisagordan hipotenüsün karesi dokuz artı on altı, yirmi beş olur; hipotenüs beştir. Alfa açısı düşey kenarla yapılmıştır. Bu nedenle alfaya komşu dik kenar üçtür; dört değildir. Kosinüs, komşu dik kenarın hipotenüse oranıdır. Kosinüs alfa üç bölü beş çıkar. C seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-25', 'pair': ['A-Temel_Matematik-25', 'B-Temel_Matematik-40'], 'narration': 'Toplam yolu bulmak için önce okul ile kütüphane arasındaki bilinmeyen uzaklığı hesaplamalıyız. Evden çıkan iki kenar sekiz ve yedi kilometre, aralarındaki açı yüz yirmi derecedir. Kosinüs teoreminde karşı kenarın karesi, diğer iki kenarın kareleri toplamından iki kenar çarpımının iki katıyla açının kosinüsünün çarpımı çıkarılarak bulunur. Yüz yirminin kosinüsü eksi yarımdır. Uzaklığın karesi, altmış dört artı kırk dokuz artı elli altı, yüz altmış dokuz olur. Uzaklık on üç kilometredir. Ali evden okula sekiz, okuldan kütüphaneye on üç, eve dönüşte yedi kilometre yürür. Toplam sekiz artı on üç artı yedi, yirmi sekiz kilometredir. D seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-26', 'pair': ['A-Temel_Matematik-26', 'B-Temel_Matematik-39'], 'narration': 'Birim kareleri sayalım: dikdörtgenin yatay kenarı beş, düşey kenarı dört birim. Köşegenin karesi, beşin karesi artı dördün karesi, kırk birdir. Alfa düşeyle yapılan açı olduğundan, kotanjantı düşey kenarın yataya oranı, yani dört bölü beştir. Beta yatayla yapılan açıdır. Kosinüs beta beş bölü kök kırk bir olur. Bunun karesi yirmi beş bölü kırk bir; tersini alınca kırk bir bölü yirmi beş elde ederiz. İstenen toplam dört bölü beş ile kırk bir bölü yirmi beştir. Paydaları yirmi beşte eşitleyince pay yirmi artı kırk bir olur. Sonuç altmış bir bölü yirmi beş çıkar. A seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-27', 'pair': ['A-Temel_Matematik-27', 'B-Temel_Matematik-38'], 'narration': 'İkinci kesrin paydasında bir eksi sinüs iks var. Payı ve paydayı bir artı sinüs iks ile çarparak genişletelim. Paydada iki kare farkından bir eksi sinüs kare iks oluşur. Bu ifade kosinüs kare ikse eşittir. Paydaki kosinüs iksi sadeleştirince ikinci kesir, payı bir artı sinüs iks, paydası kosinüs iks olan kesre dönüşür. Bu, ilk kesrin aynısıdır. Eşit iki kesir birbirinden çıkarılınca sıfır kalır; sondaki bir ise değişmez. Verilen açık aralıkta paydalar sıfır olmadığı için işlemler geçerlidir. Sonuç bir; B seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-28', 'pair': ['A-Temel_Matematik-28', 'B-Temel_Matematik-37'], 'narration': 'Üç kat a ce uzunluğu, iki kat be ce uzunluğuna eşit. Bu nedenle a ce ile ce be oranı ikiye üçtür. Ce, a noktasından beye giden yolun beşte ikisindedir. İks koordinatı birden on bire gidiyor; fark on. Bunun beşte ikisi dört eder. Bire dört ekleyince cenin iks koordinatı beş olur. Ye koordinatı eksi üçten ikiye gidiyor; fark beş. Bunun beşte ikisi ikidir. Eksi üçe iki ekleyince eksi bir buluruz. Ce noktası beşe eksi birdir. Koordinat toplamı beş eksi bir, dört eder. A seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-29', 'pair': ['A-Temel_Matematik-29', 'B-Temel_Matematik-36'], 'narration': 'Orta noktanın koordinatları, uç noktaların koordinat ortalamalarıdır. A ye ekseninde olduğu için iks koordinatı sıfır, be iks ekseninde olduğu için ye koordinatı sıfırdır. Orta nokta üçe yedi olduğuna göre benin iks koordinatı altı, anın ye koordinatı on dört olur. Eksenleri altı ve on dörtte kesen doğrunun denklemini, iks bölü altı artı ye bölü on dört eşittir bir biçiminde yazabiliriz. Her terimi kırk ikiyle çarpalım: yedi iks artı üç ye eşittir kırk iki. Bu denklemi veren C seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-30', 'pair': ['A-Temel_Matematik-30', 'B-Temel_Matematik-35'], 'narration': 'Silinmiş eksenleri bulurken karelerin aralığını birim alıyoruz. Başlangıç noktası, aya iki ve beye on birim uzaklıkta olmalı. Şekilde bunu sağlayan iki yer var: anın iki kare üstü ya da iki kare sağı. İlk yerde beye uzaklık, yatay sekiz ve düşey altı birimden, altı sekiz on üçgeniyle ondur. İkinci yerde yatay altı, düşey sekiz olur ve yine on çıkar. Ye ekseni başlangıçtan geçen düşey doğrudur. İlk olasılıkta cenin ye eksenine uzaklığı iki, denin bir birimdir. İkinci olasılıkta ce ye eksenindedir; uzaklığı sıfır, deninki üçtür. İkisinde de toplam üç eder. A seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-31', 'pair': ['A-Temel_Matematik-31', 'B-Temel_Matematik-34'], 'narration': 'Yansımada a ce ışını, a be ile görüntüsü a be üssü arasındaki açıyı ikiye böler. Keseni ve iki ışını kullanarak oluşan büyük üçgene bakalım. Alt kesişimde iç açı, yüz seksen eksi yüz otuz sekizden kırk ikidir. Üst kesişimde ters açı nedeniyle iç açı da kırk ikidir. A noktasındaki büyük açı, yüz seksen eksi kırk iki eksi kırk iki, doksan altı derecedir. Yansıma ekseni bunu iki eş parçaya böler; her parça kırk sekiz derece olur. Alttaki küçük üçgende, kesenle a ce arasındaki iç açı yüz seksen eksi kırk iki eksi kırk sekizden doksandır. İstenen alfa, onun bütünleridir ve o da doksan derecedir. B seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-32', 'pair': ['A-Temel_Matematik-32', 'B-Temel_Matematik-33'], 'narration': 'Katlamada be köşesi a ce kenarına geldiği için katlama doğrusu a de, a açısının açıortayıdır. Verilen otuz beş dereceyi ikiyle çarparsak büyük üçgenin a açısı yetmiş derece olur. A be de üçgeninde açıların toplamını kullanalım. Be açısı, yüz seksen eksi otuz beş eksi seksen, altmış beş derecedir. Bu, büyük üçgenin de be açısıdır. Şimdi büyük üçgende ce açısını bulalım: yüz seksen eksi yetmiş eksi altmış beş, kırk beş derece. C seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-33', 'pair': ['A-Temel_Matematik-33', 'B-Temel_Matematik-32'], 'narration': 'Merdivenin alt ucunu ortak alan iki dik üçgeni düşünelim. İkisi de yere dik ve aynı eğik doğruyu paylaşıyor; bu nedenle benzerdir. Küçük üçgenin tabanı on iki, yüksekliği beş birim. Büyük üçgenin tabanı yalnız otuz altı değildir; on iki artı otuz altı, kırk sekizdir. Büyük tabanın küçük tabana oranı kırk sekiz bölü on iki, dört eder. Yükseklikler de aynı oranda büyür. İks, dört çarpı beşten yirmi birimdir. C seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-34', 'pair': ['A-Temel_Matematik-34', 'B-Temel_Matematik-27'], 'narration': 'İki yansımayı sırayla uygulayalım. İks eksenine göre yansımada iks aynı kalır, ye işaret değiştirir. Ardından ye eksenine göre yansımada bu kez iks işaret değiştirir. Sonuçta iki koordinat da başlangıçtakinin ters işaretlisidir. Bu, orijin çevresinde yüz seksen derece dönmeye eşittir. İkinci bölgedeki şekil dördüncü bölgeye geçer. Sarı daire sol üste, mavi dikdörtgen sol alta gelir. Üçgen sağ altta ve aşağı bakar. En harfi sağ üsttedir; yüz seksen derece dönünce biçimi aynı görünür. Bu yer ve yönlerin hepsi D seçeneğinde vardır. D seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-35', 'pair': ['A-Temel_Matematik-35', 'B-Temel_Matematik-25'], 'narration': 'Açıortay teoremiyle başlayalım. De ce uzunluğuna de dersek, a be bölü a ce oranı on altı bölü dedir. A be iks olduğundan a ce, iks çarpı de bölü on altı olur. Üçgende iki kenarın toplamı üçüncüden büyüktür. İks artı iks çarpı de bölü on altı, on altı artı deden büyük olmalıdır. On altıyla çarpıp ortak pozitif on altı artı de çarpanını sadeleştirince iks on altıdan büyük çıkar. En küçük tam sayı adayımız on yedidir. Bunun mümkün olduğunu da kontrol edelim: de ceyi on altı seçersek kenarlar on yedi, on yedi ve otuz iki olur; üçgen eşitsizliği sağlanır. En küçük değer on yedi, E seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-36', 'pair': ['A-Temel_Matematik-36', 'B-Temel_Matematik-24'], 'narration': 'A be de üçgeninde kosinüs teoremini kullanalım. A benin karesi, üçün karesi artı dördün karesi eksi iki çarpı üç çarpı dört çarpı kosinüs altmıştır. Kosinüs altmış yarım olduğu için dokuz artı on altı eksi on iki, on üç buluruz. De noktasındaki diğer açı yüz yirmidir. A cenin karesi için aynı teorem, iks kare artı on altı artı dört iks verir. Şimdi büyük üçgenin a köşesindeki dikliği kullanıyoruz. A be kare ile a ce karenin toplamı, hipotenüs olan iks artı üçün karesine eşittir. On üç artı iks kare artı on altı artı dört iks, iks kare artı altı iks artı dokuz eder. Sadeleştirince yirmi eşittir iki iks, dolayısıyla iks on santimetredir. D seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-37', 'pair': ['A-Temel_Matematik-37', 'B-Temel_Matematik-31'], 'narration': 'A be ve a ka zıt yönlü ışınlardır. Bu nedenle be a e ile e a ka açıları bütünlerdir. Bu iki açıyı ortalayan a de ve a ce arasındaki açı, yüz seksenin yarısı olan doksan derecedir. Böylece a de ce bir dik üçgendir. A e ise bu dik üçgende hipotenüse indirilen yüksekliktir. Yükseklik teoremine göre yüksekliğin karesi, hipotenüs üzerindeki iki parçanın çarpımına eşittir. İks kare, dört çarpı sekizden otuz iki olur. Uzunluk pozitif olduğundan iks kök otuz iki, yani dört kök iki santimetredir. E seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-38', 'pair': ['A-Temel_Matematik-38', 'B-Temel_Matematik-30'], 'narration': 'Dış açıortayı a be de üçgeninde kullanıyoruz. Ce noktası bu üçgenin be de kenarının uzantısında. Dış açıortay teoremine göre a be bölü a de, be ce bölü de ceye eşittir. Be ce, on altı artı yirmi dört, kırktır. Oran kırk bölü yirmi dört, beş bölü üç olur. A beye beş ka, a deye üç ka diyelim. Dik üçgende Pisagor, yirmi beş ka kare eksi dokuz ka kare eşittir on altının karesini verir. On altı ka kare eşittir iki yüz elli altı; buradan ka dört çıkar. İstenen a be, beş çarpı dört, yirmi birimdir. A seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-39', 'pair': ['A-Temel_Matematik-39', 'B-Temel_Matematik-29'], 'narration': 'İki lambanın oluşturduğu büyük üçgenler aynı a be tabanını paylaşıyor. Tabanlar eşit olduğundan alan oranları, yükseklik oranı olan yirmi dört bölü on iki, yani ikidir. Ortak mor bölgenin alanına em diyelim. Turuncu lambanın bütün üçgeni yetmiş beş artı em, mavi lambanın bütün üçgeni yirmi beş artı em olur. Büyük alan küçük alanın iki katı: yetmiş beş artı em eşittir iki çarpı, parantez içinde yirmi beş artı em. Sağdaki parantezi açarsak elli artı iki em elde ederiz. Düzenleyince em yirmi beş çıkar. Mor alan yirmi beş birimkaredir; C seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-40', 'pair': ['A-Temel_Matematik-40', 'B-Temel_Matematik-28'], 'narration': 'Katlamada be noktası ağırlık merkezine geliyor; ağırlık merkezine ge diyelim. Katlama doğrusu üzerinde kalan a noktası beye ve geye eşit uzaklıktadır, yani a be ile a ge eşittir. Be cenin orta noktasına em dersek, ağırlık merkezi a em kenarortayını ikiye bir oranında böler. A ge, a emin üçte ikisidir. Katlama doğrusu a de, a be ile a ge ışınlarının açıortayı olduğundan a be em üçgeninde açıortay teoremini uygularız. Be de bölü de em oranı iki bölü üç olur. Be de sekiz ise de em on iki, be em yirmidir. Em orta nokta olduğu için be ce kırk olur. De ce, kırk eksi sekizden otuz iki birimdir. C seçeneğini işaretliyoruz.'}]
          for item in items:
              try:
                  produce(item)
              except ProductionStop:
                  raise SystemExit(2)
              except Exception as error:
