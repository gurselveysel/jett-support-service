name: Atolye ElevenLabs R12 Batch05
run-name: Atolye R12 Batch05 - 26 unique questions - included credit
on:
  push:
    branches: [atolye-elevenlabs-20260921]
    paths: [.github/workflows/atolye-elevenlabs.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: atolye-elevenlabs-production
  cancel-in-progress: false
jobs:
  speech:
    if: github.ref == 'refs/heads/atolye-elevenlabs-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ensure audio verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Verify quota and produce 26 real narrations with provider timestamps
        shell: python
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          import json, pathlib
          class ProductionStop(Exception): pass
          def produce(item):
              import os, sys, json, pathlib, urllib.request, urllib.error, base64, hashlib, re, math
              out = pathlib.Path('atolye-r12-batch05')/item['id']
              out.mkdir(parents=True,exist_ok=True)
              voice = 'tZYpRZkmCNQcfmtDbhUg'
              model_id = 'eleven_v3'
              report = {'pair':item['pair'],
                        'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                        'commit':os.environ.get('GITHUB_SHA'), 'run_id':os.environ.get('GITHUB_RUN_ID'),
                        'credential_present':False,'api_called':False,'tts_called':False,
                        'audio_generated':False,'fallback_used':False,'video_completed':False,
                        'auditory_review':False}
              def save_report(status, **extra):
                  report.update(status=status, **extra)
                  (out/'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('ATOLYE_RESULT '+json.dumps(report,ensure_ascii=False))
              def stop(status, **extra):
                  save_report(status, **extra)
                  raise ProductionStop(status)
              key = os.environ.get('ELEVENLABS_API_KEY','').strip()
              if not key:
                  stop('blocked_missing_credential', required_secret='ELEVENLABS_API_KEY')
              report['credential_present'] = True
              # A rerun must never unknowingly spend credits twice. Use a fresh dispatch only after inspecting artifacts.
              if int(os.environ.get('GITHUB_RUN_ATTEMPT','1')) > 1:
                  stop('blocked_automatic_audio_regeneration', action='Inspect and reuse existing audio artifacts; fresh dispatch only if no audio was generated.')
              text=item['narration']
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              def call(path, payload=None):
                  report['api_called'] = True
                  req = urllib.request.Request('https://api.elevenlabs.io'+path,
                      headers={'xi-api-key':key,'Content-Type':'application/json'},
                      data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                      method='GET' if payload is None else 'POST')
                  try:
                      with opener.open(req, timeout=180) as response:
                          return json.loads(response.read(24000000)), response.headers.get('request-id')
                  except urllib.error.HTTPError as error:
                      try:
                          detail=json.loads(error.read(4000)).get('detail',{})
                          provider_code=detail.get('status') if isinstance(detail,dict) else None
                          if not isinstance(provider_code,str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,100}',provider_code) or key in provider_code:
                              provider_code=None
                      except Exception:
                          provider_code=None
                      stop('provider_error', http_status=error.code, provider_code=provider_code,
                           operation='tts' if payload is not None else path)
                  except Exception as error:
                      stop('transport_or_response_error', error_type=type(error).__name__,
                           tts_outcome_uncertain=payload is not None)
              voice_info,_=call('/v1/voices/'+voice)
              if voice_info.get('voice_id') != voice:
                  stop('blocked_voice_mismatch')
              report['voice_accessible'] = True
              models,_=call('/v1/models')
              selected=next((m for m in models if m.get('model_id')==model_id),None)
              if not selected or not selected.get('can_do_text_to_speech'):
                  stop('blocked_model_unavailable')
              report['model_accessible'] = True
              subscription,_=call('/v1/user/subscription')
              used=subscription.get('character_count')
              limit=subscription.get('character_limit')
              if type(used) is not int or type(limit) is not int or used<0 or limit<0:
                  stop('blocked_quota_not_verifiable')
              # No billing settings are changed. Stop unless paid overage is known to be disabled.
              extension=subscription.get('max_credit_limit_extension')
              overage_disabled=(type(extension) is int and extension==0) or subscription.get('can_extend_character_limit') is False
              if not overage_disabled:
                  stop('blocked_paid_overage_not_disabled', action='No audio request made; billing settings were not changed.')
              rates=selected.get('model_rates') or {}
              cost_factor=rates.get('character_cost_multiplier',selected.get('token_cost_factor'))
              if not isinstance(cost_factor,(int,float)) or isinstance(cost_factor,bool) or not math.isfinite(cost_factor) or cost_factor<=0:
                  stop('blocked_model_cost_not_verifiable')
              required=math.ceil(len(text)*max(1.0,float(cost_factor)))
              remaining=limit-used
              report.update(narration_characters=len(text), required_credits_conservative=required,
                            quota_checked=True, paid_overage_disabled=True, remaining_included_credits=remaining)
              if remaining < required:
                  stop('blocked_insufficient_included_credits', required_credits=required, remaining_included_credits=max(0,remaining))
              maximum=selected.get('maximum_text_length_per_request')
              tier_limit=selected.get('max_characters_request_free_user' if subscription.get('tier')=='free' else 'max_characters_request_subscribed_user')
              limits=[x for x in [maximum,tier_limit] if isinstance(x,int) and x>0]
              if limits and len(text)>min(limits):
                  stop('blocked_text_exceeds_model_limit', model_character_limit=min(limits))
              payload={'text':text,'model_id':model_id,'language_code':'tr',
                       'voice_settings':{'stability':0.5,'speed':0.94}}
              (out/'narration.txt').write_text(text,encoding='utf-8')
              report['narration_sha256']=hashlib.sha256(text.encode('utf-8')).hexdigest()
              report['tts_called']=True
              save_report('tts_request_started')
              result,request_id=call('/v1/text-to-speech/'+voice+'/with-timestamps?output_format=mp3_44100_128',payload)
              try:
                  audio=base64.b64decode(result['audio_base64'],validate=True)
                  if len(audio)<10000:
                      stop('invalid_audio_size')
                  (out/'speech.mp3').write_bytes(audio)
                  report.update(audio_generated=True, bytes=len(audio), sha256=hashlib.sha256(audio).hexdigest())
                  (out/'alignment.json').write_text(json.dumps({'alignment':result.get('alignment'),'normalized_alignment':result.get('normalized_alignment')},ensure_ascii=False,indent=2),encoding='utf-8')
                  alignment=result.get('normalized_alignment') or result.get('alignment')
                  if not alignment:
                      stop('audio_saved_but_alignment_missing', action='Reuse saved audio; do not regenerate for drawing.')
                  chars=alignment['characters']
                  starts=alignment['character_start_times_seconds']
                  ends=alignment['character_end_times_seconds']
                  assert len(chars)==len(starts)==len(ends)>0
                  assert all(isinstance(c,str) and len(c)==1 for c in chars)
                  assert all(math.isfinite(float(s)) and math.isfinite(float(e)) and 0<=float(s)<=float(e) for s,e in zip(starts,ends))
                  assert all(float(starts[i])<=float(starts[i+1]) for i in range(len(starts)-1))
                  joined=''.join(chars)
                  def segments(pattern):
                      return [{'text':m.group().strip(),'start':starts[m.start()],'end':ends[m.end()-1]} for m in re.finditer(pattern,joined) if m.group().strip()]
                  words=segments(r'\S+')
                  phrases=segments(r'[^.!?\n]+[.!?]?')
                  speech={'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                          'duration_alignment':max(ends),'word_timestamps':words,'phrase_timestamps':phrases,
                          'text':text,'request_id':request_id,'timing_source':'provider_character_alignment'}
                  (out/'speech.json').write_text(json.dumps(speech,ensure_ascii=False,indent=2),encoding='utf-8')
                  save_report('audio_saved_pending_decode', word_count=len(words),phrase_count=len(phrases),
                              last_alignment_second=max(ends), character_alignment_validated=True)
              except Exception as error:
                  stop('audio_processing_error',error_type=type(error).__name__,action='Inspect saved files before any new TTS request.')
              import subprocess
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(out/'speech.mp3')]))
              duration=float(probe['format']['duration'])
              assert math.isfinite(duration) and duration>1
              assert any(s['codec_type']=='audio' for s in probe['streams'])
              assert report['last_alignment_second']<=duration+0.5
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(out/'speech.mp3'),'-f','null','-'],check=True,capture_output=True)
              save_report('audio_generated_and_decoded',duration_seconds=duration,audio_decode_pass=True,auditory_review=False)

          items=[{'id': 'A-Temel_Matematik-22', 'pair': ['A-Temel_Matematik-22', 'B-Temel_Matematik-03'], 'narration': 'Şifreyi seçme ve yerleştirme olarak iki adımda sayalım. Artan sıra şartıyla iki farklı rakam seçiyoruz. Altı rakamdan ikisini seçmenin sayısı, altı çarpı beş bölü iki, on beştir. Dört harften iki farklı harf seçmenin sayısı, dört çarpı üç bölü iki, altıdır. Şimdi dört konumdan rakamların duracağı iki konumu seçelim; bunun da altı yolu var. Seçilen rakamlar kendi aralarında küçükten büyüğe, harfler kendi aralarında alfabetik sıraya gireceği için ayrıca permütasyonla çarpmıyoruz. On beş çarpı altı çarpı altı, beş yüz kırk şifre eder. E seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-06', 'pair': ['A-Fen_Bilimleri-06', 'B-Fen_Bilimleri-01'], 'narration': 'Özdeş, ideal pillerin her birinin gerilimine ve diyelim. Birinci devrede seri bağlandıkları için toplam gerilim iki ve olur. Direnç aynı olduğundan birinci devrenin akımı, iki ve bölü re olur. Ka pili bu akımın tamamını verir. İkinci devrede piller paraleldir; direnç üzerindeki gerilim ve, toplam akım ve bölü redir. Özdeş piller bu akımı eşit paylaşır. Le pilinden geçen akım, ve bölü iki redir. Böylece birinci devrenin direnç gerilimi daha büyük, ka pilinin akımı da daha büyüktür. Aynı kapasiteli le pili daha az akım verdiği için daha uzun süre dayanır. Üç yargı da doğrudur; E seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-07', 'pair': ['A-Fen_Bilimleri-07', 'B-Fen_Bilimleri-04'], 'narration': 'Dalgaları yayılmak için maddesel ortama ihtiyaç duyup duymamalarına göre ayırıyoruz. Su ve deprem dalgaları mekanik dalgalardır; ortamın titreşimleriyle yayılırlar. Yay dalgası da yayın titreşimiyle iletilir, yani mekaniktir. Tabloda yay dalgası elektromanyetik sütununa yazıldığı için hata buradadır. Radyo ve kızılötesi dalgalar ise elektromanyetiktir; boşlukta da yayılabilirler. Yanlış sınıflandırılan yay dalgasını veren E seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-10', 'pair': ['A-Fen_Bilimleri-10', 'B-Fen_Bilimleri-11'], 'narration': 'Periyodik tablodaki yerlerinden elementleri tanıyalım. İks magnezyum, ye alüminyum, ze flordur. İksin değerlik elektron sayısı iki, yenin üç, zenin yedidir. İki ile üçün toplamı beştir; yedi etmez. Bu nedenle E seçeneğindeki eşitlik yanlıştır. Diğer bilgileri de kontrol edelim. Bu üçlüde atom yarıçapı ve metalik etkinliği en büyük olan magnezyum, elektronegatifliği en büyük olan flordur. İlk iyonlaşma enerjisinde ise magnezyumun dolu üç es alt kabuğu nedeniyle alüminyumdan yüksek olduğu istisnayı hatırlamalıyız. Yanlış ifade istendiğinden E seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-12', 'pair': ['A-Fen_Bilimleri-12', 'B-Fen_Bilimleri-10'], 'narration': 'Sorunun eş koşullu akış deneyini karşılaştıralım. İks sıvısı otuz, ye sıvısı yirmi saniyede akıyor. İks akmaya daha fazla direnç gösterdiği için viskozitesi daha büyük kabul edilir. Bu okul düzeyi karşılaştırmada, moleküller arası çekimi daha güçlü olan sıvı ikstir; birinci yargı doğrudur. Yenin viskozitesinin daha yüksek olduğunu söyleyen ikinci yargı tersini söylüyor, yanlıştır. Bir sıvıyı soğutmak genellikle viskozitesini artırır. İksi soğutmak, zaten daha küçük viskoziteli olan yeye yaklaştırmaz. Üçüncü yargı da yanlıştır. Yalnız birinciyi veren A seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-13', 'pair': ['A-Fen_Bilimleri-13', 'B-Fen_Bilimleri-09'], 'narration': 'Hacimleri karşılaştırmak için ideal gaz bağıntısını kullanalım. Basınç çarpı hacim, mol sayısı çarpı gaz sabiti çarpı mutlak sıcaklıktır. Hacim için mol sayısıyla sıcaklığı çarpıp basınca böleriz. Gaz sabiti hepsinde aynı olduğu için sıralamada sadeleşir. İks için sıfır virgül beş çarpı yüz bölü üç, elli bölü üç çıkar. Ye için bir çarpı üç yüz bölü iki, yüz ellidir. Ze için bir buçuk çarpı iki yüz bölü bir, üç yüzdür. En büyük hacim ze, sonra ye, en küçük ikstir. B seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-14', 'pair': ['A-Fen_Bilimleri-14', 'B-Fen_Bilimleri-08'], 'narration': 'Üç kapta sıcaklık, su miktarı ve şeker kütlesi aynı. Değişen özellik şekerin tanecik boyutudur. Tanecikler küçüldükçe suyla temas eden toplam yüzey büyür ve çözünme hızlanır. Pudra şekerinin yüzeyi en büyük olduğu için ikinci kap en hızlıdır. Toz şeker bulunan birinci kap onu izler. Küp şeker bulunan üçüncü kap en yavaştır. Çözünme miktarıyla çözünme hızını karıştırmayalım; burada sorulan hızdır. Sıralama ikinci, birinci, üçüncü olur. C seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-16', 'pair': ['A-Fen_Bilimleri-16', 'B-Fen_Bilimleri-20'], 'narration': 'Tanımdaki belirleyici koşula dikkat edelim: doğal ortamda çiftleşip, kendileri de üreyebilen yavrular oluşturmak. Bu, biyolojik tür tanımına karşılık gelir. Yalnız dış görünüş benzerliği yeterli değildir; verimli döl oluşturabilme koşulu da aranır. Cins, aile, takım ve sınıf daha geniş sınıflandırma basamaklarıdır. Soruda verilen en özel birim türdür. C seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-17', 'pair': ['A-Fen_Bilimleri-17', 'B-Fen_Bilimleri-18'], 'narration': 'Nişasta, glikojen ve selülozun üçü de polisakkarittir. Ortak yapı taşları glikozdur. Çok sayıda glikoz, glikozit bağlarıyla birleşerek bu büyük molekülleri oluşturur. B seçeneği bu ortak özelliği söylüyor. İşlevleri ise aynı değildir: nişasta ve glikojen depo maddeleriyken, selüloz bitki hücre duvarında yapıya katılır. İnsan selülozu kendi sindirim enzimleriyle parçalayamaz. Bu nedenle depolama, bitkide üretilme veya insanda sindirilme özelliklerini üçünün ortak özelliği sayamayız. B seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-18', 'pair': ['A-Fen_Bilimleri-18', 'B-Fen_Bilimleri-16'], 'narration': 'Geviş getirenlerde sindirimi hayvanın kendi enzimleriyle, birlikte yaşayan mikroorganizmaların katkısını ayırarak değerlendirelim. Mide dört özelleşmiş bölümden oluşabilir; birinci yargı doğrudur. Selülozu parçalayan enzimleri hayvanın kendi hücreleri üretmez. Sindirim sistemindeki ortak yaşayan mikroorganizmalar üretir. Bu yüzden ikinci yargı, enzimi hayvana atfettiği biçimiyle yanlıştır. Yutulmuş besini ağza geri getirip yeniden çiğnemek geviş getirmedir; üçüncü yargı doğrudur. Birinci ve üçüncüyü veren C seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-19', 'pair': ['A-Fen_Bilimleri-19', 'B-Fen_Bilimleri-15'], 'narration': 'Kemosentezde organik madde üretimi için ışık yerine kimyasal tepkimelerden sağlanan enerji kullanılır. Nitrifikasyon bakterileri inorganik azot bileşiklerini yükseltgerken enerji elde edebilir. Bu enerjiyi organik madde sentezinde kullanmaları kemosentezdir. Yeşil algler, siyanobakteriler ve öglena fotosentez yaparken ışık enerjisini kullanır. Mantarlar ise hazır organik besin alır. Seçenekler içinde kemosentez yapabilen grup nitrifikasyon bakterileridir. E seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-20', 'pair': ['A-Fen_Bilimleri-20', 'B-Fen_Bilimleri-17'], 'narration': 'İki canlı üzerindeki etkiyi ayrı ayrı yazalım. Kuşlar kaçışan böcekleri kolay yakaladıkları için yarar görüyor; kuşlara artı işareti verelim. Metin sığırların ne yarar ne zarar gördüğünü açıkça söylüyor; sığırlar için sıfır yazalım. Bir türün yarar gördüğü, diğerinin etkilenmediği artı sıfır ilişkisi kommensalizmdir. Mutualizmde iki tür de yarar görürdü; parazitizmde ise birinin yararına karşılık diğeri zarar görürdü. Sorudaki ilişkiyi veren D seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-09', 'pair': ['A-Sosyal_Bilimler-09', 'B-Sosyal_Bilimler-06'], 'narration': 'İkincil ekonomik sektörde ham madde işlenir veya yapı inşa edilir. Pamuğun iplik ve kumaşa dönüştürülmesi sanayi faaliyetidir; ikinci örnek bu sektöre girer. Konut, köprü ve yol yapımı da inşaat faaliyetidir; üçüncü örnek de ikincil sektördedir. Ürünlerin tüketiciye ulaştırılıp satılması ise ticaret ve dağıtım hizmetidir, üçüncül sektöre girer. Dolayısıyla ikinci ve üçüncü örnekleri seçmeliyiz. E seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-10', 'pair': ['A-Sosyal_Bilimler-10', 'B-Sosyal_Bilimler-08'], 'narration': 'Şeklin üç aşamasını izleyelim. Önce su, kayacın çatlaklarından yer altına sızıyor. Çözünebilen kayacı aşındırarak yer altında boşluklar oluşturuyor. Boşluk büyüdüğünde tavanı taşıyamıyor ve çökme gerçekleşiyor. Yüzeyde oluşan derin çukur, çökme kökenli bir obruk. Traverten birikme şeklidir; burada ise çözünme ve çökme var. Düden suyun yer altına geçtiği yeri anlatır; şekilde özellikle tavanın çökmesi gösterilmiş. Obruğu veren A seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-12', 'pair': ['A-Sosyal_Bilimler-12', 'B-Sosyal_Bilimler-13'], 'narration': 'Parçanın temel vurgusu, evrendeki varlıkların sürekli değişmesidir. Nehir örneğinde suyun akıp gitmesi, hiçbir şeyin aynı biçimde kalmamasını açıklıyor. Herakleitos için varlık durağan bir şey olarak değil, oluş ve değişme süreci olarak ele alınıyor. Bu görüşe oluşçuluk denir. Parça bilginin kuşkulu oluşunu ya da hiçbir şeyin var olmadığını savunmuyor; değişimi açıklıyor. Oluşçu görüşü veren A seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-13', 'pair': ['A-Sosyal_Bilimler-13', 'B-Sosyal_Bilimler-14'], 'narration': 'Parçadaki soruları ortak bir başlık altında toplayalım. Bilgi nedir, neyi bilebiliriz, neyi doğru sayarız ve bilgimizin sınırları nelerdir? Bunların hepsi bilgi felsefesinin konusudur. Bilgi felsefesinin diğer adı epistemolojidir. Ontoloji varlığı, estetik güzeli ve sanatı, felsefi antropoloji insanı araştırır. Burada doğrudan bilginin niteliği ve sınırları sorgulandığı için epistemolojiyi seçiyoruz. Cevap E seçeneğidir.'}, {'id': 'A-Sosyal_Bilimler-14', 'pair': ['A-Sosyal_Bilimler-14', 'B-Sosyal_Bilimler-15'], 'narration': 'Bir önermenin mutlaka doğru olması gerekmez; doğru ya da yanlış değeri alabilen bir yargı bildirmesi gerekir. Seçeneklerdeki bildirme cümleleri bu özelliği taşır. D seçeneği ise, ilk filozof Tales midir diye soruyor. Soru bir yargı ileri sürmediğinden kendisine doğru veya yanlış değeri veremeyiz. İlk filozof Talestir biçiminde bir bildirim olsaydı, doğruluğunu tartışabileceğimiz bir önerme olurdu. Önerme olmayan soru cümlesini veren D seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-15', 'pair': ['A-Sosyal_Bilimler-15', 'B-Sosyal_Bilimler-11'], 'narration': 'Kantın görüşünde duyular ve akıl birlikte çalışır. Duyular, deney yoluyla bilginin ham maddesini sağlar. Akıl ise bu verileri kategorilerle düzenleyerek bilgiye dönüştürür. Dolayısıyla duyusal veri tek başına işlenmiş bilgi değildir; akıl da deneysel veriyi tamamen yok sayarak bilgi üretemez. B seçeneği, bilginin bir yönüyle deneye, diğer yönüyle akla dayandığını söylüyor. Parçanın iki unsuru birlikte kullanma düşüncesini karşılayan B seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-17', 'pair': ['A-Sosyal_Bilimler-17', 'B-Sosyal_Bilimler-18'], 'narration': 'Sorudaki hadis, çevremizdeki ihtiyaç sahiplerine karşı sorumluluğu ve paylaşmayı vurguluyor. Zekât, belirli şartlarda maldan pay vermeyi içerir. İnfak, ihtiyaçları gözeterek Allah yolunda harcamayı anlatır. Sadaka da yardım ve iyilik yoluyla dayanışmayı destekler. Üçü de komşunun ve toplumun ihtiyaçlarına kayıtsız kalmama anlayışıyla ilişkilidir. Bu nedenle yalnız birini seçmeyiz; birinci, ikinci ve üçüncü birlikte doğrudur. E seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-18', 'pair': ['A-Sosyal_Bilimler-18', 'B-Sosyal_Bilimler-20'], 'narration': 'Metindeki ifadelerle öncülleri eşleştirelim. İslam sanatının Allahın birliğini ve yaratılışın güzelliğini yansıtmayı amaçladığı söyleniyor. Bu, birinci öncülü destekler. Kuranın okunması ve korunmasının musikiye ve hat sanatına ilham vermesi, üçüncü öncülün manevi içerik vurgusuyla uyumludur. İkinci öncül ise estetik değerlere önem verilmediğini söylüyor. Oysa metin güzellikten, mimarlıktan ve süslemeden söz ediyor; bu öncül metinle çelişiyor. Birinci ve üçüncü öncülleri veren D seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-19', 'pair': ['A-Sosyal_Bilimler-19', 'B-Sosyal_Bilimler-17'], 'narration': 'Paragraf temizliğin iki yönünü birlikte anlatıyor: bedensel temizlik ve manevi arınma. Aradığımız seçenek bu iki yönü de desteklemeli. C seçeneğinde elbiseni temiz tut ifadesi bedensel temizliği, kötü şeyleri terk et ifadesi manevi arınmayı karşılıyor. Diğer seçeneklerde hesap verme, paylaşma, yardımlaşma veya ibadetten uzaklaşma konuları öne çıkıyor. İki boyutu aynı ifadede birleştiren C seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-20', 'pair': ['A-Sosyal_Bilimler-20', 'B-Sosyal_Bilimler-16'], 'narration': 'Parçadaki teşviklerin sonuçlarını değerlendirelim. Gençlerin düşüncelerini cesaretle söylemesi ve karar alması desteklendiğinde özgüvenleri gelişir; birinci öncül uygundur. Öğretmenlik, yöneticilik ve komutanlık gibi sorumluluklar toplumda önemli roller üstlenmelerini sağlar; ikinci öncül de uygundur. Bu görevler yeteneklerini kullanıp geliştirmelerine fırsat verir; üçüncü öncül de desteklenir. Böylece üç sonuç da metinden çıkarılabilir. E seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-22', 'pair': ['A-Sosyal_Bilimler-22', 'B-Sosyal_Bilimler-24'], 'narration': 'Üç düşünürün ortak vurgusunu buluyoruz. İlk açıklamada hayal gücü, ikincide iç dünyadan gelen ilham, üçüncüde özgün fikir ve duygular öne çıkıyor. Üçü de sanatçının yeni bir şey ortaya koymasını anlatıyor. Bu ortaklık, yaratıcılık ve özgünlüktür. Yalnız dış dünyayı yansıtmak ya da kopyalamak bu açıklamaları karşılamaz; teknik süreç ve toplumsal işlev de ortak odak değildir. Sanatın yaratıcılık ve özgünlüğe dayandığını söyleyen D seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-23', 'pair': ['A-Sosyal_Bilimler-23', 'B-Sosyal_Bilimler-21'], 'narration': 'Soruda akıl yürütmenin gerektirmediği özellik aranıyor. Akıl yürütürken öncül adı verilen önermelerden hareket eder, aralarında mantıksal ilişkiler kurarak bir sonuca ulaşırız. Bu nedenle önermelere dayanma, ilişki kurma ve yöntemli düşünme gereklidir. Ancak öncüllerin mutlaka kişisel görüş olması gerekmez. Gözlemle doğrulanan bir bilgi veya genel bir önerme de öncül olabilir. Kişisel görüş kullanmak mümkün olsa bile zorunlu değildir. B seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-24', 'pair': ['A-Sosyal_Bilimler-24', 'B-Sosyal_Bilimler-25'], 'narration': 'Parçada doğruluk, bilginin nesnesini olduğu gibi yansıtması biçiminde tanımlanıyor. Yani düşüncemizle gerçeklik arasında bir uygunluk arıyoruz. Bir bilginin yararlı bulunması, başkalarınca kabul edilmesi veya bir otoritece onaylanması tek başına bu uygunluğu göstermez. Tutarlılık ise önermelerin birbirleriyle çelişmemesiyle ilgilidir. Sorudaki tanımın doğrudan karşılığı, bilgi ile gerçeklik arasındaki uygunluktur. C seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-25', 'pair': ['A-Sosyal_Bilimler-25', 'B-Sosyal_Bilimler-22'], 'narration': 'Epikürosun aktarılan düşüncesinde ulaşılmak istenen hedef mutluluktur. Mutluluğa erişme yollarını aramamız gerektiği söylenerek eylemlerin amacı açıklanıyor. Burada evrensel bir ahlak yasasının varlığı, özgür irade veya sorumluluğun niteliği tartışılmıyor. Hangi hedefe yönelmeliyiz sorusuna, mutluluğa yönelmeliyiz cevabı veriliyor. Bu nedenle görüş, ahlaki eylemin amacı nedir sorusuna karşılık gelir. A seçeneğini işaretliyoruz.'}]
          for item in items:
              try:
                  produce(item)
              except ProductionStop:
                  raise SystemExit(2)
              except Exception as error:
                  print('BATCH_STOP '+json.dumps({'id':item['id'],'error_type':type(error).__name__,'action':'Inspect saved artifacts before any new TTS request.'}))
                  raise SystemExit(3)

      - name: Preserve all generated audio and timestamps even after partial failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atolye-r12-batch05-${{ github.run_id }}
          path: atolye-r12-batch05/
          if-no-files-found: warn
          retention-days: 30
