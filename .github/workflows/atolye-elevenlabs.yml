name: Atolye ElevenLabs R12 Batch04
run-name: Atolye R12 Batch04 - 16 unique questions - included credit
on:
  push:
    branches: [atolye-elevenlabs-20260921]
    paths: [.github/workflows/atolye-elevenlabs.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: atolye-elevenlabs-production
  cancel-in-progress: false
jobs:
  speech:
    if: github.ref == 'refs/heads/atolye-elevenlabs-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ensure audio verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Verify quota and produce 16 real narrations with provider timestamps
        shell: python
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          import json, pathlib
          class ProductionStop(Exception): pass
          def produce(item):
              import os, sys, json, pathlib, urllib.request, urllib.error, base64, hashlib, re, math
              out = pathlib.Path('atolye-r12-batch04')/item['id']
              out.mkdir(parents=True,exist_ok=True)
              voice = 'tZYpRZkmCNQcfmtDbhUg'
              model_id = 'eleven_v3'
              report = {'pair':item['pair'],
                        'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                        'commit':os.environ.get('GITHUB_SHA'), 'run_id':os.environ.get('GITHUB_RUN_ID'),
                        'credential_present':False,'api_called':False,'tts_called':False,
                        'audio_generated':False,'fallback_used':False,'video_completed':False,
                        'auditory_review':False}
              def save_report(status, **extra):
                  report.update(status=status, **extra)
                  (out/'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('ATOLYE_RESULT '+json.dumps(report,ensure_ascii=False))
              def stop(status, **extra):
                  save_report(status, **extra)
                  raise ProductionStop(status)
              key = os.environ.get('ELEVENLABS_API_KEY','').strip()
              if not key:
                  stop('blocked_missing_credential', required_secret='ELEVENLABS_API_KEY')
              report['credential_present'] = True
              # A rerun must never unknowingly spend credits twice. Use a fresh dispatch only after inspecting artifacts.
              if int(os.environ.get('GITHUB_RUN_ATTEMPT','1')) > 1:
                  stop('blocked_automatic_audio_regeneration', action='Inspect and reuse existing audio artifacts; fresh dispatch only if no audio was generated.')
              text=item['narration']
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              def call(path, payload=None):
                  report['api_called'] = True
                  req = urllib.request.Request('https://api.elevenlabs.io'+path,
                      headers={'xi-api-key':key,'Content-Type':'application/json'},
                      data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                      method='GET' if payload is None else 'POST')
                  try:
                      with opener.open(req, timeout=180) as response:
                          return json.loads(response.read(24000000)), response.headers.get('request-id')
                  except urllib.error.HTTPError as error:
                      try:
                          detail=json.loads(error.read(4000)).get('detail',{})
                          provider_code=detail.get('status') if isinstance(detail,dict) else None
                          if not isinstance(provider_code,str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,100}',provider_code) or key in provider_code:
                              provider_code=None
                      except Exception:
                          provider_code=None
                      stop('provider_error', http_status=error.code, provider_code=provider_code,
                           operation='tts' if payload is not None else path)
                  except Exception as error:
                      stop('transport_or_response_error', error_type=type(error).__name__,
                           tts_outcome_uncertain=payload is not None)
              voice_info,_=call('/v1/voices/'+voice)
              if voice_info.get('voice_id') != voice:
                  stop('blocked_voice_mismatch')
              report['voice_accessible'] = True
              models,_=call('/v1/models')
              selected=next((m for m in models if m.get('model_id')==model_id),None)
              if not selected or not selected.get('can_do_text_to_speech'):
                  stop('blocked_model_unavailable')
              report['model_accessible'] = True
              subscription,_=call('/v1/user/subscription')
              used=subscription.get('character_count')
              limit=subscription.get('character_limit')
              if type(used) is not int or type(limit) is not int or used<0 or limit<0:
                  stop('blocked_quota_not_verifiable')
              # No billing settings are changed. Stop unless paid overage is known to be disabled.
              extension=subscription.get('max_credit_limit_extension')
              overage_disabled=(type(extension) is int and extension==0) or subscription.get('can_extend_character_limit') is False
              if not overage_disabled:
                  stop('blocked_paid_overage_not_disabled', action='No audio request made; billing settings were not changed.')
              rates=selected.get('model_rates') or {}
              cost_factor=rates.get('character_cost_multiplier',selected.get('token_cost_factor'))
              if not isinstance(cost_factor,(int,float)) or isinstance(cost_factor,bool) or not math.isfinite(cost_factor) or cost_factor<=0:
                  stop('blocked_model_cost_not_verifiable')
              required=math.ceil(len(text)*max(1.0,float(cost_factor)))
              remaining=limit-used
              report.update(narration_characters=len(text), required_credits_conservative=required,
                            quota_checked=True, paid_overage_disabled=True, remaining_included_credits=remaining)
              if remaining < required:
                  stop('blocked_insufficient_included_credits', required_credits=required, remaining_included_credits=max(0,remaining))
              maximum=selected.get('maximum_text_length_per_request')
              tier_limit=selected.get('max_characters_request_free_user' if subscription.get('tier')=='free' else 'max_characters_request_subscribed_user')
              limits=[x for x in [maximum,tier_limit] if isinstance(x,int) and x>0]
              if limits and len(text)>min(limits):
                  stop('blocked_text_exceeds_model_limit', model_character_limit=min(limits))
              payload={'text':text,'model_id':model_id,'language_code':'tr',
                       'voice_settings':{'stability':0.5,'speed':0.94}}
              (out/'narration.txt').write_text(text,encoding='utf-8')
              report['narration_sha256']=hashlib.sha256(text.encode('utf-8')).hexdigest()
              report['tts_called']=True
              save_report('tts_request_started')
              result,request_id=call('/v1/text-to-speech/'+voice+'/with-timestamps?output_format=mp3_44100_128',payload)
              try:
                  audio=base64.b64decode(result['audio_base64'],validate=True)
                  if len(audio)<10000:
                      stop('invalid_audio_size')
                  (out/'speech.mp3').write_bytes(audio)
                  report.update(audio_generated=True, bytes=len(audio), sha256=hashlib.sha256(audio).hexdigest())
                  (out/'alignment.json').write_text(json.dumps({'alignment':result.get('alignment'),'normalized_alignment':result.get('normalized_alignment')},ensure_ascii=False,indent=2),encoding='utf-8')
                  alignment=result.get('normalized_alignment') or result.get('alignment')
                  if not alignment:
                      stop('audio_saved_but_alignment_missing', action='Reuse saved audio; do not regenerate for drawing.')
                  chars=alignment['characters']
                  starts=alignment['character_start_times_seconds']
                  ends=alignment['character_end_times_seconds']
                  assert len(chars)==len(starts)==len(ends)>0
                  assert all(isinstance(c,str) and len(c)==1 for c in chars)
                  assert all(math.isfinite(float(s)) and math.isfinite(float(e)) and 0<=float(s)<=float(e) for s,e in zip(starts,ends))
                  assert all(float(starts[i])<=float(starts[i+1]) for i in range(len(starts)-1))
                  joined=''.join(chars)
                  def segments(pattern):
                      return [{'text':m.group().strip(),'start':starts[m.start()],'end':ends[m.end()-1]} for m in re.finditer(pattern,joined) if m.group().strip()]
                  words=segments(r'\S+')
                  phrases=segments(r'[^.!?\n]+[.!?]?')
                  speech={'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                          'duration_alignment':max(ends),'word_timestamps':words,'phrase_timestamps':phrases,
                          'text':text,'request_id':request_id,'timing_source':'provider_character_alignment'}
                  (out/'speech.json').write_text(json.dumps(speech,ensure_ascii=False,indent=2),encoding='utf-8')
                  save_report('audio_saved_pending_decode', word_count=len(words),phrase_count=len(phrases),
                              last_alignment_second=max(ends), character_alignment_validated=True)
              except Exception as error:
                  stop('audio_processing_error',error_type=type(error).__name__,action='Inspect saved files before any new TTS request.')
              import subprocess
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(out/'speech.mp3')]))
              duration=float(probe['format']['duration'])
              assert math.isfinite(duration) and duration>1
              assert any(s['codec_type']=='audio' for s in probe['streams'])
              assert report['last_alignment_second']<=duration+0.5
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(out/'speech.mp3'),'-f','null','-'],check=True,capture_output=True)
              save_report('audio_generated_and_decoded',duration_seconds=duration,audio_decode_pass=True,auditory_review=False)

          items=[{'id': 'A-Temel_Matematik-15', 'pair': ['A-Temel_Matematik-15', 'B-Temel_Matematik-08'], 'narration': 'Kutu grafiğini soldan sağa okuyalım. En küçük değer altı. Kutunun sol kenarı alt çeyrek dokuz, içindeki çizgi ortanca on yedi. Kutunun sağ kenarı üst çeyrek yirmi iki, en büyük değer yirmi dokuzdur.\n\nAçıklık, en büyük değerle en küçük değerin farkıdır. Yirmi dokuz eksi altı, yirmi üç eder. D seçeneğinde açıklığın on altı olduğu yazılmış; bu yanlıştır.\n\nÇeyrekler açıklığını da kontrol edelim: üst çeyrek eksi alt çeyrek, yani yirmi iki eksi dokuz, on üçtür. Diğer seçenekler grafiğe uyuyor. Yanlış ifade sorulduğu için D seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-16', 'pair': ['A-Temel_Matematik-16', 'B-Temel_Matematik-09'], 'narration': 'Grafikte iki yaşında beş, üç yaşında altı, dört yaşında altı ve beş yaşında üç çocuk var. Toplam yirmi çocuk ediyor. Yaşları küçükten büyüğe sıraladığımızı düşünelim.\n\nİlk beş sırada iki yaşındakiler var. Altıncı sıradan on birinci sıraya kadar üç yaşındakiler, on ikinci sıradan on yedinci sıraya kadar dört yaşındakiler gelir. Son üç sırada beş yaşındakiler bulunur.\n\nAlt çeyrek için alt yarıdaki on verinin ortancasını alırız. Beşinci değer iki, altıncı değer üç. İkiyle üçü toplayıp ikiye böleriz, iki buçuk buluruz.\n\nÜst yarının ortasındaki on beşinci ve on altıncı değerlerin ikisi de dört. Üst çeyrek dört olur. Çeyrekler açıklığı dört eksi iki buçuk, bir buçuktur. D seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-18', 'pair': ['A-Temel_Matematik-18', 'B-Temel_Matematik-06'], 'narration': 'Önce ortadaki eğik parçayı inceleyelim. Bu doğru, eksi üçe beş ve üçe eksi beş noktalarından geçiyor. Eğimi, ye değerlerindeki farkın iks değerlerindeki farka bölümüdür.\n\nEksi beş eksi beş, bölü üç eksi eksi üç; eksi on bölü altı, yani eksi beş bölü üç eder. Doğru başlangıç noktasından da geçtiği için bu parçada fonksiyon eksi beş iks bölü üçtür. Birinci yargıdaki eksi üç iks bölü beş doğru değildir.\n\nBeş ile yedi arasında grafik sağa giderken yükseliyor; ikinci yargı doğrudur. Eksi üç ve solundaki gösterilen parça yataydır; fonksiyonun değeri beş olarak sabittir. Üçüncü yargı da doğrudur. İkinci ve üçüncüyü veren D seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-19', 'pair': ['A-Temel_Matematik-19', 'B-Temel_Matematik-05'], 'narration': 'Fonksiyonu önce tepe noktası biçiminde yazalım. İki iks kare eksi sekiz iks artı on bir, iki çarpı iks eksi ikinin karesi artı üçtür. Tepe noktası ikiye üçtür.\n\nGrafiği üç birim sağa ve üç birim aşağı taşıyınca tepe noktası beşe sıfıra gelir. Yeni fonksiyon iki çarpı iks eksi beşin karesidir. Açarsak iki iks kare eksi yirmi iks artı elli elde ederiz.\n\nKare sıfır olduğunda iks beş olur; birinci yargı doğrudur. Katsayılar toplamını bulmak için iks yerine bir yazabiliriz. İki çarpı bir eksi beşin karesi, otuz iki eder. İkinci yargı da doğru.\n\nKareli terimin katsayısı pozitif olduğu için parabola yukarı açılır. Tepe noktasının sağında, yani beşten itibaren artandır. Üçüncü yargı da doğru. E seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-20', 'pair': ['A-Temel_Matematik-20', 'B-Temel_Matematik-02'], 'narration': 'Fonksiyonun A kümesindeki değerleri sekizde bir ile üçte bir arasında. Bir bölü iks eksi iki pozitif olduğuna göre payda pozitiftir; iks ikiden büyüktür.\n\nPozitif sayılarda tersini alırken sıralama yönü değişir. Bir bölü iks eksi ikinin sekizde bir ile üçte bir arasında olması, iks eksi ikinin üç ile sekiz arasında olması demektir.\n\nHer tarafa iki eklersek iks beş ile on arasında kalır, sınırlar dahil. A kümesindeki tam sayılar beş, altı, yedi, sekiz, dokuz ve ondur.\n\nBu altı sayıyı toplayalım: beş ile on, altı ile dokuz ve yedi ile sekiz çiftlerinin her biri on beş eder. Üç çarpı on beş, kırk beş. C seçeneğini işaretliyoruz.'}, {'id': 'A-Temel_Matematik-21', 'pair': ['A-Temel_Matematik-21', 'B-Temel_Matematik-04'], 'narration': 'Grafikte eğrinin yaklaştığı düşey doğru iks eşittir eksi üç. Seçeneklerde paydanın sıfır olduğu değer bu düşey asimptotu vermeli. Dolayısıyla paydası iks artı üç olan seçeneklere bakarız.\n\nŞimdi ye eksenini kestiği noktayı kullanalım. İks sıfırken fonksiyonun değeri bir. Fonksiyonu ka bölü iks artı üç biçiminde yazarsak, sıfırda ka bölü üç eşittir bir olur. Buradan ka üç çıkar.\n\nFonksiyon üç bölü iks artı üçtür. İks eksi üçten büyükken pozitif, küçükken negatiftir; iki kolun konumu da grafikle uyuşur. D seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-05', 'pair': ['A-Turkce-05', 'B-Turkce-28'], 'narration': 'İki cümle arasındaki düşünce ilişkisine bakalım. İlk cümle, hayallerin yaşama amaç ve anlam kattığını söylüyor. Hayalsiz bir yaşamın geride anlamlı bir şey bırakmayacağı savunuluyor.\n\nİkinci cümlede ise Addison adıyla aktarılan söz kullanılıyor. Bu sözde de gerçekleştirilecek bir düşe sahip olmanın önemi vurgulanıyor. Böylece ilk cümlenin düşüncesi destekleniyor.\n\nBir düşünceyi tanınmış bir kişinin sözüyle destekleme yöntemine tanık gösterme denir. Burada düşünceler çatışmıyor ve yaşanmış bir olay örneklenmiyor. Tanık göstermeyi belirten A seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-06', 'pair': ['A-Turkce-06', 'B-Turkce-27'], 'narration': 'Bu soruyu, metnin anlattığı örneğin verdiği mesaja göre çözüyoruz. Metinde satış sorunu otomobilin biçimi ya da fiyatıyla değil, ürün adının hedef ülkedeki dilsel çağrışımıyla açıklanıyor.\n\nBurada çıkarılmak istenen ilke, bir ürünü başka ülkede pazarlarken o ülkenin dilini ve kültürel özelliklerini dikkate almaktır. Aynı ad farklı bir dilde farklı bir anlam çağrıştırabilir.\n\nSorun metinde yazım yanlışı, ürünün üstün niteliği veya satış miktarını tahmin etme olarak sunulmuyor. Ürünün pazarlanacağı ülkenin kültürel özelliklerini belirten E seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-07', 'pair': ['A-Turkce-07', 'B-Turkce-26'], 'narration': 'Deyimlerin açıklamalarını karşılaştırıyoruz. Parası çıkışmamak, bir kişinin parasının ihtiyaçlarını karşılamaya yetmemesidir. Parasını harcamamayı kendi isteğiyle seçmesi anlamına gelmez.\n\nİkinci deyimin açıklamasında gereken yerde para harcamaktan kaçınmak denmiş. Bu, yetersizlik yerine isteyerek kaçınmayı anlatıyor. Dolayısıyla açıklama deyimle uyuşmuyor.\n\nBir dediğini iki etmemek isteneni hemen yerine getirmek, ipe un sermek bahanelerle işten kaçınmak, gün saymak beklemek ve dert yanmak yakınmaktır. Yanlış açıklanan ikinci deyimi veren B seçeneğini işaretliyoruz.'}, {'id': 'A-Turkce-08', 'pair': ['A-Turkce-08', 'B-Turkce-25'], 'narration': 'Kesin çıkarım sorularında, yalnız cümlede verilen bilgiye dayanırız. Metin batılılaşma hareketinin başlangıcını on sekizinci yüzyıla götürüyor.\n\nBaşlangıç birkaç yüzyıl öncesine uzandığına göre bu hareketin birkaç asırlık geçmişi vardır. D seçeneği, verilen zamanı doğrudan karşılıyor.\n\nCümlede hangi askeri yeniliklerin yapıldığı veya bu yönelişin Cumhuriyetin kuruluşuna nasıl etki ettiği açıklanmıyor. Bunlar için ek bilgi gerekir. Kesin olarak çıkarılabilen yargıyı veren D seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-03', 'pair': ['A-Sosyal_Bilimler-03', 'B-Sosyal_Bilimler-04'], 'narration': 'Sorudaki iki belirleyici ipucu zaman ve yer. Zaman beşinci yüzyıl; yer Büyük Macar Ovası, yani Orta Avrupa. Türkistandan batıya doğru gerçekleşen göçün bu bölgeye ulaşması soruluyor.\n\nBu zaman ve coğrafyada seçenekler içinde Avrupa Hunları öne çıkar. Hunlar, Orta Avrupadaki varlıklarıyla bu iki ipucuna birlikte uyar.\n\nYalnız Türkistan bağlantısına bakmak yeterli değil; topluluğun hangi dönemde nerede bulunduğunu da eşleştirmeliyiz. Hunları veren A seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-04', 'pair': ['A-Sosyal_Bilimler-04', 'B-Sosyal_Bilimler-02'], 'narration': 'Elçinin vurguladığı nokta, devletin yüksek görevlerine gelen kişilerin soylu ailelerden gelmemesidir. Sıradan insanların yetiştirilip askeri ve idari görevlere getirilebildiğini anlatıyor.\n\nSeçenekler içinde insanları yetiştirerek devlet hizmetine kazandıran düzen devşirme sistemidir. Metindeki yetiştirme ve görev verme vurgusu bu sistemi işaret eder.\n\nVeraset, hükümdarlığın geçişiyle; lonca esnaf örgütlenmesiyle ilgilidir. İkta toprak gelirlerine, vakıf ise belirli bir hizmete ayrılan mal ve gelire ilişkindir. Metnin vurgusuna uyan C seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-05', 'pair': ['A-Sosyal_Bilimler-05', 'B-Sosyal_Bilimler-01'], 'narration': 'Tahrir işleminin metinde verilen işlevlerini izleyelim. Nüfus, toprak ve gelir kaynakları sayılarak kayıt altına alınıyor. Böylece vergiler ve toprak gelirlerinin dağıtımı düzenlenebiliyor.\n\nBu kayıtlar dirlik sisteminin işleyişine, gelir kaynaklarının yönetimine ve ekonomik düzenlemelere yardımcı olur. A, C, D ve E seçenekleri bu mali ve ekonomik işlemlerle bağlantılıdır.\n\nTaht mücadeleleri ise hanedan içindeki hükümdarlık ve veraset meselesidir. Tahririn anlatılan işlevlerinden, taht mücadelelerini önlediği sonucu çıkarılamaz. Savunulamayacak yargıyı veren B seçeneğini işaretliyoruz.'}, {'id': 'A-Sosyal_Bilimler-08', 'pair': ['A-Sosyal_Bilimler-08', 'B-Sosyal_Bilimler-07'], 'narration': 'Grafikte mavi sütunlar yağışı, pembe çizgi sıcaklığı gösteriyor. Sıcaklık için sağdaki derece ölçeğini okumalıyız.\n\nEn soğuk ay yaklaşık on derece. Diğer aylar on derecenin üstüne çıkıyor; yaz ortasında yirmi beş derecenin de üzerinde. Bütün ayların ortalaması bu durumda on dereceden büyük olur.\n\nYağışlar yaz aylarında yoğunlaşmış ve yıl içine eşit dağılmamış. En sıcak dönem yılın ortasına geldiği için Güney Yarım Küre ifadesi de grafiğe uymaz. Yıllık yağış miktarı aylık sütunların toplamıyla değerlendirilir, tek bir ayla değil.\n\nDoğrudan ulaşabildiğimiz yargı, yıllık sıcaklık ortalamasının on derecenin üzerinde olmasıdır. E seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-04', 'pair': ['A-Fen_Bilimleri-04', 'B-Fen_Bilimleri-03'], 'narration': 'Sürtünme önemsiz olduğu için hareket boyunca mekanik enerji korunur. Ka noktasından le noktasına inerken yükseklik azalır. Yerçekimi potansiyel enerjisi azalırken kinetik enerji artar. Birinci yargı doğrudur.\n\nLe noktasından em noktasına çıkarken bu dönüşüm tersine döner: kinetik enerji azalır, potansiyel enerji artar. Ancak ikisinin toplamı olan mekanik enerji azalmaz. İkinci yargı yanlıştır.\n\nKa ile le arasında yerçekimi kuvveti hareket yönünde iş yapar. Potansiyel enerjideki azalma kinetik enerjiye aktarılır; üçüncü yargı da doğrudur. Birinci ve üçüncü yargıları veren D seçeneğini işaretliyoruz.'}, {'id': 'A-Fen_Bilimleri-05', 'pair': ['A-Fen_Bilimleri-05', 'B-Fen_Bilimleri-02'], 'narration': 'Sürtünmesiz düşey atışta, cismin çıkabildiği en büyük yükseklik ilk hızın karesinin iki çarpı yerçekimi ivmesine bölümüdür. Bu bağıntıda kütle yer almaz.\n\nBu nedenle yalnız kütleyi azaltmak yüksekliği artırmaz. Birinci değişiklik işe yaramaz. İlk hızı artırırsak paydaki hızın karesi artar ve cisim daha yükseğe çıkar. İkinci değişiklik uygundur.\n\nYerçekimi ivmesini azaltırsak payda küçülür, yükseklik büyür. Üçüncü değişiklik de uygundur. Yüksekliği artıran ikinci ve üçüncü işlemleri birlikte veren D seçeneğini işaretliyoruz.'}]
          for item in items:
              try:
                  produce(item)
              except ProductionStop:
                  raise SystemExit(2)
              except Exception as error:
                  print('BATCH_STOP '+json.dumps({'id':item['id'],'error_type':type(error).__name__,'action':'Inspect saved artifacts before any new TTS request.'}))
                  raise SystemExit(3)

      - name: Preserve all generated audio and timestamps even after partial failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atolye-r12-batch04-${{ github.run_id }}
          path: atolye-r12-batch04/
          if-no-files-found: warn
          retention-days: 30
