name: Atolye TYT Batch01
run-name: Atolye TYT - 20 unique Turkish solutions - batch01
on:
  push:
    branches: [atolye-tyt-20260922]
    paths: [.github/workflows/atolye-tyt-batch01.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: atolye-tyt-audio
  cancel-in-progress: false
jobs:
  speech:
    if: github.ref == 'refs/heads/atolye-tyt-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ensure audio verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Generate approved Turkish narrations within included credits
        shell: python
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          import json, pathlib
          class ProductionStop(Exception): pass
          def produce(item):
              import os, sys, json, pathlib, urllib.request, urllib.error, base64, hashlib, re, math
              out = pathlib.Path('atolye-tyt-batch01')/item['id']
              out.mkdir(parents=True,exist_ok=True)
              voice = 'tZYpRZkmCNQcfmtDbhUg'
              model_id = 'eleven_v3'
              report = {'pair':item['pair'],
                        'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                        'commit':os.environ.get('GITHUB_SHA'), 'run_id':os.environ.get('GITHUB_RUN_ID'),
                        'credential_present':False,'api_called':False,'tts_called':False,
                        'audio_generated':False,'fallback_used':False,'video_completed':False,
                        'auditory_review':False}
              def save_report(status, **extra):
                  report.update(status=status, **extra)
                  (out/'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('ATOLYE_RESULT '+json.dumps(report,ensure_ascii=False))
              def stop(status, **extra):
                  save_report(status, **extra)
                  raise ProductionStop(status)
              key = os.environ.get('ELEVENLABS_API_KEY','').strip()
              if not key:
                  stop('blocked_missing_credential', required_secret='ELEVENLABS_API_KEY')
              report['credential_present'] = True
              # A rerun must never unknowingly spend credits twice. Use a fresh dispatch only after inspecting artifacts.
              if int(os.environ.get('GITHUB_RUN_ATTEMPT','1')) > 1:
                  stop('blocked_automatic_audio_regeneration', action='Inspect and reuse existing audio artifacts; fresh dispatch only if no audio was generated.')
              text=item['narration']
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              def call(path, payload=None):
                  report['api_called'] = True
                  req = urllib.request.Request('https://api.elevenlabs.io'+path,
                      headers={'xi-api-key':key,'Content-Type':'application/json'},
                      data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                      method='GET' if payload is None else 'POST')
                  try:
                      with opener.open(req, timeout=180) as response:
                          return json.loads(response.read(24000000)), response.headers.get('request-id')
                  except urllib.error.HTTPError as error:
                      try:
                          detail=json.loads(error.read(4000)).get('detail',{})
                          provider_code=detail.get('status') if isinstance(detail,dict) else None
                          if not isinstance(provider_code,str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,100}',provider_code) or key in provider_code:
                              provider_code=None
                      except Exception:
                          provider_code=None
                      stop('provider_error', http_status=error.code, provider_code=provider_code,
                           operation='tts' if payload is not None else path)
                  except Exception as error:
                      stop('transport_or_response_error', error_type=type(error).__name__,
                           tts_outcome_uncertain=payload is not None)
              voice_info,_=call('/v1/voices/'+voice)
              if voice_info.get('voice_id') != voice:
                  stop('blocked_voice_mismatch')
              report['voice_accessible'] = True
              models,_=call('/v1/models')
              selected=next((m for m in models if m.get('model_id')==model_id),None)
              if not selected or not selected.get('can_do_text_to_speech'):
                  stop('blocked_model_unavailable')
              report['model_accessible'] = True
              subscription,_=call('/v1/user/subscription')
              used=subscription.get('character_count')
              limit=subscription.get('character_limit')
              if type(used) is not int or type(limit) is not int or used<0 or limit<0:
                  stop('blocked_quota_not_verifiable')
              # No billing settings are changed. Stop unless paid overage is known to be disabled.
              extension=subscription.get('max_credit_limit_extension')
              overage_disabled=(type(extension) is int and extension==0) or subscription.get('can_extend_character_limit') is False
              if not overage_disabled:
                  stop('blocked_paid_overage_not_disabled', action='No audio request made; billing settings were not changed.')
              rates=selected.get('model_rates') or {}
              cost_factor=rates.get('character_cost_multiplier',selected.get('token_cost_factor'))
              if not isinstance(cost_factor,(int,float)) or isinstance(cost_factor,bool) or not math.isfinite(cost_factor) or cost_factor<=0:
                  stop('blocked_model_cost_not_verifiable')
              required=math.ceil(len(text)*max(1.0,float(cost_factor)))
              remaining=limit-used
              report.update(narration_characters=len(text), required_credits_conservative=required,
                            quota_checked=True, paid_overage_disabled=True, remaining_included_credits=remaining)
              if remaining < required:
                  stop('blocked_insufficient_included_credits', required_credits=required, remaining_included_credits=max(0,remaining))
              maximum=selected.get('maximum_text_length_per_request')
              tier_limit=selected.get('max_characters_request_free_user' if subscription.get('tier')=='free' else 'max_characters_request_subscribed_user')
              limits=[x for x in [maximum,tier_limit] if isinstance(x,int) and x>0]
              if limits and len(text)>min(limits):
                  stop('blocked_text_exceeds_model_limit', model_character_limit=min(limits))
              payload={'text':text,'model_id':model_id,'language_code':'tr',
                       'voice_settings':{'stability':0.5,'speed':0.94}}
              (out/'narration.txt').write_text(text,encoding='utf-8')
              report['narration_sha256']=hashlib.sha256(text.encode('utf-8')).hexdigest()
              report['tts_called']=True
              save_report('tts_request_started')
              result,request_id=call('/v1/text-to-speech/'+voice+'/with-timestamps?output_format=mp3_44100_128',payload)
              try:
                  audio=base64.b64decode(result['audio_base64'],validate=True)
                  if len(audio)<10000:
                      stop('invalid_audio_size')
                  (out/'speech.mp3').write_bytes(audio)
                  report.update(audio_generated=True, bytes=len(audio), sha256=hashlib.sha256(audio).hexdigest())
                  (out/'alignment.json').write_text(json.dumps({'alignment':result.get('alignment'),'normalized_alignment':result.get('normalized_alignment')},ensure_ascii=False,indent=2),encoding='utf-8')
                  alignment=result.get('normalized_alignment') or result.get('alignment')
                  if not alignment:
                      stop('audio_saved_but_alignment_missing', action='Reuse saved audio; do not regenerate for drawing.')
                  chars=alignment['characters']
                  starts=alignment['character_start_times_seconds']
                  ends=alignment['character_end_times_seconds']
                  assert len(chars)==len(starts)==len(ends)>0
                  assert all(isinstance(c,str) and len(c)==1 for c in chars)
                  assert all(math.isfinite(float(s)) and math.isfinite(float(e)) and 0<=float(s)<=float(e) for s,e in zip(starts,ends))
                  assert all(float(starts[i])<=float(starts[i+1]) for i in range(len(starts)-1))
                  joined=''.join(chars)
                  def segments(pattern):
                      return [{'text':m.group().strip(),'start':starts[m.start()],'end':ends[m.end()-1]} for m in re.finditer(pattern,joined) if m.group().strip()]
                  words=segments(r'\S+')
                  phrases=segments(r'[^.!?\n]+[.!?]?')
                  speech={'provider':'elevenlabs','voice_id':voice,'model_id':model_id,
                          'duration_alignment':max(ends),'word_timestamps':words,'phrase_timestamps':phrases,
                          'text':text,'request_id':request_id,'timing_source':'provider_character_alignment'}
                  (out/'speech.json').write_text(json.dumps(speech,ensure_ascii=False,indent=2),encoding='utf-8')
                  save_report('audio_saved_pending_decode', word_count=len(words),phrase_count=len(phrases),
                              last_alignment_second=max(ends), character_alignment_validated=True)
              except Exception as error:
                  stop('audio_processing_error',error_type=type(error).__name__,action='Inspect saved files before any new TTS request.')
              import subprocess
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(out/'speech.mp3')]))
              duration=float(probe['format']['duration'])
              assert math.isfinite(duration) and duration>1
              assert any(s['codec_type']=='audio' for s in probe['streams'])
              assert report['last_alignment_second']<=duration+0.5
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(out/'speech.mp3'),'-f','null','-'],check=True,capture_output=True)
              save_report('audio_generated_and_decoded',duration_seconds=duration,audio_decode_pass=True,auditory_review=False)

          items=[{'id': 'TYT-A-Turkce-01', 'pair': ['TYT-A-Turkce-01', 'TYT-B-Turkce-17'], 'narration': 'Sorudaki taş gibi oturmak sözünü gerçek anlamıyla değil, kişide bıraktığı duygusal etkiyle değerlendirelim. İnsanın içine taş oturması, yaşanan ya da okunan bir şeyin kişiyi derinden sarsması, ona ağır gelmesidir. Öykünün gerçekten yaşanmış olması veya hayatı olduğu gibi yansıtması bu sözün anlamı değildir. Karamsarlık da burada söylenenden daha dar bir yorumdur. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Turkce-02', 'pair': ['TYT-A-Turkce-02', 'TYT-B-Turkce-16'], 'narration': 'Bir esere imza atmak, onu meydana getirmek veya önemli bir işi başarmak anlamındadır. Yalnızca katkıda bulunmak, bu anlamı tam karşılamaz. Oya gibi işlemek özenli çalışmayı; içine çekmek güçlü biçimde etkilemeyi anlatır. Bu iki açıklama uygundur. Dönüşüm, kişinin değişmesini; kendini bulmak ise kişiliğini ve ruh özelliklerini tanımasını karşılar. Uyuşmayan açıklama, bir numaralı imza atmış sözündedir. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Turkce-03', 'pair': ['TYT-A-Turkce-03', 'TYT-B-Turkce-14'], 'narration': 'İlk boşluğun çevre sorunlarına yönelik farkına varma düzeyini anlatması gerekiyor. Farkındalık sözcüğü, son dönemde iyice arttı yüklemiyle uyumludur. İkinci boşlukta ülkelerin attığı adımların amacı çevreci yaklaşımlar olmalıdır. Tahminler veya dikkatsizlik bağlama uymaz. Ancak sözü karşıtlık kuruyor. Plastik çok geniş bir alanda kullanıldığı için onu hayattan çıkarmak kolay olmayacak. Üç boşluğu birlikte karşılayan dizi budur. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Turkce-04', 'pair': ['TYT-A-Turkce-04', 'TYT-B-Turkce-15'], 'narration': 'İkinci bölümde aklına gelmek, hatırlamak anlamında kalıplaşmış bir deyimdir. Deyimi bütün olarak arıyoruz. Üçüncü bölümde ecel teri dökmek, çok sıkılmak veya büyük bir korku ve güçlük yaşamak anlamında kullanılmıştır. Diğer dizelerde benzetme ve mecazlar bulunması, bu sözleri kendiliğinden deyim yapmaz. Deyim bulunan bölümler iki ve üçtür. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Turkce-05', 'pair': ['TYT-A-Turkce-05', 'TYT-B-Turkce-29'], 'narration': 'Parçadaki anahtar, eserin her okunuşta daha önce fark edilmeyen bir yönünü göstermesidir. Metin birden çok anlam katmanı taşır. Az veya sınırlı anlatım içinde çok sayıda düşünce ve anlam barındırma, yoğunluk özelliğidir. Akıcılık kolay okunmayı, yalınlık süssüz anlatımı, özgünlük ise başkasına benzememeyi anlatır. Burada vurgulanan, anlamın zenginliğidir. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Turkce-06', 'pair': ['TYT-A-Turkce-06', 'TYT-B-Turkce-28'], 'narration': 'Birinci cümle Türkiye’de farklı iklimlerin bulunduğunu, ikinci cümle bu iklimlere ihtiyaç duyan çok çeşitli bitkilerin yetiştiğini söylüyor. Birleştirmede iki cümlenin ortak ilişkisini korumalıyız: iklim çeşitliliği, bitki çeşitliliğini destekler. Tarım yatırımı, sanayi, ihracat veya canlıların yayılma alanlarıyla ilgili yeni bir yargı ekleyemeyiz. Bu ilişkiyi doğru veren seçenek, Türkiye’nin bitki zenginliğini farklı iklimlere bağlayandır. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Turkce-07', 'pair': ['TYT-A-Turkce-07', 'TYT-B-Turkce-27'], 'narration': 'Müziğin evrenselliği, farklı toplumlara ulaşması ve başka kültürlerde de karşılık bulmasıdır. Konserin başka bir ülkede olması tek başına yeterli değildir. İlk dört seçenekte kültürler arası etkileşim ya da farklı coğrafyalarda kabul görme vardır. Son seçenekte ise Almanya’daki konsere Avrupa’da yaşayan Türklerin ilgisi anlatılıyor. Dinleyici topluluğu yine aynı kültür çevresindedir; evrensellik düşüncesine uzak düşen budur. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Turkce-08', 'pair': ['TYT-A-Turkce-08', 'TYT-B-Turkce-26'], 'narration': 'Ufuk sözcüğü ek alınca ufkundan biçimine dönüşmüş; ikinci hecedeki ünlü düşmüştür. Haz ve etmek birleşirken ünsüz türemesi olur. Şafak sözcüğüne gelen ek de şafaktan biçiminde sertleşir; bu, ünsüz benzeşmesidir. Hazzetmeyen sözünde, olumsuzluk ekinden sonra gelen ye sesi kaynaştırmadır. Buna karşılık dizelerde pe, çe, te, ke seslerinin yumuşamasına bir örnek yoktur. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Turkce-09', 'pair': ['TYT-A-Turkce-09', 'TYT-B-Turkce-05'], 'narration': 'Birinci seçenekte bulunma eki bitişik yazılmalı: sende. İkinci seçenekte sanatsever birleşik yazılır. Belirli bir tarih bildirmeyen eylül ayı küçük harfle başlar. Son seçenekteki sözcüğün doğru biçimi yalnızcadır; yanlızca değildir. Ne var ki sözündeki ki bağlaçtır ve ayrı yazılmıştır. Bu kitabı dün aldı ne var ki henüz okuyamadı cümlesinde yazım yanlışı yoktur. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Turkce-10', 'pair': ['TYT-A-Turkce-10', 'TYT-B-Turkce-06'], 'narration': 'İki numarada biliminsanları bitişik yazılmış. Bilim insanı ayrı yazılır; çoğulu da bilim insanları olmalıdır. İklim, dünyadaki, birbiriyle ve ritim sözcüklerinin bu cümlelerdeki yazımları uygundur. Dünyadaki sözündeki ki ektir, bitişik yazılır. Soruda bu kuralla bağlacı karıştırmadan, yanlış olan ikinci numarayı seçmeliyiz. Doğru cevap B seçeneğidir.'}, {'id': 'TYT-A-Turkce-11', 'pair': ['TYT-A-Turkce-11', 'TYT-B-Turkce-04'], 'narration': 'İlk yerde uzun cümlenin öznesinden sonra virgül kullanılabilir. İki, üç ve dört numarada ise sıralanan eş görevli sözler virgülle ayrılır. Beş numaranın öncesinde insan yüreğinin bir evren olduğu yargısı tamamlanır. Sonrasında kişi ne kadar yetkin olursa olsun diye yeni bir cümle başlar. Bu iki cümleyi noktalı virgülle ayırmak uygundur. Dolayısıyla diğerlerinden farklı işaret gerektiren yer beş numaradır. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Turkce-12', 'pair': ['TYT-A-Turkce-12', 'TYT-B-Turkce-02'], 'narration': 'Altı çizili gözleme sözcüğünü ayıralım. Göz isim köküne le eki gelerek gözlemek fiili, ardından me değil, m isim yapım ekiyle gözlem adı oluşur. Sonundaki e ise yönelme hâl ekidir. İki yapım eki olan le ve m yeni sözcükler türetir; hâl eki yalnız cümledeki görevi belirler. Sözcü sözden, ekin ekmek fiilinden, batı batmak fiilinden türemiştir. Çabucak da bu düzeyde tek yapım ekiyle değerlendirilir. İstenen örnek gözlemedir. Doğru cevap A seçeneğidir.'}, {'id': 'TYT-A-Turkce-13', 'pair': ['TYT-A-Turkce-13', 'TYT-B-Turkce-03'], 'narration': 'Yamaçlarda koyu yeşil çamlar, aşağılarda açık yeşil çınarlar, kavaklar ifadesinde yüklem söylenmemiştir. Bu, eksiltili bir cümledir. Kavaklar sözcüğünün ardından dört numarada nokta konmuş. Eksiltili anlatımı göstermek için burada üç nokta beklenir. Özel ada gelen ekin kesmeyle ayrılması, sıralanan sözler arasındaki virgüller ve tamamlanmış cümle sonundaki nokta uygundur. Hata dört numaradadır. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Turkce-14', 'pair': ['TYT-A-Turkce-14', 'TYT-B-Turkce-01'], 'narration': 'Yüklem yaşatıyor, özne ise uzun köprüleri diye başlayıp bu kanyon diye biten söz grubudur. Bu grupta sıfat tamlamaları vardır; açık bir isim tamlaması kurulmamıştır. Bir masalın büyülü dünyasını sözünde isim tamlaması vardır; büyülü dünya sıfat tamlaması da tamlananı oluşturur. Burayı gezmeye gelenlere sözünde gezme isim fiili ve gelen sıfat fiili bulunur. Her zaman sıfat tamlamasıdır ve zaman zarfıdır. Yaşatıyor da yaş isim köküne dayanır. Söylenemeyen, özneyle ilgili seçenektir. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Turkce-15', 'pair': ['TYT-A-Turkce-15', 'TYT-B-Turkce-33'], 'narration': 'İzleyebilirsiniz yükleminde yeterlik bildiren kurallı birleşik fiil vardır. Oturup ve çıkarırken zarf fiil, dolaşan ve uçan ise sıfat fiildir. Sessizlik içerisinde sözü oturma eyleminin nasıl gerçekleştiğini belirtir. Ayrıca parçada sözcük hâlinde bir zamir kullanılmamıştır. Muhteşem manzaraların keyfi, sıfatla genişletilmiş belirtili isim tamlamasıdır. Muhteşem manzaralar bir sıfat tamlaması olduğu için yapı zincirleme isim tamlaması sayılmaz. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Turkce-16', 'pair': ['TYT-A-Turkce-16', 'TYT-B-Turkce-32'], 'narration': 'Parça, yazarın hayatındaki kırılma noktalarından ve Küçük Prens’in onda bıraktığı etkiden söz ediyor. Dördüncü cümle çocuk edebiyatında ulusallık ve evrensellik tartışmasına geçiyor. Bu, kişisel etki ve kitabın yazılış amacı çizgisinden ayrılır. Dördü çıkardığımızda üçüncü cümlede anılan yazar, beşinci cümlenin o zamiriyle doğrudan devam eder. Akışı bozan dört numaralı cümledir. Doğru cevap C seçeneğidir.'}, {'id': 'TYT-A-Turkce-17', 'pair': ['TYT-A-Turkce-17', 'TYT-B-Turkce-31'], 'narration': 'Eklenecek olabilir de olmayabilir de cümlesi, bir sonucun kesin olmadığını belirten yargının hemen ardından gelmelidir. Büyük bir sonucun çıkacağını vaat edemezsiniz cümlesi bu anlamı hazırlar. Ardından olabilir de olmayabilir de denebilir. Sonraki çünkü cümlesi, bir keşif veya icadın garanti edilememesini açıklar. Bu nedenle ekleme yeri beş numaralı boşluktur. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Turkce-18', 'pair': ['TYT-A-Turkce-18', 'TYT-B-Turkce-30'], 'narration': 'Parçada vergi olarak alınan ipeğin, demirin ve başka ürünlerin ticareti üzerinde duruluyor. Bilge Kağan bunların Türkler için önemini kavramıştır. Ötüken’de kalma öğüdü, bu ticari konumu ve geçmiş deneyimleri dikkate alan bir değerlendirmeyle açıklanıyor. Metin, bir savaştaki cesareti veya sabrı anlatmıyor. İleri görüşlülük daha genel bir özellik olsa da vurgunun odağı ekonomik ilişkileri doğru değerlendirmesidir. Doğru cevap E seçeneğidir.'}, {'id': 'TYT-A-Turkce-19', 'pair': ['TYT-A-Turkce-19', 'TYT-B-Turkce-23'], 'narration': 'Fuzûlî ile diğer şairler aynı hikâyeyi işlemiş; Baudelaire de daha önce işlenen konuları yeniden ele almıştır. Buna rağmen eserlerin değerleri aynı değildir. Örnekler, konunun tek başına eseri değerli kılmadığını gösterir. Sanatçının konuyu nasıl işlediği ve anlattığı belirleyicidir. Her sanatçının ayrı bir üslubu vardır demek daha sınırlı kalır. İki örneğin ortak sonucu, yapıtın değerini konusundan çok söyleyişinden almasıdır. Doğru cevap D seçeneğidir.'}, {'id': 'TYT-A-Turkce-20', 'pair': ['TYT-A-Turkce-20', 'TYT-B-Turkce-22'], 'narration': 'Birinci cümleden başlayarak iklim değişikliğinin sonuçları, ekonomiye yansıması ve altyapıya etkisi izleniyor. İkinci cümle ise iklim değişikliğinin nedenini, atmosferde artan sera gazlarını anlatıyor. Sonuçları ele alan çizgi içinde başka bir açıklama açıyor. İkinciyi çıkardığımızda sıcaklık ve yağış değişikliklerinden, bu değişimin ekonomik ve sosyal etkilerine geçiş düzgün olur. Akışı bozan ikinci cümledir. Doğru cevap A seçeneğidir.'}]
          for item in items:
              try:
                  produce(item)
              except ProductionStop:
                  raise SystemExit(2)
              except Exception as error:
                  print('BATCH_STOP '+json.dumps({'id':item['id'],'error_type':type(error).__name__,'action':'Inspect saved artifacts before any new TTS request.'}))
                  raise SystemExit(3)

      - name: Preserve generated audio and provider timestamps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atolye-tyt-batch01-${{ github.run_id }}
          path: atolye-tyt-batch01/
          if-no-files-found: warn
          retention-days: 30
